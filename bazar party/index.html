
<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152A"><meta name="description" content="BAZAR Party : jeux de soirée sur téléphone, Undercover, Codenames, Petit Bac et Dessins."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23B8FF45'/%3E%3Crect x='25' y='18' width='24' height='32' rx='4.5' fill='%2310152A' transform='rotate(8 37 34)'/%3E%3Ccircle cx='37' cy='35' r='5' fill='%23B8FF45'/%3E%3C/svg%3E"><style>html,body{margin:0}</style>
<title>BAZAR Party</title>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAZAR Party">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concept : une colonne mobile sur bleu nuit, une seule action principale par écran, le violet réservé aux cartes et au secret, le vert citron réservé à l'action. */
:root{
  --bg:#10152A; --surface:#1B2140; --surface-2:#252C52; --line:#323A68;
  --fg:#F4F4F8; --muted:#AAB0CC;
  --lime:#B8FF45; --lime-ink:#10152A;
  --violet:#7957FF; --violet-soft:#AB9BFF;
  --danger:#FF8585;
  --field:#E9EBF7; --field-ink:#10152A; --field-hint:#646B91;
  --display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:20px;padding-block:14px;-webkit-text-size-adjust:100%}
#app{min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.01em}
h1{font-size:clamp(34px,10vw,44px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.wrap{width:100%;max-width:480px;margin-inline:auto;flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.bar{width:100%;max-width:480px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:10px}
.bar .t{font:600 16px var(--display);text-align:center;flex:1;min-width:0}
.bar .meta{font:600 15px var(--display);color:var(--muted)}
.icon-btn{width:44px;height:44px;min-width:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;font:600 20px var(--display)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn svg{width:22px;height:22px}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.btn{min-height:56px;width:100%;border-radius:var(--r);border:2px solid transparent;font:700 18px var(--display);padding:0 22px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--lime);color:var(--lime-ink)}
.btn-secondary{background:transparent;color:var(--fg);border-color:var(--violet)}
.btn-violet{background:var(--violet);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn-sm{min-height:46px;font-size:16px;width:auto;align-self:flex-start;padding:0 18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.985)}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lead{font-size:18px;color:var(--muted);text-wrap:pretty}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--violet-soft)}
.count{font:600 14px var(--display);color:var(--muted);margin-left:6px}
.brand{display:flex;align-items:center;gap:14px}
.wm{display:flex;flex-direction:column;line-height:1}
.wm1{font:700 38px var(--display);letter-spacing:-.02em}
.wm2{font:700 20px var(--display);letter-spacing:.04em;color:var(--lime);margin-top:4px}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.game{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;border:0;color:var(--fg);width:100%;font:inherit;cursor:pointer}
.game[disabled]{cursor:default;opacity:.8}
.tile{width:64px;height:64px;min-width:64px;border-radius:var(--r-sm);display:grid;place-items:center}
.tile svg{width:30px;height:30px}
.tile.v{background:var(--violet);color:#fff}
.tile.w{background:var(--fg);color:var(--violet)}
.game .gt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.game .gt b{font:700 20px var(--display)}
.badge{font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--violet);color:var(--violet-soft);white-space:nowrap}
.badge.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.prow{display:flex;align-items:center;gap:10px}
.plist{display:flex;flex-direction:column;gap:10px}
.av{width:44px;height:44px;min-width:44px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--display)}
.av.sm{width:36px;height:36px;min-width:36px;font-size:15px}
.field{flex:1;min-width:0;height:48px;border-radius:var(--r-sm);border:2px solid transparent;background:var(--field);color:var(--field-ink);font:500 17px var(--body);padding:0 14px}
.field::placeholder{color:var(--field-hint)}
.field:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.row .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .lbl b{font:600 17px var(--display)}
.step{display:flex;align-items:center;gap:12px}
.num{font:700 26px var(--display);min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.sw{width:56px;height:32px;min-width:56px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--lime)}
.sw[aria-checked="true"]::after{transform:translateX(24px);background:var(--lime-ink)}
.sw:disabled{opacity:.35;cursor:not-allowed}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:4px;border-radius:var(--r-sm)}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 15px var(--display);cursor:pointer;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 14px var(--display);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.links{display:flex;gap:16px}
.link{background:none;border:0;color:var(--violet-soft);font:600 14px var(--display);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.dock{position:sticky;bottom:0;margin-top:auto;padding-top:12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px;margin-inline:auto}
.issue{font-size:14px;color:var(--danger);min-height:20px;text-align:center}
.sum{font:600 15px var(--display);color:var(--violet-soft)}
.who{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-block:28px}
.who .big{font:700 clamp(36px,12vw,52px) var(--display);overflow-wrap:anywhere}
.hold{position:relative;min-height:320px;border-radius:26px;background:var(--violet);color:#fff;display:grid;place-items:center;text-align:center;padding:24px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.hold .front{display:flex;flex-direction:column;align-items:center;gap:14px}
.hold .front svg{width:56px;height:56px}
.hold .front b{font:700 24px var(--display)}
.hold .back{display:none;flex-direction:column;gap:10px;align-items:center}
.hold.show{background:var(--fg);color:var(--bg)}
.hold.show .front{display:none}
.hold.show .back{display:flex}
.word{font:700 clamp(38px,13vw,58px) var(--display);overflow-wrap:anywhere;line-height:1.05}
.order{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface);border:2px solid transparent}
.orow.cur{border-color:var(--lime);background:var(--surface-2)}
.orow.done{opacity:.55}
.orow .nm{flex:1;min-width:0;font:600 17px var(--display);overflow-wrap:anywhere}
.orow .st{width:24px;height:24px;color:var(--lime)}
.now{text-align:center;display:flex;flex-direction:column;gap:6px;padding-block:6px}
.now .big{font:700 clamp(28px,9vw,38px) var(--display);overflow-wrap:anywhere}
.timer{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--lime);transition:width 1s linear}
.tl{font:700 22px var(--display);text-align:center;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:var(--r);background:var(--surface);border:2px solid transparent;color:var(--fg);font:600 17px var(--display);cursor:pointer;min-height:104px;overflow-wrap:anywhere;text-align:center}
.pick[aria-pressed="true"]{border-color:var(--violet);background:var(--surface-2)}
.tally{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.trow .nm{font:600 16px var(--display);overflow-wrap:anywhere}
.trow .ct{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.trow .tb{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.trow .tb i{display:block;height:100%;background:var(--violet)}
.flip{perspective:1100px}
.flip-in{position:relative;min-height:250px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.fr{background:var(--violet);color:#fff;border:0;width:100%;font:inherit;cursor:pointer}
.face.bk{background:var(--fg);color:var(--bg);transform:rotateY(180deg)}
.face .role{font:700 32px var(--display)}
.face .role.uc{color:#5A3FD6}
.win{text-align:center;display:flex;flex-direction:column;gap:10px;padding-block:14px;animation:pop .5s ease-out}
.win h1{color:var(--lime)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.rl{display:flex;align-items:center;gap:12px}
.rl .nm{flex:1;min-width:0;font:600 17px var(--display);overflow-wrap:anywhere}
.tag{font:600 12px var(--display);letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.tag.uc{background:var(--violet)}
.tag.mw{background:var(--fg);color:var(--bg)}
.pts{font:700 16px var(--display);color:var(--lime);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.words div{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:4px}
.words b{font:700 20px var(--display);overflow-wrap:anywhere}
.mwin{width:100%}
.steps{display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.steps li{display:flex;gap:14px;align-items:flex-start}
.steps .n{width:34px;height:34px;min-width:34px;border-radius:50%;background:var(--violet);display:grid;place-items:center;font:700 16px var(--display)}
details{background:var(--surface);border-radius:var(--r-sm);padding:14px 16px}
summary{font:600 16px var(--display);cursor:pointer}
details p{margin-top:8px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(8,10,22,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto}
.sheet ul{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.note{font-size:14px;color:var(--muted);text-align:center}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(184,255,69,.5)}50%{box-shadow:0 0 0 9px rgba(184,255,69,0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-7px) rotate(.5deg)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(28deg)}}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.12)}}
.enter .wrap>*{animation:rise .5s ease-out both}
.enter .wrap>*:nth-child(2){animation-delay:.07s}
.enter .wrap>*:nth-child(3){animation-delay:.14s}
.enter .wrap>*:nth-child(4){animation-delay:.21s}
.enter .wrap>*:nth-child(5){animation-delay:.28s}
.enter .wrap>*:nth-child(n+6){animation-delay:.34s}
.enter .dock{animation:rise .5s .2s ease-out both}
.enter .plist>*{animation:rise .4s calc(var(--i,0)*70ms + .1s) ease-out both}
.enter .trow .tb i{transform-origin:left;animation:grow .9s .2s ease-out both}
.orow.cur{animation:ring 1.6s ease-out infinite}
.wrap>.hold{animation:float 3.4s ease-in-out infinite}
.wrap>.hold.show{animation:none}
.pick[aria-pressed="true"]{animation:pop .28s ease-out}
.shake{animation:shake .6s}
.timer.low i{background:var(--danger)}
.tl.low{color:var(--danger);animation:beat .5s ease-in-out infinite alternate}
.brand{position:relative}
.star{position:absolute;color:var(--lime);animation:drift 4.2s ease-in-out infinite,twinkle 2.6s ease-in-out infinite}
.star svg{width:100%;height:100%;fill:currentColor;stroke:none}
.wrap.wide{max-width:560px}
.mbar{gap:8px}
.tchip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:2px solid transparent;font:600 14px var(--display)}
.tchip b{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.tchip .tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.tchip.on{border-color:currentColor;background:var(--surface-2)}
.tchip.t0,.lg.t0,.t0 .bigsym,.clue.t0 .inl{color:var(--lime)}
.tchip.t1,.lg.t1,.t1 .bigsym,.clue.t1 .inl{color:var(--violet-soft)}
.sy,.inl,.inl2,.bigsym{flex:none}
.inl{width:14px;height:14px}
.inl2{width:20px;height:20px}
.bigsym{width:.72em;height:.72em;margin-right:12px;vertical-align:-.02em}
.sy{position:absolute;top:4px;right:4px;width:12px;height:12px;opacity:.85}
.tm .big{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.tdot{color:var(--fg)}
.tdot.t0{background:var(--lime);color:var(--lime-ink)}
.tdot.t1{background:var(--violet);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font:600 13px var(--display);color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
.mc{position:relative;min-width:0;min-height:72px;border-radius:12px;border:2px solid transparent;background:var(--surface-2);color:var(--fg);font:700 clamp(11px,3.2vw,14px) var(--display);text-transform:uppercase;line-height:1.1;padding:8px 3px;display:grid;place-items:center;text-align:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mc.l2{font-size:clamp(10.5px,3vw,13px)}
.mc.l1{font-size:clamp(9.5px,2.6vw,12px)}
.mc[aria-disabled="true"]{cursor:default}
.mc.s{border-color:var(--lime);transform:translateY(-3px) scale(1.05);box-shadow:0 8px 18px rgba(0,0,0,.4);z-index:1}
.mc.r0{background:var(--lime);color:var(--lime-ink)}
.mc.r1{background:var(--violet);color:#fff}
.mc.r2{background:#C9CEEA;color:#10152A}
.mc.r3{background:#05060D;color:#fff;border-color:var(--danger)}
.mc.dim{opacity:.38}
.mc.new{animation:flipin .55s ease-out}
@keyframes flipin{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
.clue{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:var(--r);padding:14px 16px}
.clue.t0{background:rgba(184,255,69,.14)}
.clue.t1{background:rgba(121,87,255,.28)}
.clue .cw{font:700 clamp(24px,8vw,32px) var(--display);text-transform:uppercase;overflow-wrap:anywhere;line-height:1.1}
.clue .cn{font:700 40px var(--display);min-width:44px;text-align:center}
.notice{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;font:600 15px var(--display);text-align:center}
.lbl2{font:600 15px var(--display)}
.ta{height:auto;min-height:100px;padding:12px 14px;resize:vertical;width:100%;flex:none;line-height:1.4}
.win.t1 h1{color:var(--violet-soft)}
.codetag{font:700 15px var(--display);letter-spacing:.06em;color:var(--lime);background:var(--surface);border-radius:999px;padding:8px 14px}
.codebig{font:700 clamp(54px,18vw,76px) var(--display);letter-spacing:.14em;text-align:center;color:var(--lime);line-height:1;padding-left:.14em}
.qrbox{align-self:center;background:#fff;border-radius:16px;padding:6px;line-height:0}
.qrbox svg{max-width:100%;height:auto}
.btn-half{flex:1;min-width:0;font-size:16px;padding:0 10px}
.tcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.pp{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font:600 15px var(--display)}
.hold.mini{min-height:96px;border-radius:18px;padding:12px}
.hold.mini .front{flex-direction:row;gap:10px}
.hold.mini .front svg{width:30px;height:30px}
.hold.mini .front b{font-size:17px}
.wrap>.hold.mini{animation:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);font:600 15px var(--display);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
.lletter{width:84px;height:84px;min-width:84px;border-radius:24px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font:700 56px var(--display);animation:pop .5s ease-out}
.lletter.big{width:150px;height:150px;font-size:100px;border-radius:40px}
.lhead{display:flex;align-items:center;gap:16px}
.lp{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.lp label,.lq{font:600 17px var(--display);line-height:1.3}
.blank{display:inline-block;min-width:44px;border-bottom:3px solid var(--lime);margin:0 3px}
.lin.bad{border-color:var(--danger)}

<script>
/* BAZAR Party : pont entre le jeu et la base Netlify (fonction /api/kv). */
(function(){
  if(window.claude)return;
  var API='/api/kv',POLL=1500;
  function par(p){return p.split('/').slice(0,-1).join('/')}
  async function call(body){
    var r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
    catch(e){throw {code:'unavailable',message:'réseau'}}
    var j=null;try{j=await r.json()}catch(e){}
    if(!r.ok)throw {code:(j&&j.code)||'unavailable',message:(j&&j.error)||('HTTP '+r.status)};
    return j}
  function mkDoc(p,r){return {id:p.split('/').pop(),exists:!!r.exists,data:function(){return r.exists?r.data:undefined}}}
  function mkColl(l){return {docs:(l||[]).map(function(x){return {id:x.id,exists:true,data:function(){return x.data}}})}}
  /* Toutes les écoutes d'un téléphone sont regroupées en une seule requête toutes les 1,5 s. */
  var subs=[],timer=null,busy=false,again=false,fails=0;
  function kick(ms){clearTimeout(timer);timer=setTimeout(tick,ms==null?POLL+Math.floor(Math.random()*300):ms)}
  async function tick(){
    if(!subs.length)return;
    if(document.hidden){kick();return}
    if(busy){again=true;return}
    busy=true;var list=subs.slice();
    try{var res=await call({op:'watch',items:list.map(function(s){return {k:s.kind,p:s.p}})});fails=0;
      list.forEach(function(s,i){if(s.dead)return;var r=res[i],j,snap;
        if(s.kind==='doc'){j=JSON.stringify(r);snap=mkDoc(s.p,r)}
        else{j=JSON.stringify((r||[]).map(function(x){return [x.id,x.data]}).sort());snap=mkColl(r)}
        if(j!==s.last){s.last=j;try{s.cb(snap)}catch(e){console.error(e)}}})}
    catch(e){fails++;if(fails===6)list.forEach(function(s){if(!s.dead&&s.er)s.er(e)})}
    busy=false;
    if(again){again=false;kick(0)}else kick()}
  function sub(kind,p,cb,er){var s={kind:kind,p:p,cb:cb,er:er,last:null,dead:false};subs.push(s);kick(0);
    return function(){s.dead=true;var i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)kick(0)});
  async function write(body){var r=await call(body);kick(60);return r}
  function doc(p){return {id:p.split('/').pop(),path:p,
    get:async function(){return mkDoc(p,await call({op:'get',path:p}))},
    set:function(d){return write({op:'set',path:p,data:d})},
    update:function(d){return write({op:'update',path:p,data:d})},
    delete:function(){return write({op:'delete',path:p})},
    onSnapshot:function(cb,er){return sub('doc',p,cb,er)}}}
  function coll(c){return {path:c,
    get:async function(){return mkColl(await call({op:'list',path:c}))},
    doc:function(id){return doc(c+'/'+id)},
    onSnapshot:function(cb,er){return sub('coll',c,cb,er)}}}
  var uid=null;
  try{uid=localStorage.getItem('bazar-uid')}catch(e){}
  if(!uid){uid='u'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('bazar-uid',uid)}catch(e){}}
  var DBN={doc:doc,collection:coll},USR={id:async function(){return uid},can:async function(){return true},isOwner:async function(){return false},canEdit:async function(){return false}};
  window.claude={use:function(n){return Promise.resolve(n==='db'?DBN:(n==='user'?USR:null))}};
})();
</script>

  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=(o.speed||7)*(.35+Math.random()*.9);
    PS.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up==null?3:o.up),r:(o.size||11)*(.5+Math.random()),rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:0,max:(o.life||70)+Math.random()*30,c:cols[Math.floor(Math.random()*cols.length)],g:o.g==null?.22:o.g})}
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){fxc.clearRect(0,0,fx.width,fx.height);
  PS=PS.filter(function(p){p.life++;p.vx*=.985;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;return p.life<p.max&&p.y<innerHeight+40});
  PS.forEach(function(p){var k=1-p.life/p.max;fxc.globalAlpha=Math.max(0,Math.min(1,k*1.6));fxc.fillStyle=p.c;starPath(fxc,p.x*DPR,p.y*DPR,p.r*DPR*(.6+k*.4),p.rot)});
  fxc.globalAlpha=1;
  if(PS.length){raf=requestAnimationFrame(tick)}else{raf=0;fxc.clearRect(0,0,fx.width,fx.height)}}
function centerOf(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function celebrate(el,big){var c=el?centerOf(el):[innerWidth/2,innerHeight/2.5];burst(c[0],c[1],big?90:55,{speed:big?10:8,size:big?14:11});vib(big?[30,40,30,40,60]:[40])}
function fanfare(cols){if(RM)return;var w=innerWidth,h=innerHeight;
  function o(x){x.cols=cols||COLS;return x}
  burst(w*.2,h*.35,50,o({speed:9}));
  setTimeout(function(){burst(w*.8,h*.35,50,o({speed:9}))},220);
  setTimeout(function(){burst(w*.5,h*.25,80,o({speed:11,size:14}))},460);
  var n=0,iv=setInterval(function(){burst(Math.random()*w,-10,6,o({speed:2,up:-2,g:.12,life:130}));if(++n>14)clearInterval(iv)},140);
  vib([40,50,40,50,120])}
function sad(el){if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
  if(el&&!RM){var c=centerOf(el);burst(c[0],c[1],18,{cols:['#FF8585','#AAB0CC','#323A68'],speed:4,g:.3,size:8,life:50})}vib([60,40,100])}
function tapSparkle(el){if(!el||RM)return;var c=centerOf(el);burst(c[0],c[1],8,{speed:5,size:8,life:40})}

function clearT(){if(T){clearInterval(T);T=null}}
function paintT(){var l=document.getElementById('tleft'),b=document.getElementById('tbar');if(l){l.textContent=TL+' s';l.classList.toggle('low',TL<=5)}if(b){b.style.width=Math.max(0,(TL/TT)*100)+'%';if(b.parentNode)b.parentNode.classList.toggle('low',TL<=5)}}
function startT(sec,end){clearT();TL=sec;TT=sec;paintT();T=setInterval(function(){TL--;paintT();if(TL<=0){clearT();vib([80,60,80]);end()}},1000)}

/* ---------- Moteur ---------- */
function order(g){var al=g.base.filter(function(id){return g.alive.indexOf(id)>=0});if(!al.length)return al;var r=(g.round-1)%al.length;al=al.slice(r).concat(al.slice(0,r));if(al.length>1&&g.roles[al[0]]==='mw'){var j=al.findIndex(function(id){return g.roles[id]!=='mw'});if(j>0){var t=al[0];al[0]=al[j];al[j]=t}}return al}
function wordOf(g,id){var r=g.roles[id];return r==='civil'?g.civ:(r==='uc'?g.uc:null)}
function startGame(){
  fixSettings();
  S.players.forEach(function(p){p.name=p.name.trim()});
  var st=S.settings;
  var pool=[];PAIRS.forEach(function(p,i){if(st.cats.indexOf(p[2])>=0)pool.push(i)});
  var fresh=pool.filter(function(i){return S.used.indexOf(i)<0});
  if(!fresh.length){S.used=S.used.filter(function(i){return pool.indexOf(i)<0});fresh=pool}
  var idx=fresh[Math.floor(Math.random()*fresh.length)];S.used.push(idx);try{localStorage.setItem(PAIRKEY,JSON.stringify(S.used))}catch(e){}
  var pr=PAIRS[idx],flip=Math.random()<.5;
  var ids=S.players.map(function(p){return p.id}),sh=shuffle(ids),roles={},k=0,i;
  for(i=0;i<st.uc;i++)roles[sh[k++]]='uc';
  for(i=0;i<st.mw;i++)roles[sh[k++]]='mw';
  for(;k<sh.length;k++)roles[sh[k]]='civil';
  var base=shuffle(ids);
  if(roles[base[0]]==='mw'){var j=-1;for(i=0;i<base.length;i++)if(roles[base[i]]!=='mw'){j=i;break}var t=base[0];base[0]=base[j];base[j]=t}
  S.game={civ:flip?pr[1]:pr[0],uc:flip?pr[0]:pr[1],cat:pr[2],roles:roles,alive:ids.slice(),base:base,round:1,ri:0,rs:'who',speak:0,vote:null,elim:null,flipped:false,tally:null,mw:null,winner:null,gains:null};
  save();go('reveal');
}
function nextSpeaker(){var g=S.game,o=order(g);g.speak++;if(g.speak>=o.length){clearT();beginVote(g.alive.slice(),false)}else{render();clueTimer()}}
function beginVote(cand,revote){var g=S.game;g.vote={cand:cand,voters:order(g),idx:0,stage:'pass',picks:{},sel:null,revote:revote};go('vote')}
function tally(){
  var g=S.game,v=g.vote,counts={};v.cand.forEach(function(id){counts[id]=0});
  Object.keys(v.picks).forEach(function(k){counts[v.picks[k]]++});
  var rows=v.cand.map(function(id){return {id:id,n:counts[id]}}).sort(function(a,b){return b.n-a.n});
  var top=rows[0].n,tied=rows.filter(function(r){return r.n===top}).map(function(r){return r.id});
  if(tied.length===1){g.tally=rows;g.elim=tied[0];go('result')}
  else if(!v.revote){beginVote(tied,true)}
  else{g.tally=rows;g.elim=null;go('result')}
}
function afterElim(){var g=S.game,id=g.elim;g.alive=g.alive.filter(function(x){return x!==id});if(g.roles[id]==='mw'){g.mw={text:'',ok:null};go('mwguess')}else resolve()}
function resolve(){var g=S.game,inf=g.alive.filter(function(i){return g.roles[i]!=='civil'}).length,civ=g.alive.length-inf;
  if(inf===0)return finish('civil');if(civ<=inf)return finish('inf');newRound()}
function newRound(){var g=S.game;g.round++;g.base=shuffle(g.alive);g.speak=0;g.elim=null;g.flipped=false;g.tally=null;g.vote=null;go('clues')}
function finish(w,who){var g=S.game;g.winner=w;g.mwWin=who||null;g.gains={};
  S.players.forEach(function(p){var r=g.roles[p.id];var won=(w==='civil'&&r==='civil')||(w==='inf'&&r!=='civil')||(w==='mw'&&p.id===who);g.gains[p.id]=won?PTS[r]:0;p.score+=g.gains[p.id]});
  save();go('end');setTimeout(function(){fanfare(w==='inf'?['#7957FF','#AB9BFF','#F4F4F8']:null)},350)}

function customWords(){var seen={},out=[];String(S.my.custom||'').split(/[\n,;]+/).forEach(function(w){w=w.trim();if(w.length<2||w.length>18)return;var k=key(w);if(seen[k])return;seen[k]=1;out.push(w)});return out}
function mIssue(){var m=S.my,cw=customWords();
  if(!m.names[0].trim()||!m.names[1].trim())return 'Chaque équipe a besoin d\'un nom.';
  if(norm(m.names[0])===norm(m.names[1]))return 'Les deux équipes ont le même nom.';

  return ''}

  var fresh=pool.filter(function(w){return S.mused.indexOf(key(w))<0});

/* ---------- QR code (générateur maison, mode octets, correction M, versions 1 à 6) ---------- */
function qrMake(text){

  /* codets de données */
  var bits=[];function put(x,len){for(var q=len-1;q>=0;q--)bits.push((x>>q)&1)}
  put(4,4);put(data.length,8);data.forEach(function(b){put(b,8)});
  var cap=T.d*8;for(i=0;i<4&&bits.length<cap;i++)bits.push(0);
  while(bits.length%8)bits.push(0);
  var cw=[];for(i=0;i<bits.length;i+=8){var x=0;for(j=0;j<8;j++)x=(x<<1)|bits[i+j];cw.push(x)}
  for(i=0;cw.length<T.d;i++)cw.push(i%2?0x11:0xEC);
  /* Reed-Solomon sur GF(256) */
  var EX=new Array(512),LG=new Array(256),g=1;
  for(i=0;i<255;i++){EX[i]=g;LG[g]=i;g<<=1;if(g&256)g^=0x11d}
  for(i=255;i<512;i++)EX[i]=EX[i-255];
  function mul(a,b){return a&&b?EX[LG[a]+LG[b]]:0}
  var gen=[1];
  for(i=0;i<T.e;i++){var ng=new Array(gen.length+1);for(j=0;j<ng.length;j++)ng[j]=0;
    for(j=0;j<gen.length;j++){ng[j]^=gen[j];ng[j+1]^=mul(gen[j],EX[i])}gen=ng}
  var blocks=[],ecs=[],pos=0;
  T.b.forEach(function(len){var blk=cw.slice(pos,pos+len);pos+=len;
    var res=blk.concat(new Array(T.e).fill(0));
    for(var a=0;a<len;a++){var c=res[a];if(c){for(var b=0;b<gen.length;b++)res[a+b]^=mul(gen[b],c)}}
    blocks.push(blk);ecs.push(res.slice(len))});
  var inter=[],maxLen=Math.max.apply(null,T.b);
  for(i=0;i<maxLen;i++)blocks.forEach(function(b){if(i<b.length)inter.push(b[i])});
  for(i=0;i<T.e;i++)ecs.forEach(function(b){inter.push(b[i])});
  var all=[];inter.forEach(function(b){for(var q=7;q>=0;q--)all.push((b>>q)&1)});
  if(v>=2)for(i=0;i<7;i++)all.push(0);
  /* matrice de base */
  var M=[],R=[];for(i=0;i<n;i++){M.push(new Array(n).fill(0));R.push(new Array(n).fill(false))}
  function set(r,c,val){if(r<0||c<0||r>=n||c>=n)return;M[r][c]=val?1:0;R[r][c]=true}
  function finder(r0,c0){for(var r=-1;r<=7;r++)for(var c=-1;c<=7;c++){
    var d=(r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);set(r0+r,c0+c,d)}}
  finder(0,0);finder(0,n-7);finder(n-7,0);
  for(i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0)}

function mkGameU(){var c=OL.cfg,ids=OL.plist.map(function(p){return p.id}),i,k=0;
  var pool=[];PAIRS.forEach(function(p,ix){if(c.cats.indexOf(p[2])>=0)pool.push(ix)});

  var idx=fresh[Math.floor(Math.random()*fresh.length)];OL.used.push(idx);try{localStorage.setItem('bazar-undercover-online-used-v2',JSON.stringify(OL.used))}catch(e){}
  var pr=PAIRS[idx],fl=Math.random()<.5,sh=shuffle(ids),roles={};
  for(i=0;i<c.uc;i++)roles[sh[k++]]='uc';
  for(i=0;i<c.mw;i++)roles[sh[k++]]='mw';
  for(;k<sh.length;k++)roles[sh[k]]='civil';
  var base=shuffle(ids);
  if(roles[base[0]]==='mw'){var j=-1;for(i=0;i<base.length;i++)if(roles[base[i]]!=='mw'){j=i;break}var t=base[0];base[0]=base[j];base[j]=t}
  var g={g:'u',gid:String(Date.now()),ph:'reveal',round:1,roles:roles,civ:fl?pr[1]:pr[0],uc:fl?pr[0]:pr[1],alive:ids.slice(),base:base,speak:0,seen:{},vote:null,elim:null,tally:null,mw:null,winner:null,mwWin:null,gains:null};
  g.secs=ids.map(function(id){return [id,{k:g.gid,w:wordOf(g,id)}]});return g}
function pubU(g){var s={g:'u',gid:g.gid,ph:g.ph,round:g.round,alive:g.alive,order:order(g),speak:g.speak,seen:Object.keys(g.seen),players:g.base,cat:null};
  if(g.vote){s.cand=g.vote.cand;s.revote=g.vote.revote;s.vk=g.vote.k;s.voted=Object.keys(g.vote.picks)}else s.voted=[];
  if(g.ph==='result'||g.ph==='mw'||g.ph==='end'){s.tally=g.tally;s.elim=g.elim;
    if(g.elim){var r=g.roles[g.elim];if(OL.cfg.reveal||r==='mw'){s.er=r}}}
  if(g.mw){s.mw={text:g.mw.text,ok:g.mw.ok};if(g.mw.ok!==null)s.civ=g.civ}
  if(g.ph==='end'){s.winner=g.winner;s.civ=g.civ;s.uc=g.uc;s.roles=g.roles;s.gains=g.gains;s.mwWin=g.mwWin}
  return s}
function huAct(uid,a,g){var ph=g.ph,host=uid===PID;
  switch(a.t){
    case 'seen':if(ph!=='reveal'||g.base.indexOf(uid)<0)return;g.seen[uid]=1;
      if(g.base.every(function(id){return g.seen[id]||!OL.players[id]}))huClues(g);break;
    case 'force':if(!host||ph!=='reveal')return;huClues(g);break;
    case 'next':{if(ph!=='clues')return;var o=order(g);if(!host&&o[g.speak]!==uid)return;
      g.speak++;if(g.speak>=o.length)huVote(g,g.alive.slice(),false);break}
    case 'vote':{if(ph!=='vote')return;var v=g.vote;
      if(g.alive.indexOf(uid)<0||a.k!==v.k||v.cand.indexOf(a.v)<0||a.v===uid)return;
      v.picks[uid]=a.v;
      if(g.alive.every(function(id){return v.picks[id]||!OL.players[id]}))huTally(g);break}
    case 'close':if(!host||ph!=='vote')return;huTally(g);break;
    case 'cont':if(!host||ph!=='result')return;huAfter(g);break;
    case 'mw':{if(ph!=='mw'||!g.mw||g.mw.ok!==null||uid!==g.elim)return;
      var tx=String(a.x||'').trim().slice(0,40);if(!tx)return;g.mw.text=tx;g.mw.ok=key(tx)===key(g.civ);break}
    case 'mwnext':if(!host||ph!=='mw'||!g.mw||g.mw.ok===null)return;
      if(g.mw.ok)huFinish(g,'mw',g.elim);else huResolve(g);break;
    default:return}}
function huClues(g){g.ph='clues';g.speak=0}
function huVote(g,cand,revote){g.ph='vote';g.vote={cand:cand,revote:revote,picks:{},k:g.round+'-'+(revote?2:1)+'-'+(Date.now()%100000)}}
function huTally(g){var v=g.vote,counts={};v.cand.forEach(function(id){counts[id]=0});
  Object.keys(v.picks).forEach(function(k){counts[v.picks[k]]++});
  var rows=v.cand.map(function(id){return {id:id,n:counts[id]}}).sort(function(a,b){return b.n-a.n}),top=rows[0].n,
    tied=rows.filter(function(r){return r.n===top}).map(function(r){return r.id});
  if(tied.length===1){g.tally=rows;g.elim=tied[0];g.ph='result'}
  else if(!v.revote)huVote(g,tied,true);
  else{g.tally=rows;g.elim=null;g.ph='result'}}
function huAfter(g){var id=g.elim;if(!id){huRound(g);return}
  g.alive=g.alive.filter(function(x){return x!==id});
  if(g.roles[id]==='mw'){g.mw={text:'',ok:null};g.ph='mw'}else huResolve(g)}
function huResolve(g){var inf=g.alive.filter(function(i){return g.roles[i]!=='civil'}).length,civ=g.alive.length-inf;
  if(inf===0)huFinish(g,'civil');else if(civ<=inf)huFinish(g,'inf');else huRound(g)}
function huRound(g){g.round++;g.base=shuffle(g.alive);g.speak=0;g.elim=null;g.tally=null;g.vote=null;g.mw=null;g.ph='clues'}
function huFinish(g,w,who){g.winner=w;g.mwWin=who||null;g.gains={};
  g.base.forEach(function(id){var r=g.roles[id],won=(w==='civil'&&r==='civil')||(w==='inf'&&r!=='civil')||(w==='mw'&&id===who);
    g.gains[id]=won?PTS[r]:0;OL.scores[id]=(OL.scores[id]||0)+g.gains[id]});
  g.ph='end'}

function hmAct(uid,a,g){var ph=g.ph,host=uid===PID,tm=g.teams[uid],cur=g.turn,nm=OL.cfg.names;
  switch(a.t){
    case 'clue':{if(ph!=='clue'||uid!==g.spies[cur])return;
      var w=String(a.w||'').trim().slice(0,24),n=Math.max(1,Math.min(10,Math.floor(+a.n)||1));
      if(!w||/\s/.test(w)||w.length<2||g.cards.some(function(c){return !c.rev&&key(c.w)===key(w)}))return;
      g.clue={w:w,n:n};g.left=n>=10?99:n+1;g.made=0;g.ph='guess';g.note='';break}
    case 'reveal':{if(ph!=='guess'||tm!==cur||uid===g.spies[cur])return;
      var i=Math.floor(+a.i),c=g.cards[i];if(!c||c.rev)return;hmVal(g,i);break}
    case 'fin':if(ph!=='guess'||tm!==cur||uid===g.spies[cur]||g.made<1)return;

function hmVal(g,i){var c=g.cards[i],me=g.turn,nm=OL.cfg.names,t=c.t;

  if(t===me){g.left--;if(g.left<=0)hmEnd(g,'Plus d\'essais : fin du tour de l\'équipe '+nm[me]+'.')}
  else hmEnd(g,t===2?'Carte innocente : fin du tour de l\'équipe '+nm[me]+'.':'Carte de l\'équipe '+nm[t]+' ! Fin du tour de l\'équipe '+nm[me]+'.')}

      '<div class="row"><div class="lbl"><b>Nombre de cartes</b><span class="muted small">'+(cn>=10?'Essais illimités':'Tes coéquipiers ont '+(cn+1)+' essais')+'</span></div><div class="step"><button type="button" class="icon-btn" data-act="omnm" aria-label="Moins"'+(cn<=1?' disabled':'')+'>−</button><span class="num">'+(cn>=10?'∞':cn)+'</span><button type="button" class="icon-btn" data-act="omnp" aria-label="Plus"'+(cn>=10?' disabled':'')+'>+</button></div></div>'+

/* ----- Actions ----- */
function olCopy(){var url=olLink(OL.code),el=document.getElementById('olink');
  function fallback(){if(el){el.focus();el.select();try{document.execCommand('copy')}catch(e){}}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('Lien copié')},fallback);return}}catch(e){}
  fallback();toast('Lien sélectionné : copie-le')}
function toast(msg){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=''},1800)}
function olShareNative(){var url=olLink(OL.code);
  if(navigator.share){navigator.share({title:'BAZAR Party',text:'Rejoins ma partie BAZAR Party : code '+OL.code,url:url}).catch(function(){})}else olCopy()}
function olAct(a,d){var c=OL.cfg||{},i;
  switch(a){
    case 'ohome':OH.err='';go('ohome');break;
    case 'omode':OH.game=d.g;OH.err='';go('ohome');break;
    case 'ogame':OH.game=d.g;render();break;
    case 'ocreate':olCreate();break;
    case 'ojoin':olJoin();break;
    case 'ocopy':olCopy();break;
    case 'oshare':olShareNative();break;
    case 'okick':if(OL.host&&d.id!==PID)Pd(OL.code,d.id).delete().then(function(){return Sd(OL.code,d.id).delete()}).catch(function(){});break;
    case 'oteam':Pd(OL.code,PID).update({team:+d.t,spy:false}).catch(function(){});break;
    case 'ospy':{var me=OL.players[PID]||{};Pd(OL.code,PID).update({spy:!me.spy}).catch(function(){});break}
    case 'ocucm':c.uc=Math.max(0,c.uc-1);olPushCfg();render();break;
    case 'ocucp':if(c.uc<maxUC(OL.plist.length,c.mw)){c.uc++;olPushCfg();render()}break;
    case 'ocmwm':c.mw=Math.max(0,c.mw-1);olPushCfg();render();break;
    case 'ocmwp':if(c.mw<maxMW(OL.plist.length,c.uc)){c.mw++;olPushCfg();render()}break;
    case 'occat':i=c.cats.indexOf(d.c);if(i>=0)c.cats.splice(i,1);else c.cats.push(d.c);olPushCfg();render();break;
    case 'occatall':c.cats=CATS.slice();olPushCfg();render();break;
    case 'occatnone':c.cats=[];olPushCfg();render();break;
    case 'ocreveal':c.reveal=!c.reveal;olPushCfg();render();break;
    case 'ocsize':c.size=+d.n;olPushCfg();render();break;
    case 'ostart':olStart();break;
    case 'osee':OL.my.seen=OL.s.gid;sendAct('seen');olRender();break;
    case 'oforce':sendAct('force');break;
    case 'onext':sendAct('next');break;
    case 'opick':OL.pick=d.id;render();break;
    case 'ovote':if(OL.pick){OL.my.vote=OL.s.vk;sendAct('vote',{v:OL.pick,k:OL.s.vk});olRender()}break;
    case 'oclose':sendAct('close');break;
    case 'oflip':{OL.flip=true;var f=document.getElementById('flip'),ct=document.getElementById('cont');if(f)f.classList.add('on');if(ct)ct.hidden=false;vib(30);
      var s=OL.s;setTimeout(function(){if(s.er&&s.er!=='civil')celebrate(f,true);else if(s.er)sad(f);else tapSparkle(f)},450);break}
    case 'ocont':sendAct('cont');break;
    case 'omwnext':sendAct('mwnext');break;
    case 'oagain':olLobby();break;
    case 'ohlobby':olLobby();break;
    case 'omnm':OL.cn=Math.max(1,OL.cn-1);render();break;
    case 'omnp':OL.cn=Math.min(10,OL.cn+1);render();break;
    case 'omsel':OL.sel=+d.i;vib(10);render();break;
    case 'omval':if(OL.sel!=null){sendAct('reveal',{i:OL.sel});OL.sel=null;render()}break;
    case 'omfin':sendAct('fin');break;
    case 'omskip':S.sheet=null;sendAct('skip');break;
    case 'oleave':olLeave();break;
    default:lAct(a,d)}}

/* ----- Saisie ----- */
app.addEventListener('input',function(e){var t=e.target,d=t.dataset||{};
  if(d.input==='oname'){OH.name=t.value;olStore({name:t.value.slice(0,16)})}
  else if(d.input==='ocode'){var v=t.value.replace(/\D/g,'').slice(0,4);if(v!==t.value)t.value=v;OH.code=v}
  else if(d.input==='oclw'){OL.cw=t.value}
  else if(d.input==='la'&&OL.on){OL.la[+d.i]=t.value;lRefresh();clearTimeout(OL.lt);OL.lt=setTimeout(lSend,450)}
  else if(d.input==='otname'&&OL.cfg&&OL.cfg.names){OL.cfg.names[+d.t]=t.value.slice(0,14)}});
app.addEventListener('change',function(e){var d=e.target.dataset||{};if(d.input==='otname'&&OL.on&&OL.host)olPushCfg()});
app.addEventListener('submit',function(e){var id=e.target.id;
  if(id==='omwform'){var el=document.getElementById('omwin'),v=el?el.value.trim():'';if(!v)return;OL.my.mw=OL.s.gid;sendAct('mw',{x:v});olRender()}
  else if(id==='oclue'){var s=OL.s,inp=document.getElementById('oclw'),w=(inp?inp.value:OL.cw).trim(),msg='';OL.cw=w;
    if(!w)msg='Écris un indice.';
    else if(/\s/.test(w))msg='Un seul mot, sans espace.';
    else if(w.length<2)msg='L\'indice est trop court.';
    else if(s.cards.some(function(c){return !c.rev&&key(c.w)===key(w)}))msg='Ce mot est sur la grille. Choisis-en un autre.';
    if(msg){OL.cerr=msg;var er=document.getElementById('oerr');if(er)er.textContent=msg;vib(40);return}
    OL.cerr='';sendAct('clue',{w:w,n:OL.cn});OL.cw=''}});
function olBoot(){var code=null,sv=olSaved();
  try{var mm=(location.href+' '+document.referrer).match(/(?:code=|rejoindre\/)(\d{4})\b/);if(mm)code=mm[1]}catch(e){}
  OH.name=sv.name||'';
  if(code){OH.code=code;S.screen='ohome'}
  olInit().then(function(ok){OLST=ok?'ok':'no';
    if(S.screen==='ohome')render();
    else if(ok&&!code&&sv.code&&S.screen==='home')olResume(sv.code)})}

function hlEnd(g,first){if(g.ph!=='play')return;clearTimeout(OL.tm);g.first=first||null;var items={},k;
  g.ids.forEach(function(uid){var a=g.ans[uid]||[],seen={};

      return {w:w,st:st}})});
  g.prompts.forEach(function(t,i){var m={};
    g.ids.forEach(function(uid){var it=items[uid][i];if(it.st==='ok'){var kk=key(it.w);(m[kk]=m[kk]||[]).push(it)}});

function hlTally(g){g.ids.forEach(function(uid){var tot=0;
    g.items[uid].forEach(function(it,i){var p=0;
      if(it.st==='ok'){var sum=0,n=0;Object.keys(g.votes).forEach(function(v){if(v===uid)return;var x=g.votes[v][uid+'|'+i];if(x!=null){sum+=x;n++}});
        var avg=n?sum/n:1;p=avg<.5?0:(avg<1.5?1:2);if(it.d)p=Math.min(p,1)}
      it.p=p;tot+=p});
    g.rtot=g.rtot||{};g.rtot[uid]=tot;g.tot[uid]=(g.tot[uid]||0)+tot});
  g.ph='result'}
function hlAct(uid,a,g){var host=uid===PID;
  switch(a.t){
    case 'ans':{if(g.ph!=='play'||g.ids.indexOf(uid)<0||Date.now()<g.startAt-500)return false;
      var arr=(Array.isArray(a.a)?a.a:[]).slice(0,g.np).map(function(x){return String(x||'').slice(0,40)});g.ans[uid]=arr;
      var n=arr.filter(function(x){return x.trim()}).length;if(g.prog[uid]===n)return false;g.prog[uid]=n;break}
    case 'done':{if(g.ph!=='play'||g.ids.indexOf(uid)<0||Date.now()<g.startAt)return false;
      var ar=(Array.isArray(a.a)?a.a:[]).slice(0,g.np).map(function(x){return String(x||'').trim().slice(0,40)}),seen={},ok=ar.length===g.np;
      ar.forEach(function(w){if(!lok(w,g.letter)||seen[key(w)])ok=false;seen[key(w)]=1});
      if(!ok)return false;
      g.ans[uid]=ar;g.prog[uid]=g.np;g.first=uid;g.endsAt=Math.min(g.endsAt,Date.now()+2200);break}
    case 'force':if(!host||g.ph!=='play')return false;g.endsAt=Math.min(g.endsAt,Date.now()+800);break;
    case 'votes':{if(g.ph!=='vote'||g.ids.indexOf(uid)<0||g.votes[uid])return false;
      var v={},src=a.v||{};
      g.ids.forEach(function(o){if(o===uid)return;g.items[o].forEach(function(it,i){if(it.st!=='ok')return;var x=Math.floor(+src[o+'|'+i]);if(!(x>=0&&x<=2))x=1;if(it.d)x=Math.min(x,1);v[o+'|'+i]=x})});
      g.votes[uid]=v;
      if(g.ids.every(function(id){return g.votes[id]||!OL.players[id]}))hlTally(g);break}
    case 'close':if(!host||g.ph!=='vote')return false;hlTally(g);break;
    case 'cont':{if(!host||g.ph!=='result')return false;if(g.round>=g.rounds)g.ph='end';else hlRound(g);break}
    default:return false}}

  ctx.fillStyle='#FBF8EF';ctx.fillRect(0,0,W,W);ctx.lineCap='round';ctx.lineJoin='round';
  for(var i=0;i<strokes.length&&used<limit;i++){var st=strokes[i],p=st.p,n=p.length/2,take=Math.min(n,limit-used);used+=n;
    var col=DCOL[st.c]?DCOL[st.c][0]:'#10152A',lw=(DW[st.w]||10)*k;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;

    OL.drawing=true;var p=pos(e);D.cur={c:D.color,w:D.size,p:[p[0],p[1]]};D.strokes.push(D.cur);D.pts++;seg(p,[p[0]+.1,p[1]])});

      if(isArt)return bar+'<div class="wrap">'+dCanvas(s,true,false)+'<div class="now"><span class="eyebrow">Faux titres</span><div class="big">Les autres cherchent un faux titre</div><p class="muted">Ta phrase : <b style="color:var(--fg)">'+esc(dMyPhrase(s.step)||'…')+'</b></p></div>'+dTimer(s)+dChips(s)+'</div>'+(h?'<div class="dock"><button class="btn btn-ghost" data-act="dskip">Passer la phase (hôte)</button></div>':'');
      return bar+'<div class="wrap">'+dCanvas(s,true,false)+dTimer(s)+'<div class="card"><label class="lbl2" for="dft">Invente un titre qui pourrait passer pour le vrai</label><input class="field" id="dft" data-input="dfake" value="'+esc(F.w)+'" maxlength="60" placeholder="Ton faux titre" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" style="flex:none;width:100%;height:56px;font-size:19px"'+(F.sent||now>=s.endsAt?' readonly':'')+'>'+
      '<p class="issue" id="dfm" role="status" style="text-align:left">'+esc(F.msg||'')+'</p>'+(OL.cfg.hint&&!F.sent?'<button class="btn btn-secondary btn-sm" data-act="dhint">Souffle-moi une idée</button>':'')+'</div>'+dChips(s)+'</div>'+
      '<div class="dock"><button class="btn btn-primary" id="dfs" data-act="dfake"'+(F.sent||String(F.w||'').trim().length<3?' disabled':'')+'>'+(F.sent?'Titre envoyé':'Valider mon titre')+'</button>'+(h?'<button class="btn btn-ghost" data-act="dskip">Passer la phase (hôte)</button>':'')+'</div>'}
    case 'vote':{var V=OL.dv,done=s.prog.indexOf(me)>=0||V.sent;
      if(isArt)return bar+'<div class="wrap">'+dCanvas(s,true,false)+'<div class="now"><span class="eyebrow">Vote</span><div class="big">Tu ne votes pas</div><p class="muted">Les autres cherchent ta vraie phrase.</p></div>'+dTimer(s)+dChips(s)+'</div>'+(h?'<div class="dock"><button class="btn btn-ghost" data-act="dskip">Passer la phase (hôte)</button></div>':'');
      var cards=s.opts.map(function(o){var mine=!!(OL.myfake&&dk(OL.myfake)===dk(o.t)),sel=V.pick===o.id;
        return '<div class="dvr"><button class="dop" data-act="dpick" data-id="'+o.id+'" aria-pressed="'+sel+'"'+(mine||done?' disabled':'')+'><span class="tx">'+esc(o.t)+(mine?'<br><span class="muted small">Le tien</span>':'')+'</span></button>'+
        (OL.cfg.hearts&&!mine?'<button class="dheart" data-act="dheart" data-id="'+o.id+'" aria-pressed="'+(V.heart===o.id)+'" aria-label="Coup de cœur"'+(done?' disabled':'')+'>♥</button>':'')+'</div>'}).join('');
      return bar+'<div class="wrap">'+dCanvas(s,true,false)+dTimer(s)+'<div class="now"><span class="eyebrow">Vote secret</span><div class="big" style="font-size:24px">Laquelle est la vraie phrase ?</div>'+(OL.cfg.hearts?'<p class="muted small">Touche ♥ pour récompenser le titre le plus drôle.</p>':'')+'</div><div class="order">'+cards+'</div>'+dChips(s)+'</div>'+
      '<div class="dock"><button class="btn btn-primary" data-act="dvote"'+(done||!V.pick?' disabled':'')+'>'+(done?'Vote enregistré':(V.pick?'Voter':'Choisis une phrase'))+'</button>'+(h?'<button class="btn btn-ghost" data-act="dskip">Passer la phase (hôte)</button>':'')+'</div>'}
    case 'reveal':return bar+'<div class="wrap">'+dCanvas(s,true,false)+dRevealHtml(s)+'</div><div class="dock">'+(h?'<button class="btn btn-primary" data-act="dcont">Continuer</button>':'<p class="note">Suite automatique…</p>')+'</div>';
    case 'rend':return bar+'<div class="wrap"><div class="win"><span class="eyebrow">Fin de la manche '+s.round+' / '+s.rounds+'</span><h1>Classement provisoire</h1></div><section class="card"><h3>Points de la manche · total</h3>'+dRank(s,'round')+'</section><p class="note">La manche suivante commence toute seule.</p></div>'+(h?'<div class="dock"><button class="btn btn-primary" data-act="dcont">Manche suivante</button></div>':'');
    case 'end':{var ids=s.ids.slice().sort(function(a,b){return (s.tot[b]||0)-(s.tot[a]||0)}),top=s.tot[ids[0]]||0,wn=ids.filter(function(id){return (s.tot[id]||0)===top});
      return '<div class="bar"><span class="codetag">PARTIE #'+esc(OL.code)+'</span><button class="icon-btn" data-act="menu" aria-label="Menu">'+I.dots+'</button></div><div class="wrap"><div class="win"><span class="eyebrow">Classement final · '+s.rounds+' manche'+(s.rounds>1?'s':'')+'</span><h1>'+(wn.length>1?'Égalité : '+wn.map(function(x){return esc(pn(x))}).join(' et '):esc(pn(wn[0]))+' gagne !')+'</h1></div><section class="card"><h3>Classement</h3>'+dRank(s,'end')+'</section></div>'+
      '<div class="dock">'+(h?'<button class="btn btn-primary" data-act="oagain">Rejouer : retour au salon</button>':'<p class="note">En attente de l\'hôte pour rejouer…</p>')+'<button class="btn btn-ghost" data-act="sheet" data-s="oquit">Quitter le salon</button></div>'}}
  return vOLoad('Chargement…')}

/* ----- Actions ----- */
function dAct(a,d){var c=OL.cfg||{},s=OL.s;
  switch(a){
    case 'drounds':c.rounds=+d.n;olPushCfg();render();break;
    case 'dper':c.per=+d.n;olPushCfg();render();break;
    case 'dtdraw':c.tdraw=+d.n;olPushCfg();render();break;
    case 'dtfake':c.tfake=+d.n;olPushCfg();render();break;
    case 'dtvote':c.tvote=+d.n;olPushCfg();render();break;
    case 'dcat':{var i=c.cats.indexOf(d.c);if(i>=0)c.cats.splice(i,1);else c.cats.push(d.c);olPushCfg();render();break}
    case 'dtog':c[d.k]=!c[d.k];olPushCfg();render();break;
    case 'dopt':{var v=d.v;if(v==='true')v=true;else if(v==='false')v=false;OPT[d.k]=v;optSave();render();break}
    case 'dcol':if(OL.dr&&!OL.dr.sent){OL.dr.color=+d.i;render()}break;
    case 'dsz':if(OL.dr&&!OL.dr.sent){OL.dr.size=+d.i;render()}break;
    case 'dclear':{var D=OL.dr;if(!D||D.sent||D.clears>=1)break;
      if(!D.confirm){D.confirm=true;render();setTimeout(function(){if(OL.dr===D&&D.confirm){D.confirm=false;olRender()}},3000)}
      else{D.strokes=[];D.pts=0;D.full=false;D.clears++;D.confirm=false;render();vib(30)}break}
    case 'ddone':dSubmit();break;
    case 'dskip':sendAct('skip');break;
    case 'dcont':sendAct('cont');break;
    case 'dhint':{var bank=shuffle(DL),pick=bank[0];OL.dfake.w=pick;OL.dfake.msg='';render()}break;
    case 'dfake':dSendFake();break;
    case 'dpick':if(OL.dv&&!OL.dv.sent){OL.dv.pick=d.id;vib(10);render()}break;
    case 'dheart':if(OL.dv&&!OL.dv.sent){OL.dv.heart=OL.dv.heart===d.id?null:d.id;vib(10);render()}break;
    case 'dvote':dSendVote();break;
    case 'ojoind':olJoinDisplay();break;
    case 'music':musicToggle();break;
    default:return false}}
app.addEventListener('input',function(e){var t=e.target,d=t.dataset||{};
  if(d.input==='dfake'&&OL.on){OL.dfake.w=t.value;OL.dfake.msg='';var b=document.getElementById('dfs');if(b)b.disabled=OL.dfake.sent||t.value.trim().length<3;var m=document.getElementById('dfm');if(m)m.textContent=''}
  else if(d.input==='dcustom'&&OL.on&&OL.host&&OL.cfg){OL.cfg.custom=t.value.slice(0,4000)}});
app.addEventListener('change',function(e){var d=e.target.dataset||{};if(d.input==='dcustom'&&OL.on&&OL.host){olPushCfg();OL.deferred=false;setTimeout(olRender,100)}});
app.addEventListener('keydown',function(e){var d=e.target.dataset||{};if(e.key==='Enter'&&d.input==='dfake'){e.preventDefault();dSendFake();e.target.blur()}});

async function olJoinDisplay(){
  var code=OH.code.trim();if(!/^\d{4}$/.test(code)){OH.err='Entre le code à 4 chiffres de la partie.';return homeRender()}
  OH.busy=true;OH.err='';homeRender();
  try{await olInit();var b=olBlock();if(b&&!/lecture seule/.test(b))throw b;
    if(!DB)throw 'Le mode en ligne n\'est pas disponible ici.';
    var sn=await Rr(code).get();if(!sn.exists)throw 'Partie introuvable. Vérifie le code.';
    var room=sn.data();if(room.game!=='d')throw 'L\'écran commun est réservé à BAZAR Dessins.';
    var cf=jp(room.cfg,{});if(cf.display===false)throw 'L\'hôte n\'autorise pas l\'écran commun.';
    if(room.status==='closed')throw 'Cette partie est terminée.';
    OH.busy=false;await olOpen(code,{display:true});
  }catch(e){OH.busy=false;OH.err=errText(e);homeRender()}}

/* ---------- Musique d'ambiance : composée sur place avec Web Audio (aucun fichier, donc libre de droits) ---------- */
var MU={on:true,ctx:null,bus:null,step:0,next:0,tm:0,started:false};
try{if(localStorage.getItem('bazar-music')==='off')MU.on=false}catch(e){}
var MBPM=72,MCH=[
  {r:53,k:[57,60,64,65]},  /* Fmaj7 */
  {r:52,k:[55,59,62,64]},  /* Em7 */
  {r:50,k:[53,57,60,64]},  /* Dm9 */
  {r:48,k:[55,59,60,64]}   /* Cmaj7 */
],MSC=[72,74,76,79,81,84,79,76];
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function muBuild(ctx){
  var out=ctx.createGain();out.gain.value=0;
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=.4;
  var comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;
  lp.connect(comp);comp.connect(out);out.connect(ctx.destination);
  var dry=ctx.createGain();dry.gain.value=1;dry.connect(lp);
  var dl=ctx.createDelay(1.5);dl.delayTime.value=60/MBPM*.75;
  var fb=ctx.createGain();fb.gain.value=.38;var df=ctx.createBiquadFilter();df.type='lowpass';df.frequency.value=2200;
  var send=ctx.createGain();send.gain.value=.5;
  send.connect(dl);dl.connect(df);df.connect(fb);fb.connect(dl);df.connect(lp);
  var n=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=n.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return {out:out,dry:dry,send:send,noise:n,ctx:ctx}}
function muTone(B,type,f,t,len,vol,att,echo,detune){
  var c=B.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;if(detune)o.detune.value=detune;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  o.connect(g);g.connect(B.dry);if(echo){var s=c.createGain();s.gain.value=echo;g.connect(s);s.connect(B.send)}
  o.start(t);o.stop(t+len+.05)}
function muKick(B,t,v){var c=B.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.34);o.connect(g);g.connect(B.dry);o.start(t);o.stop(t+.4)}
function muNoise(B,t,len,v,type,freq,echo){var c=B.ctx,s=c.createBufferSource();s.buffer=B.noise;
  var f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=type==='bandpass'?.9:.5;
  var g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  s.connect(f);f.connect(g);g.connect(B.dry);if(echo){var e=c.createGain();e.gain.value=echo;g.connect(e);e.connect(B.send)}
  s.start(t,Math.random()*.5);s.stop(t+len+.05)}
/* Un pas = une double-croche. 16 pas par mesure, 4 mesures par boucle. */
function muStep(B,step,t){
  var bar=Math.floor(step/16)%4,p=step%16,ch=MCH[bar],q=60/MBPM/4;
  var sw=(p%4===2)?q*.28:0,T=t+sw;
  /* accords de piano électrique */
  if(p===0){ch.k.forEach(function(m,i){muTone(B,'triangle',mtof(m),T+i*.012,2.4,.075,.02,.3);muTone(B,'sine',mtof(m)*2,T+i*.012,1.1,.02,.01,.2,6)})}
  if(p===6||p===11){ch.k.slice(1).forEach(function(m,i){muTone(B,'triangle',mtof(m),T+i*.01,.7,.05,.012,.35)})}
  /* nappe douce */
  if(p===0){ch.k.forEach(function(m){muTone(B,'sine',mtof(m-12),t,q*16*.98,.03,1.2,.15,-5)})}
  /* basse */
  if(p===0)muTone(B,'sine',mtof(ch.r-12),T,.9,.2,.015,0);
  if(p===10)muTone(B,'sine',mtof(ch.r-12),T,.5,.15,.015,0);
  if(p===7&&(bar===1||bar===3))muTone(B,'sine',mtof(ch.r-5),T,.3,.12,.015,0);
  /* batterie */
  /* pas de grosse percussion : ambiance douce et discrète */
  
  if(p===12)muNoise(B,T,.07,.018,'highpass',6500,0);
  
  /* petite mélodie, rare, qui flotte */
  if(p%4===0&&Math.random()<(p===0?.06:.12)){var m=MSC[Math.floor(Math.random()*MSC.length)];muTone(B,'triangle',mtof(m),T,1.1,.05,.01,.7)}}
function muTick(){var c=MU.ctx;if(!c||!MU.on)return;
  var q=60/MBPM/4;
  while(MU.next<c.currentTime+.3){muStep(MU.bus,MU.step,MU.next);MU.step=(MU.step+1)%64;MU.next+=q}}
function muStart(){
  if(!MU.on)return;
  try{
    if(!MU.ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;MU.ctx=new AC();MU.bus=muBuild(MU.ctx);MU.next=MU.ctx.currentTime+.15;MU.step=0}
    var c=MU.ctx;if(c.state==='suspended')c.resume();
    MU.next=Math.max(MU.next,c.currentTime+.1);
    MU.bus.out.gain.cancelScheduledValues(c.currentTime);MU.bus.out.gain.setTargetAtTime(.24,c.currentTime,1.2);
    clearInterval(MU.tm);MU.tm=setInterval(muTick,60);muTick();MU.started=true
  }catch(e){}}
function muStop(){clearInterval(MU.tm);var c=MU.ctx;if(!c)return;
  try{MU.bus.out.gain.cancelScheduledValues(c.currentTime);MU.bus.out.gain.setTargetAtTime(0,c.currentTime,.15);setTimeout(function(){if(!MU.on&&MU.ctx&&MU.ctx.state==='running')MU.ctx.suspend()},900)}catch(e){}}
function musicToggle(){MU.on=!MU.on;try{localStorage.setItem('bazar-music',MU.on?'on':'off')}catch(e){}
  if(MU.on)muStart();else muStop();musicPaint();vib(10)}
function musicHtml(fix){return '<button class="icon-btn mus'+(fix?' fix':'')+'" data-act="music" aria-pressed="'+MU.on+'" aria-label="'+(MU.on?'Couper la musique':'Activer la musique')+'">'+(MU.on?'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>':'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path d="M3 3l18 18"/></svg>')+'</button>'}
function musicPaint(){var l=app.querySelectorAll('.mus');for(var i=0;i<l.length;i++){var fix=l[i].classList.contains('fix'),t=document.createElement('div');t.innerHTML=musicHtml(fix);l[i].replaceWith(t.firstChild)}}
function musicPost(){if(app.querySelector('.mus'))return;
  var bar=app.querySelector('.bar');
  if(bar&&bar.lastElementChild){bar.lastElementChild.insertAdjacentHTML('beforebegin',musicHtml(false))}
  else app.insertAdjacentHTML('beforeend',musicHtml(true))}
(function(){function first(){if(MU.started){['pointerup','touchend','click','keydown'].forEach(function(e){document.removeEventListener(e,first,true)});return}muStart()}
  ['pointerup','touchend','click','keydown'].forEach(function(e){document.addEventListener(e,first,true)});
  document.addEventListener('visibilitychange',function(){var c=MU.ctx;if(!c||!MU.on)return;if(document.hidden){clearInterval(MU.tm);c.suspend()}else{c.resume();MU.next=c.currentTime+.1;clearInterval(MU.tm);MU.tm=setInterval(muTick,60)}})})();

S._fresh=true;olBoot();render();
})();
</script>
