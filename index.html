
<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152A"><meta name="description" content="BAZAR Party : jeux de soirée sur téléphone, Undercover, Codenames, Petit Bac et Dessins."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23B8FF45'/%3E%3Crect x='25' y='18' width='24' height='32' rx='4.5' fill='%2310152A' transform='rotate(8 37 34)'/%3E%3Ccircle cx='37' cy='35' r='5' fill='%23B8FF45'/%3E%3C/svg%3E"><style>html,body{margin:0}
/* ===== STYLE DE LA MASCOTTE BAZ ===== */
.baz-container {
  display: flex;
  align-items: center;
  gap: 15px;
  background: linear-gradient(135deg, rgba(121,87,255,0.15), rgba(184,255,69,0.05));
  border: 1px solid rgba(184,255,69,0.2);
  border-radius: 20px;
  padding: 15px;
  margin: 20px 0;
  position: relative;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}
.baz-avatar {
  width: 60px; height: 60px; min-width: 60px;
  display: grid; place-items: center;
  z-index: 2;
}
.baz-speech {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.baz-name {
  font: 800 12px var(--display);
  color: var(--lime);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  animation: bazPulse 2s infinite alternate;
}
.baz-text {
  font: 500 14px var(--body);
  color: var(--fg);
  line-height: 1.4;
}
@keyframes bazFloat {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-6px) rotate(3deg); }
}
@keyframes bazPulse {
  0% { opacity: 0.7; text-shadow: 0 0 0 rgba(184,255,69,0); }
  100% { opacity: 1; text-shadow: 0 0 10px rgba(184,255,69,0.5); }
}
/* Spinner de chargement */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(16, 21, 42, 0.3);
  border-radius: 50%;
  border-top-color: var(--lime-ink);
  animation: spin 1s ease-in-out infinite;
  vertical-align: middle;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.btn:disabled .spinner {
  border-top-color: var(--muted);
  border-color: rgba(255,255,255,0.1);
  border-top-color: var(--muted);
}
/* ===== HARMONISATION VISUELLE ===== */
/* On force toutes les cartes à avoir les mêmes marges et ombres */
.card{box-shadow:0 8px 30px rgba(0,0,0,0.15);border-radius:20px;padding:20px;}
/* Effet Premium sur les cartes de jeux */
.game {
  background: rgba(27, 33, 64, 0.4) !important;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.05) !important;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
  position: relative;
  overflow: hidden;
}
.game::before {
  content: "";
  position: absolute;
  top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transform: skewX(-20deg);
  transition: left 0.5s ease;
}
.game:hover::before {
  left: 150%;
}
.game:hover {
  background: rgba(37, 44, 82, 0.6) !important;
  border-color: rgba(184, 255, 69, 0.3) !important;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 15px rgba(184,255,69,0.1) !important;
}
/* On force tous les boutons à avoir la même hauteur et le même arrondi */
.btn{min-height:58px;border-radius:16px;font-size:17px;box-shadow:0 4px 15px rgba(0,0,0,0.1);}
/* Les petits boutons (chips) ont une taille fixe */
.chip{min-height:42px;padding:0 16px;border-radius:12px;font-size:14px;}
/* On uniformise les listes de joueurs */
.prow{padding:8px 12px;border-radius:14px;background:var(--surface-2);margin-bottom:6px;}
/* Le bouton principal (vert) brille un peu plus */
.btn-primary{box-shadow:0 6px 20px rgba(184,255,69,0.25);}
/* Les règles et les textes longs sont plus lisibles */
.lead{font-size:17px;line-height:1.6;}
/* On s'assure que les popups (sheets) sont bien lisibles */
.sheet{box-shadow:0 -10px 40px rgba(0,0,0,0.4);border-top:2px solid var(--line);}
/* On harmonise les inputs (champs de texte) */
.field{border-radius:14px;font-size:16px;}
/* ===== Mode Paysage spécial pour Dessins ===== */
@media (orientation:landscape) and (max-height:600px) {
  /* On transforme l'écran de jeu en 2 colonnes */
  .wrap:has(#dcv) {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
    max-width: 96vw;
    align-items: start;
  }
  /* La zone de dessin prend toute la place à gauche */
  .wrap:has(#dcv) .dcv {
    max-width: 100%;
    margin: 0;
    grid-row: 1 / span 4;
  }
  /* Les outils passent à droite */
  .wrap:has(#dcv) .dtools {
    flex-direction: column;
    grid-column: 2;
    grid-row: 2;
    background: var(--surface);
    padding: 10px;
    border-radius: var(--r);
  }
  .wrap:has(#dcv) .dcols {
    flex-direction: column;
    gap: 6px;
  }
  .wrap:has(#dcv) .dszs {
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  /* Le chrono et le texte en haut restent bien visibles */
  .wrap:has(#dcv) .now { grid-column: 1; }
  .wrap:has(#dcv) .timer { grid-column: 1; }
}
/* ===== PACK DESIGN : EFFET WAOUH ===== */

/* 1. Cartes en verre dépoli (Glassmorphism) avec lueur */
.card {
  background: rgba(27, 33, 64, 0.65) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(184, 255, 69, 0.03);
}

/* 2. Le bouton principal (vert) qui brille au repos */
.btn-primary {
  background: linear-gradient(135deg, var(--lime), #D5F89B) !important;
  box-shadow: 0 0 20px rgba(184, 255, 69, 0.4), 0 8px 20px rgba(0,0,0,0.3) !important;
  border: 1px solid rgba(255,255,255,0.3) !important;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}
.btn-primary:hover {
  box-shadow: 0 0 30px rgba(184, 255, 69, 0.6), 0 8px 25px rgba(0,0,0,0.4) !important;
  transform: translateY(-2px);
}

/* 3. Le bouton violet (Salon en ligne) qui brille */
.btn-violet {
  background: linear-gradient(135deg, var(--violet), #AB9BFF) !important;
  box-shadow: 0 0 20px rgba(121, 87, 255, 0.4), 0 8px 20px rgba(0,0,0,0.3) !important;
  border: 1px solid rgba(255,255,255,0.2) !important;
}

/* 4. Les boutons de jeux sur l'accueil */
.game {
  background: rgba(27, 33, 64, 0.8) !important;
  backdrop-filter: blur(8px);
  transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
  border: 1px solid transparent;
}
.game:hover {
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
}

/* 5. Le logo BAZAR avec un dégradé de fou */
.wm1 {
  background: linear-gradient(180deg, #FFFFFF 0%, #AAB0CC 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 10px rgba(255,255,255,0.1);
  filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
}
.wm2 {
  background: linear-gradient(to right, var(--lime), #D5F89B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(184,255,69,0.3);
}

/* 6. Les avatars (petits et grands) avec une bordure lumineuse */
.av {
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}
.av:hover { transform: scale(1.1); }

/* 7. Les inputs (champs de texte) plus doux */
.field {
  background: rgba(233, 235, 247, 0.95) !important;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
  transition: box-shadow 0.2s;
}
.field:focus {
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 0 0 3px rgba(184, 255, 69, 0.3);
}

/* 8. Le fond du site (dégradé plus profond) */
body {
  background: radial-gradient(circle at 50% 0%, #1a2140 0%, #0B0F1E 70%) !important;
  background-attachment: fixed !important;
}
/* ===== PACK DYNAMIQUE & PREMIUM ===== */

/* 1. Effet de vague/lueur en arrière-plan */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at 50% -20%, rgba(121, 87, 255, 0.15), transparent 60%);
  z-index: -1;
  animation: pulseBg 8s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes pulseBg {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.2); opacity: 1; }
}

/* 2. Effet de pression sur TOUS les boutons (plus dynamique) */
button:active, .btn:active, .game:active {
  transform: scale(0.96) !important;
  transition: transform 0.05s !important;
}

/* 3. Le timer qui stresse (clignote en rouge et grossit) */
@keyframes stress {
  0% { transform: scale(1); color: var(--danger); }
  50% { transform: scale(1.1); color: #FF5555; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
  100% { transform: scale(1); color: var(--danger); }
}
.tl.low {
  animation: stress 0.5s infinite !important;
  font-weight: 900 !important;
}

/* 4. Animation des scores (quand on gagne des points) */
@keyframes scorePop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); color: var(--lime); text-shadow: 0 0 15px var(--lime); }
  100% { transform: scale(1); }
}
.pts, .num {
  transition: all 0.3s ease;
}
.pts:not(:empty) {
  animation: scorePop 0.4s ease-out;
}

/* 5. Les cartes de jeux qui flottent légèrement au survol */
.game {
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s !important;
}
.game:hover {
  transform: translateY(-4px) scale(1.02) !important;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5) !important;
  z-index: 10;
  position: relative;
}

/* 6. Les boutons de choix (votes) qui ont un effet lumineux quand ils sont sélectionnés */
.pick[aria-pressed="true"] {
  box-shadow: 0 0 20px rgba(121, 87, 255, 0.4), inset 0 0 10px rgba(121, 87, 255, 0.2) !important;
  border-color: var(--violet-soft) !important;
  transform: scale(1.02);
}

/* 7. Apparition fluide des éléments (fade-in avec glissement) */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.wrap > * {
  animation: slideUp 0.4s ease-out both;
}
/* On décale un peu chaque élément pour un effet cascade */
.wrap > *:nth-child(2) { animation-delay: 0.05s; }
.wrap > *:nth-child(3) { animation-delay: 0.1s; }
.wrap > *:nth-child(4) { animation-delay: 0.15s; }
.wrap > *:nth-child(5) { animation-delay: 0.2s; }
/* ===== PACK IMMERSION TOTALE ===== */

/* 1. Le Flip 3D pour les cartes (Undercover & Mot Interdit) */
.hold .back {
  transform: rotateY(180deg);
}
.hold.show .back {
  transform: rotateY(360deg);
  transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
}
.hold {
  perspective: 1000px;
}

/* 2. L'animation des points qui s'envolent */
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
}
.float-score {
  position: fixed;
  font: 900 28px var(--display);
  color: var(--lime);
  text-shadow: 0 0 10px var(--lime);
  pointer-events: none;
  z-index: 9999;
  animation: floatUp 1.5s ease-out forwards;
}

/* 3. La couronne du gagnant */
@keyframes crownDrop {
  0% { transform: translateY(-50px) scale(0); opacity: 0; }
  60% { transform: translateY(10px) scale(1.2); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.winner-crown {
  display: inline-block;
  animation: crownDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  margin-right: 8px;
  font-size: 32px;
}

/* 4. Effet machine à écrire (curseur) */
@keyframes blink { 50% { opacity: 0; } }
.type-cursor { animation: blink 1s step-start infinite; }
/* ===== FOND ANIMÉ PREMIUM (Mesh Gradient + Particules) ===== */

/* 1. Le Mesh Gradient (Les taches de couleurs floues) */
#bg-mesh {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -2;
  overflow: hidden;
  background: var(--bg);
  pointer-events: none;
}
#bg-mesh::before, #bg-mesh::after {
  content: "";
  position: absolute;
  width: 60vw; height: 60vw;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  animation: floatMesh 20s infinite alternate ease-in-out;
}
#bg-mesh::before {
  background: var(--violet);
  top: -10%; left: -10%;
}
#bg-mesh::after {
  background: var(--lime);
  bottom: -20%; right: -10%;
  animation-delay: -10s;
  animation-duration: 25s;
}
@keyframes floatMesh {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(10vw, 10vh) scale(1.2); }
  100% { transform: translate(-5vw, 15vh) scale(0.9); }
}

/* 2. Les Particules flottantes (Les étoiles) */
#bg-particles {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  animation: floatUpParticle linear infinite;
}
@keyframes floatUpParticle {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* En mode clair, on baisse l'opacité du fond pour ne pas agresser les yeux */
[data-theme="light"] #bg-mesh::before,
[data-theme="light"] #bg-mesh::after { opacity: 0.15; }
[data-theme="light"] .particle { background: var(--violet); }
/* ===== CONSTELLATION & ÉTOILES ===== */
#bg-particles {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.star-particle {
  position: absolute;
  background: var(--fg);
  border-radius: 50%;
  opacity: 0.8;
  box-shadow: 0 0 6px var(--fg);
  transition: transform 0.1s;
}
.star-4 {
  position: absolute;
  color: var(--lime);
  opacity: 0.9;
  filter: drop-shadow(0 0 8px var(--lime));
}
[data-theme="light"] .star-particle { background: var(--violet); box-shadow: 0 0 6px var(--violet); }
[data-theme="light"] .star-4 { color: var(--violet); filter: drop-shadow(0 0 8px var(--violet)); }
/* ===== PACK EFFETS SPÉCIAUX ===== */

/* 1. Logo BAZAR vivant */
.brand svg {
  animation: floatLogo 4s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 15px rgba(184,255,69,0.3));
}
@keyframes floatLogo {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-5px) scale(1.05); }
}

/* 2. Apparition des cartes en cascade */
.stagger-item {
  animation: slideUpStagger 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  opacity: 0;
}
@keyframes slideUpStagger {
  from { opacity: 0; transform: translateY(60px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 3. Effet de clic (Ripple) */
.click-ripple {
  position: fixed;
  border-radius: 50%;
  background: rgba(184, 255, 69, 0.4);
  transform: scale(0);
  animation: rippleAnim 0.6s ease-out forwards;
  pointer-events: none;
  z-index: 9999;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}
/* ===== PACK IMMERSION TOTALE ===== */

/* 1. Le Flip 3D pour les cartes */
.hold .back { transform: rotateY(180deg); }
.hold.show .back { transform: rotateY(360deg); transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); }
.hold { perspective: 1000px; }

/* 2. L'animation des points qui s'envolent */
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
}
.float-score {
  position: fixed;
  font: 900 28px var(--display);
  color: var(--lime);
  text-shadow: 0 0 10px var(--lime);
  pointer-events: none;
  z-index: 9999;
  animation: floatUp 1.5s ease-out forwards;
}

/* 3. La couronne du gagnant */
@keyframes crownDrop {
  0% { transform: translateY(-50px) scale(0); opacity: 0; }
  60% { transform: translateY(10px) scale(1.2); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.winner-crown {
  display: inline-block;
  animation: crownDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  margin-right: 8px;
  font-size: 32px;
}

/* 4. Effet machine à écrire (curseur) */
@keyframes blink { 50% { opacity: 0; } }
.type-cursor { animation: blink 1s step-start infinite; }
/* ===== ÉCRAN D'INTRO CINÉMATIQUE ===== */
#splash-screen {
  position: fixed;
  inset: 0;
  background: #0B0F1E;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.8s cubic-bezier(0.8, 0, 0.2, 1);
}
#splash-screen.hidden {
  transform: translateY(-100%);
}
.splash-logo {
  animation: splashPop 2s ease-in-out infinite alternate, splashGlow 2s infinite;
}
@keyframes splashPop {
  0% { transform: scale(0.9); }
  100% { transform: scale(1.1); }
}
@keyframes splashGlow {
  0%, 100% { filter: drop-shadow(0 0 20px rgba(184,255,69,0.2)); }
  50% { filter: drop-shadow(0 0 60px rgba(184,255,69,0.6)); }
}
.splash-text {
  margin-top: 20px;
  font: 800 24px var(--display);
  color: var(--lime);
  letter-spacing: 0.2em;
  opacity: 0;
  animation: fadeInText 1s 0.5s forwards;
}
@keyframes fadeInText {
  to { opacity: 1; }
}
/* ===== RETOUCHE IDENTITÉ VISUELLE ===== */

/* Cartes plus arrondies et modernes */
.card, .game, .btn {
  border-radius: 24px !important;
}

/* Titres plus gros et plus impactants */
h1 {
  font-weight: 800 !important;
  letter-spacing: -0.03em !important;
}
h2 {
  font-weight: 700 !important;
}

/* Le bouton vert principal avec une lueur plus forte */
.btn-primary {
  background: linear-gradient(135deg, var(--lime) 0%, #D5F89B 100%) !important;
  box-shadow: 0 8px 25px rgba(184, 255, 69, 0.4) !important;
  color: var(--lime-ink) !important;
  font-weight: 800 !important;
  letter-spacing: 0.02em;
}

/* Les boutons secondaires (comme "Voir tous les jeux") en violet doux */
.btn-secondary {
  border-color: var(--violet-soft) !important;
  color: var(--violet-soft) !important;
  font-weight: 700 !important;
}
/* ===== EFFET DISTRIBUTION DE CARTES (UNDERCOVER) ===== */
@keyframes dealCard3D {
  0% { 
    transform: translateY(200px) rotateX(-90deg) scale(0.5); 
    opacity: 0; 
  }
  60% { 
    transform: translateY(-15px) rotateX(10deg) scale(1.05); 
    opacity: 1; 
  }
  100% { 
    transform: translateY(0) rotateX(0deg) scale(1); 
    opacity: 1; 
  }
}

.hold.dealing {
  animation: dealCard3D 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  transform-style: preserve-3d;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 2px var(--lime);
}
/* ===== BARRE DE NAVIGATION BASSE ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; width: 100%;
  background: rgba(11, 15, 30, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px 24px 0 0;
  display: flex;
  justify-content: space-around;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
}
.bottom-nav button {
  background: none; border: none;
  color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font: 600 11px var(--display);
  cursor: pointer;
  flex: 1;
  transition: color 0.2s;
  position: relative;
}
.bottom-nav button svg {
  width: 24px; height: 24px;
  fill: currentColor;
  transition: transform 0.2s;
}
.bottom-nav button.active {
  color: var(--lime);
}
.bottom-nav button.active svg {
  transform: translateY(-2px) scale(1.15);
}
.bottom-nav button.active::before {
  content: "";
  position: absolute;

.wheel-container { position: relative; width: 300px; height: 300px; margin: 30px auto; }
.wheel-bg {

  position: relative;
  border: 4px solid #10152A;
}
.wheel-bg::after {
  content: "B"; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 60px; height: 60px; background: linear-gradient(135deg, #B8FF45, #8DBF2E); border-radius: 50%;

}
.wheel-pointer {

  width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent;
  border-top: 35px solid #B8FF45; z-index: 10; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));

.wheel-label {

}

.bz-btn:active{transform:translate(3px,3px) rotate(-1deg);box-shadow:1px 1px 0 #171525}.bz-btn.alt{background:#ffcf33}.bz-btn.dark{background:#7957ff;color:white}.bz-input{box-sizing:border-box;width:100%;padding:13px;border:3px solid #171525;border-radius:9px;background:#fff;color:#171525;font:700 16px inherit;margin:8px 0}
.bz-label{font-weight:900;color:#171525;display:block;margin-top:12px}.bz-count{font-size:clamp(56px,16vw,100px);font-weight:1000;line-height:1;color:#ffcf33;-webkit-text-stroke:3px #171525;text-shadow:6px 6px 0 #ff5b42;animation:bzpop .7s infinite alternate}

<style>
/* Concept : une colonne mobile sur bleu nuit, une seule action principale par écran, le violet réservé aux cartes et au secret, le vert citron réservé à l'action. */
:root{

<script>
/* BAZAR Party : pont entre le jeu et la base Netlify (fonction /api/kv). */
(function(){
  if(window.claude)return;
  var API='/api/kv',POLL=700;
  function par(p){return p.split('/').slice(0,-1).join('/')}
  async function call(body){
  var r;
  // On crée un "minuteur" de 5 secondes
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort(); }, 10000);
  
  try {
    r = await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal: controller.signal // On lie la requête au minuteur
    });
    clearTimeout(timeoutId); // Si ça répond vite, on annule le minuteur
  } catch(e) {
    clearTimeout(timeoutId);
    // Si l'erreur est un abandon (timeout), on renvoie un code clair
    if(e.name === 'AbortError') {
      throw {code:'timeout', message:'Le serveur met trop de temps à répondre.'};
    }
    throw {code:'unavailable', message:'réseau'};
  }
  
  var j=null;
  try{ j=await r.json(); }catch(e){}
  
  if(!r.ok) {
    throw {code:(j&&j.code)||'unavailable', message:(j&&j.error)||('HTTP '+r.status)};
  }
  return j;
}
  function mkDoc(p,r){return {id:p.split('/').pop(),exists:!!r.exists,data:function(){return r.exists?r.data:undefined}}}
  function mkColl(l){return {docs:(l||[]).map(function(x){return {id:x.id,exists:true,data:function(){return x.data}}})}}
  /* Toutes les écoutes d'un téléphone sont regroupées en une seule requête toutes les 1,5 s. */
  var subs=[],timer=null,busy=false,again=false,fails=0;
  function kick(ms){clearTimeout(timer);timer=setTimeout(tick,ms==null?POLL+Math.floor(Math.random()*300):ms)}
  async function tick(){
    if(!subs.length)return;
    if(document.hidden){kick();return}
    if(busy){again=true;return}
    busy=true;var list=subs.slice();
    try{var res=await call({op:'watch',items:list.map(function(s){return {k:s.kind,p:s.p}})});fails=0;
      list.forEach(function(s,i){if(s.dead)return;var r=res[i],j,snap;
        if(s.kind==='doc'){j=JSON.stringify(r);snap=mkDoc(s.p,r)}
        else{j=JSON.stringify((r||[]).map(function(x){return [x.id,x.data]}).sort());snap=mkColl(r)}
        if(j!==s.last){s.last=j;try{s.cb(snap)}catch(e){console.error(e)}}})}
    catch(e){fails++;if(fails===6)list.forEach(function(s){if(!s.dead&&s.er)s.er(e)})}
    busy=false;
    if(again){again=false;kick(0)}else kick()}
  function sub(kind,p,cb,er){var s={kind:kind,p:p,cb:cb,er:er,last:null,dead:false};subs.push(s);kick(0);
    return function(){s.dead=true;var i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)kick(0)});
  async function write(body){var r=await call(body);kick(60);return r}
  function doc(p){return {id:p.split('/').pop(),path:p,
    get:async function(){return mkDoc(p,await call({op:'get',path:p}))},
    set:function(d){return write({op:'set',path:p,data:d})},
    update:function(d){return write({op:'update',path:p,data:d})},
    delete:function(){return write({op:'delete',path:p})},
    onSnapshot:function(cb,er){return sub('doc',p,cb,er)}}}
  function coll(c){return {path:c,
    get:async function(){return mkColl(await call({op:'list',path:c}))},
    doc:function(id){return doc(c+'/'+id)},
    onSnapshot:function(cb,er){return sub('coll',c,cb,er)}}}
  var uid=null;
  try{uid=localStorage.getItem('bazar-uid')}catch(e){}
  if(!uid){uid='u'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('bazar-uid',uid)}catch(e){}}
  var DBN={doc:doc,collection:coll},USR={id:async function(){return uid},can:async function(){return true},isOwner:async function(){return false},canEdit:async function(){return false}};
  window.claude_userId_raw = uid;
window.claude={use:function(n){return Promise.resolve(n==='db'?DBN:(n==='user'?USR:null))},userId:function(){return uid}};
})();

/* Effet Ripple au clic */
function createRipple(e) {
  var btn = e.target.closest('.btn, .game, .pick');
  if(!btn) return;
  var rect = btn.getBoundingClientRect();
  var x = e.clientX || (rect.left + rect.width / 2);
  var y = e.clientY || (rect.top + rect.height / 2);
  var ripple = document.createElement('div');
  ripple.className = 'click-ripple';
  ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
  ripple.style.left = (x - Math.max(rect.width, rect.height) / 2) + 'px';
  ripple.style.top = (y - Math.max(rect.height, rect.height) / 2) + 'px';
  document.body.appendChild(ripple);
  setTimeout(function() { ripple.remove(); }, 600);
}

/* Confettis avec les avatars des joueurs */
function avatarConfetti() {
  if(RM) return;
  var avatars = [];
  if(S.screen==='online' && OL.players) {
    for(var id in OL.players) {
      var p = OL.players[id];
      avatars.push(p.avatar ? AV_BASES[p.avatar.base] : '👤');
    }
  } else if(S.players) {
    S.players.forEach(function(p){ avatars.push(p.avatar ? AV_BASES[p.avatar.base] : '👤'); });
  }
  if(!avatars.length) avatars = ['⭐', '🎉', '🔥'];
  
  for(var i=0; i<30; i++) {
    setTimeout(function(){
      var el = document.createElement('div');
      el.textContent = avatars[Math.floor(Math.random() * avatars.length)];
      el.style.position = 'fixed';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.top = '-50px';
      el.style.fontSize = (Math.random() * 20 + 20) + 'px';
      el.style.zIndex = '9999';
      el.style.pointerEvents = 'none';
      el.style.transition = 'transform 3s linear, opacity 3s ease-in';
      document.body.appendChild(el);
      
      setTimeout(function(){
        el.style.transform = 'translateY(110vh) rotate(' + (Math.random() * 360) + 'deg)';
        el.style.opacity = '0';
      }, 50);
      
      setTimeout(function(){ el.remove(); }, 3000);
    }, i * 100);
  }
}
/* Effet Machine à écrire */
function typeWriter(el, text, speed, callback){
  if(!el)return;
  el.innerHTML=''; var i=0;
  var timer=setInterval(function(){
    if(i<text.length){el.innerHTML+=text.charAt(i);i++;}
    else{clearInterval(timer);el.innerHTML=text+'<span class="type-cursor">|</span>';if(callback)callback();}
  }, speed);
}

/* ---------- Minuteur ---------- */
var T=null,TL=0,TT=0;
function clearT(){if(T){clearInterval(T);T=null}}
function paintT(){
  var l=document.getElementById('tleft'),b=document.getElementById('tbar');
  if(l){
    l.textContent=TL+' s';
    if(TL <= 5) {
      l.classList.add('timer-panic');
    } else {
      l.classList.remove('timer-panic');
    }
  }
  if(b){
    b.style.width=Math.max(0,(TL/TT)*100)+'%';
    if(b.parentNode) b.parentNode.classList.toggle('low', TL<=5);
  }
  
  // Bruitage du chrono
  if (TL <= 10 && TL > 0) {
    if (typeof sfxTick === 'function') sfxTick(TL <= 5);
  }

  // 🎵 MUSIQUE DYNAMIQUE (Stress)
  if (typeof MU !== 'undefined' && MU.ctx && MU.on && MU.bus) {
    var targetVol = (TL <= 10 && TL > 0) ? 0.4 : 0.2; // La musique monte un peu
    MU.bus.out.gain.setTargetAtTime(targetVol, MU.ctx.currentTime, 0.5);
    
    // Si on a un filtre lowpass dans MU.bus, on l'ouvre pour que ça devienne agressif
    if(MU.bus.lp) {
      var targetFreq = (TL <= 10 && TL > 0) ? 8000 : 6000;
      MU.bus.lp.frequency.setTargetAtTime(targetFreq, MU.ctx.currentTime, 0.5);
    }
  }
}

function startGame(){
  S._bazInvaded = false; 
  fixSettings();
  S.players.forEach(function(p){p.name=p.name.trim()});
  var st=S.settings;
  var pool=[];PAIRS.forEach(function(p,i){if(st.cats.indexOf(p[2])>=0)pool.push(i)});
  var fresh=pool.filter(function(i){return S.used.indexOf(i)<0});
  if(!fresh.length){S.used=S.used.filter(function(i){return pool.indexOf(i)<0});fresh=pool}
  var idx=fresh[Math.floor(Math.random()*fresh.length)];S.used.push(idx);try{localStorage.setItem(PAIRKEY,JSON.stringify(S.used))}catch(e){}
  var pr=PAIRS[idx],flip=Math.random()<.5;
  var ids=S.players.map(function(p){return p.id}),sh=shuffle(ids),roles={},k=0,i;
  for(i=0;i<st.uc;i++)roles[sh[k++]]='uc';
  for(i=0;i<st.mw;i++)roles[sh[k++]]='mw';
  for(;k<sh.length;k++)roles[sh[k]]='civil';
  var base=shuffle(ids);
  if(roles[base[0]]==='mw'){var j=-1;for(i=0;i<base.length;i++)if(roles[base[i]]!=='mw'){j=i;break}var t=base[0];base[0]=base[j];base[j]=t}
  S.game={civ:flip?pr[1]:pr[0],uc:flip?pr[0]:pr[1],cat:pr[2],roles:roles,alive:ids.slice(),base:base,round:1,ri:0,rs:'who',speak:0,vote:null,elim:null,flipped:false,tally:null,mw:null,winner:null,gains:null};
  save();
  go('reveal');
}
function nextSpeaker(){S._vibbedTurn = false;var g=S.game,o=order(g);g.speak++;if(g.speak>=o.length){clearT();beginVote(g.alive.slice(),false)}else{render();clueTimer()}}
function beginVote(cand,revote){var g=S.game;g.vote={cand:cand,voters:order(g),idx:0,stage:'pass',picks:{},sel:null,revote:revote};go('vote')}
function tally(){
  var g=S.game,v=g.vote,counts={};v.cand.forEach(function(id){counts[id]=0});
  Object.keys(v.picks).forEach(function(k){counts[v.picks[k]]++});
  var rows=v.cand.map(function(id){return {id:id,n:counts[id]}}).sort(function(a,b){return b.n-a.n});
  var top=rows[0].n,tied=rows.filter(function(r){return r.n===top}).map(function(r){return r.id});
  if(tied.length===1){g.tally=rows;g.elim=tied[0];go('result')}
  else if(!v.revote){beginVote(tied,true)}
  else{g.tally=rows;g.elim=null;go('result')}
}
function afterElim(){var g=S.game,id=g.elim;g.alive=g.alive.filter(function(x){return x!==id});if(g.roles[id]==='mw'){g.mw={text:'',ok:null};go('mwguess')}else resolve()}
function resolve(){var g=S.game,inf=g.alive.filter(function(i){return g.roles[i]!=='civil'}).length,civ=g.alive.length-inf;
  if(inf===0)return finish('civil');if(civ<=inf)return finish('inf');newRound()}
function newRound(){var g=S.game;g.round++;g.base=shuffle(g.alive);g.speak=0;g.elim=null;g.flipped=false;g.tally=null;g.vote=null;go('clues')}
function finish(w,who){
  var g=S.game;g.winner=w;g.mwWin=who||null;g.gains={};
  var hostWon = false;
  S.players.forEach(function(p){
    var r=g.roles[p.id];
    var won=(w==='civil'&&r==='civil')||(w==='inf'&&r!=='civil')||(w==='mw'&&p.id===who);
    g.gains[p.id]=won?PTS[r]:0;p.score+=g.gains[p.id];
    if (won) hostWon = true; // Si au moins un joueur a gagné, le téléphone gagne des jetons
  });
  
  // On récompense le téléphone si la partie a été gagnée (par n'importe qui)
  updateMyStats(hostWon, 5, 5); // +5 jetons, +5 min de jeu
  
  save();go('end');if(typeof muStop==='function')muStop();sfxFanfare(w!=='inf');setTimeout(function(){fanfare(w==='inf'?['#7957FF','#AB9BFF','#F4F4F8']:null)},350)
}

var app=document.getElementById('app');

function go(s){
  if(typeof sfxSwooshPage === 'function') sfxSwooshPage();

  var isStreet = document.documentElement.getAttribute('data-theme') === 'streetwear';
  
  if(isStreet) {
    // L'effet "Splat" (Tache d'encre)
    var splat = document.createElement('div');
    splat.className = 'ink-splat';
    document.body.appendChild(splat);
    if(typeof screenShake === 'function') screenShake(); // On secoue l'écran
    setTimeout(function(){ splat.remove(); }, 600);
  } else if(!RM) {
    app.classList.add('page-glitch');
    setTimeout(function(){ app.classList.remove('page-glitch'); }, 300);
  }
  
  if(S.screen && S.screen !== s) {
    var isMainTab = (s==='home' || s==='ohome' || s==='profile' || s==='shop' || s==='wheel' || s==='tournament');
    if(isMainTab) {
      NAV_HISTORY = [s];
    } else {
      if(NAV_HISTORY[NAV_HISTORY.length - 1] !== S.screen) {
        NAV_HISTORY.push(S.screen);
      }
    }
  }
  clearT();
  S.screen=s;S.sheet=null;S._fresh=true;render();window.scrollTo(0,0);
  if(s==='clues')clueTimer();
}

function goBack(){
  if(NAV_HISTORY.length > 1){
    // On enlève la page actuelle de l'historique
    NAV_HISTORY.pop(); 
    // On récupère la page précédente
    var prev = NAV_HISTORY[NAV_HISTORY.length - 1]; 
    S.screen = prev; S.sheet=null; S._fresh=true; render(); window.scrollTo(0,0);
  } else {
    // Si l'historique est vide ou n'a qu'un élément, on va à l'accueil
    NAV_HISTORY = ['home'];
    S.screen = 'home'; S._fresh=true; render(); window.scrollTo(0,0);
  }
}

function vEnd(){
  var g=S.game,w=g.winner;

    S._cinemaEnded = true;
    var txtCinema = w==='civil' ? 'VICTOIRE DES CIVILS' : (w==='inf' ? 'LES INFILTRÉS GAGNENT' : 'MR WHITE TRIOMPHE');
    playCinemaText(txtCinema, 2500);
  }
  var T={civil:['Les Civils gagnent !','Tous les infiltrés ont été démasqués.'],
         inf:['Les infiltrés gagnent !','Ils sont aussi nombreux que les Civils.'],
         mw:['Mr White gagne !','Il a deviné le mot des Civils.']}[w];
  var bazMsg = w==='civil' ? "Bien joué les Civils ! Vous avez démasqué les intrus."
             : (w==='inf' ? "Mouhaha ! Les infiltrés ont réussi à vous berner."
                          : "Incroyable ! Mr White a deviné le mot !");

  // Classement trié par score décroissant
  var ranked = S.players.slice().sort(function(a,b){return (b.score||0)-(a.score||0)});
  var winnerId = ranked[0].id;

  // Rôles : reconstruction locale depuis S.players + g.roles
  var rolesHtml = S.players.map(function(p, ix){
    var r = g.roles[p.id];
    var tagLabel = r==='uc'?'Undercover':(r==='mw'?'Mr White':'Civil');
    var tagCls = r==='uc'?'uc':(r==='mw'?'mw':'');

function updateMyStats(isWin, tokensWon, timeSpent){
  var st = {tokens: 0, played: 0, wins: 0, time: 0, borders: []};
  try{ var s = localStorage.getItem('bazar-stats'); if(s) st = JSON.parse(s); }catch(e){}
  
  st.played = (st.played || 0) + 1;
  if(isWin) st.wins = (st.wins || 0) + 1;
  if(tokensWon) st.tokens = (st.tokens || 0) + tokensWon;
  if(timeSpent) st.time = (st.time || 0) + timeSpent;
  
  try{ localStorage.setItem('bazar-stats', JSON.stringify(st)); }catch(e){}
}
function getMyAvatar(){try{return JSON.parse(localStorage.getItem('bazar-my-avatar')||'null')}catch(e){return null}}
async function olCreate(){
  if(OH.busy) return;
  var nm=OH.name.trim().slice(0,16);
  if(!nm){OH.err='Choisis un prénom.';return homeRender()}
  
  OH.busy=true; OH.err=''; render();
  
  try{
    await olInit();
    var b=olBlock(); if(b) throw b;
    
    var code=null;
    for(var i=0;i<3&&!code;i++){
      var c=String(1000+Math.floor(Math.random()*9000));
      var sn=await Rr(c).get();
      if(!sn.exists||Date.now()-(sn.data().ts||0)>6*36e5) code=c;
    }
    if(!code) throw 'Impossible de trouver un code. Réessaie.';
    
    await olWipe(code);
    
    // Définition des règles (cfg) pour chaque jeu
    var cfg = {};
    if(OH.game==='m') cfg = {size:S.my.size,names:[S.my.names[0],S.my.names[1]]};
    else if(OH.game==='l') cfg = {np:6,rounds:2,secs:90,cats:LCATS.slice()};
    else if(OH.game==='d') cfg = {rounds:2,per:1,tdraw:60,tfake:40,tvote:25,cats:DCATS.slice(),custom:'',clear:false,dbl:true,hearts:true,hint:true,who:true,display:true};
    else if(OH.game==='s') cfg = {};
    else if(OH.game==='dd') cfg = {};
    else if(OH.game==='c') cfg = {};
    else if(OH.game==='f') cfg = {};
    else cfg = {uc:1,mw:0,cats:CATS.slice(),reveal:true}; // Undercover par défaut

    // Création du salon
    await Rr(code).set({
      code: code, 
      host: PID, 
      game: OH.game, 
      status: 'lobby', 
      cfg: JSON.stringify(cfg), 
      s: '', 
      scores: '{}', 
      wins: '[0,0]', 
      ts: Date.now(), 
      v: Date.now()
    });
    
    // Ajout de l'hôte
    await Pd(code, PID).set({
      name: nm, 
      ci: ciFor(PID), 
      team: 0, 
      spy: false, 
      ts: Date.now(), 
      act: '', 
      avatar: getMyAvatar()
    });
    
    olStore({name:nm, code:code});
    OH.busy=false;
    await olOpen(code);
  }catch(e){
    OH.busy=false;
    OH.err=errText(e);
    render();
  }
}
async function olJoin(){
  var nm=OH.name.trim().slice(0,16), code=OH.code.trim();
  if(!nm){OH.err='Choisis un prénom.';return render()}
  if(!/^\d{4}$/.test(code)){OH.err='Le code a 4 chiffres.';return render()}
  
  if(OH.busy) return;
  OH.busy=true; OH.err=''; render();
  
  try{
    await olInit();
    var b=olBlock(); if(b) throw b;
    
    // 1. On vérifie que le salon existe
    var sn = await Rr(code).get();
    if(!sn.exists) throw 'Partie introuvable. Vérifie le code.';
    var room = sn.data();
    if(room.status === 'closed') throw 'Cette partie est terminée.';
    
    // 2. On récupère la liste des joueurs
    var q = await Rp(code).get();
    var mine = null;
    q.docs.forEach(function(d){
      if(d.id === PID) mine = d.data();
    });
    
    // 3. Si on n'est pas encore dans le salon, on s'ajoute
    if(!mine){
      if(room.status === 'play') throw 'La partie a déjà commencé.';
      await Pd(code, PID).set({
        name: nm, 
        ci: ciFor(PID), 
        team: 0, 
        spy: false, 
        ts: Date.now(), 
        act: '', 
        avatar: getMyAvatar()
      });
    }
    
    olStore({name:nm, code:code});
    OH.busy = false;
    OH.game = room.game;
    
    // 4. On ouvre l'écran du salon
    await olOpen(code);
    
  } catch(e) {
    OH.busy = false;
    OH.err = errText(e);
    render();
  }
}

function olSubscribe(){

    l.sort(function(a,b){return (a.ts||0)-(b.ts||0)||(a.id<b.id?-1:1)});

      olRender();

  }
}

async function olLeave(){

function mkGameU(){var c=OL.cfg,ids=OL.plist.map(function(p){return p.id}),i,k=0;

  var g={g:'u',gid:String(Date.now()),ph:'reveal',round:1,roles:roles,civ:fl?pr[1]:pr[0],uc:fl?pr[0]:pr[1],alive:ids.slice(),base:base,speak:0,seen:{},vote:null,elim:null,tally:null,mw:null,winner:null,mwWin:null,gains:null};

function pubU(g){var s={g:'u',gid:g.gid,ph:g.ph,round:g.round,alive:g.alive,order:order(g),speak:g.speak,seen:Object.keys(g.seen),players:g.base,cat:null};
  if(g.vote){s.cand=g.vote.cand;s.revote=g.vote.revote;s.vk=g.vote.k;s.voted=Object.keys(g.vote.picks)}else s.voted=[];

function huAct(uid,a,g){var ph=g.ph,host=uid===PID;
  switch(a.t){
    case 'seen':if(ph!=='reveal'||g.base.indexOf(uid)<0)return;g.seen[uid]=1;
      if(g.base.every(function(id){return g.seen[id]||!OL.players[id]}))huClues(g);break;
    case 'force':if(!host||ph!=='reveal')return;huClues(g);break;
    case 'next':{if(ph!=='clues')return;var o=order(g);if(!host&&o[g.speak]!==uid)return;
      g.speak++;if(g.speak>=o.length)huVote(g,g.alive.slice(),false);break}
    case 'vote':{if(ph!=='vote')return;var v=g.vote;
      if(g.alive.indexOf(uid)<0||a.k!==v.k||v.cand.indexOf(a.v)<0||a.v===uid)return;
      v.picks[uid]=a.v;
      if(g.alive.every(function(id){return v.picks[id]||!OL.players[id]}))huTally(g);break}
    case 'close':if(!host||ph!=='vote')return;huTally(g);break;
    case 'cont':if(!host||ph!=='result')return;huAfter(g);break;
    case 'mw':{if(ph!=='mw'||!g.mw||g.mw.ok!==null||uid!==g.elim)return;

function huClues(g){g.ph='clues';g.speak=0}
function huVote(g,cand,revote){g.ph='vote';g.vote={cand:cand,revote:revote,picks:{},k:g.round+'-'+(revote?2:1)+'-'+(Date.now()%100000)}}
function huTally(g){var v=g.vote,counts={};v.cand.forEach(function(id){counts[id]=0});

  else if(!v.revote)huVote(g,tied,true);

function vOnline(){
  if(!OL.on || !OL.room) return vOLoad('Connexion au salon…');
  if(OL.cfg == null) return vOLoad('Chargement du salon…');
  
  // --- MODE TV / GRAND ÉCRAN ---
  if (OL.display) {
    if (OL.status === 'lobby' || !OL.s) return vOLoad(''); 
    
    // Si c'est Dessins, on utilise l'écran TV des dessins
    if (OL.game === 'd') return vOGameD();
    
    // Si c'est Undercover, on utilise le nouvel écran TV
    if (OL.game === 'u') return vOTVUndercover();
    
    return '<div class="wrap wide" style="text-align:center;padding-top:20vh;"><h1>La partie a commencé !</h1><p class="lead">Suivez les instructions sur vos téléphones.</p></div>';
  }
  
  // --- MODE JOUEUR (Téléphone) ---
  if(OL.status === 'lobby' || !OL.s){
    if(OL.status === 'play' && !OL.s) return vOLoad('Chargement de la partie…');
    
    var lobbyHtml = '';
    if(OL.game === 'm') lobbyHtml = vOLobbyM();
    else if(OL.game === 'l') lobbyHtml = vOLobbyL();
    else if(OL.game === 'd') lobbyHtml = vOLobbyD();
    else if(OL.game === 'c') lobbyHtml = vOLobbyC();
    else if(OL.game === 'f') lobbyHtml = vOLobbyF();
    else if(OL.game === 's') lobbyHtml = vOLobbyS();
    else lobbyHtml = vOLobbyU();
    
    var tip = BAZ_TIPS[OL.game] || "En attente des joueurs...";
    
    return lobbyHtml.replace('<section class="card"><h2>Équipes</h2>', bazBubble(tip)+'<section class="card"><h2>Équipes</h2>')
                    .replace('<section class="card"><h2>Comment jouer ?</h2>', bazBubble(tip)+'<section class="card"><h2>Comment jouer ?</h2>')
                    .replace('<section class="card"><h2>Réglages</h2>', bazBubble(tip)+'<section class="card"><h2>Réglages</h2>')
                    .replace('<section class="card"><h2>Les jeux du tournoi</h2>', bazBubble(tip)+'<section class="card"><h2>Les jeux du tournoi</h2>');
  }
  
  // --- JEU EN COURS (Téléphone) ---

function toast(msg){
  var t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;
  t.className='show';
  t.style.transform = 'translate(-50%, 0) scale(1.05)';
  setTimeout(function(){ t.style.transform = 'translate(-50%, 0) scale(1)'; }, 150);
  clearTimeout(toast.t);
  toast.t=setTimeout(function(){ t.className=''; }, 2200);
}

function generateShareImage(gameType){
  var canvas=document.createElement('canvas');
  canvas.width=1080; canvas.height=1920;
  var ctx=canvas.getContext('2d');
  
  var grad=ctx.createLinearGradient(0,0,0,1920);
  grad.addColorStop(0,'#0B0F1E'); grad.addColorStop(1,'#161C35');
  ctx.fillStyle=grad; ctx.fillRect(0,0,1080,1920);
  
  ctx.fillStyle='rgba(184,255,69,0.4)';
  for(var i=0;i<80;i++){
    var x=Math.random()*1080, y=Math.random()*1920, r=Math.random()*3+1;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  
  // Logo BAZAR
  ctx.fillStyle='#B8FF45';
  ctx.font='900 90px Outfit, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('BAZAR', 540, 180);
  ctx.fillStyle='#FFFFFF';
  ctx.font='700 40px Outfit, sans-serif';
  ctx.fillText('PARTY', 540, 230);
  
  var title = gameType==='u' ? 'Résultat Undercover' : 'Le classement de la soirée';
  ctx.fillStyle='#AAB0CC';
  ctx.font='40px Inter, sans-serif';
  ctx.fillText(title, 540, 320);
  
  var playersList = [];
  if(S.screen==='online' && OL.players){
    for(var id in OL.players){
      var p = OL.players[id];
      playersList.push({name:p.name, score:OL.scores[id]||0, avatar:p.avatar});
    }
  } else {
    playersList = S.players.map(function(p){return {name:p.name, score:p.score, avatar:p.avatar}});
  }
  
  var sorted = playersList.sort(function(a,b){return b.score-a.score});
  var displayPlayers = sorted.slice(0,6);
  
  displayPlayers.forEach(function(p, idx){
    var y = 480 + (idx * 180);
    ctx.fillStyle = idx===0 ? 'rgba(184,255,69,0.2)' : 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.arc(150, y-20, 60, 0, Math.PI*2); ctx.fill();
    
    var baseEmoji = (p.avatar && AV_BASES[p.avatar.base]) ? AV_BASES[p.avatar.base] : '👤';
    ctx.font = '60px Arial'; ctx.textAlign = 'center';
    ctx.fillText(baseEmoji, 150, y);
    
    ctx.fillStyle = idx===0 ? '#B8FF45' : '#FFFFFF';
    ctx.font = 'bold 55px Outfit, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(p.name, 250, y);
    
    ctx.textAlign = 'right';
    ctx.font = 'bold 55px Outfit, sans-serif';
    ctx.fillText(p.score + ' pts', 980, y);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(250, y+60); ctx.lineTo(980, y+60); ctx.stroke();
  });
  
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.font = 'bold 45px Inter, sans-serif';
  ctx.fillText('Rejoins la partie !', 540, 1650);
  ctx.fillStyle = '#B8FF45';
  ctx.font = 'bold 35px Inter, sans-serif';
  ctx.fillText('bazar-party-mobile.vercel.app', 540, 1720);
  
  canvas.toBlob(function(blob){
    var file = new File([blob], 'bazar-party-score.png', {type: 'image/png'});
    if(navigator.canShare && navigator.canShare({files: [file]})){
      navigator.share({files: [file], title: 'Mon score BAZAR Party', text: 'J\'ai gagné à BAZAR Party !'}).catch(function(){});
    } else {
      var link = document.createElement('a');
      link.download = 'bazar-party-score.png';
      link.href = URL.createObjectURL(blob);
      link.click();
      toast('Image téléchargée !');
    }
  }, 'image/png');
}

  switch(a){

      if(c && /^\d{4}$/.test(c)) {
        OH.code = c;
        OH.name = "Écran TV"; // On force un nom
        olJoinDisplay(); // On utilise la fonction qu'on avait faite pour les dessins !
      } else if (c) {
        toast("Le code doit contenir 4 chiffres.");
      }
      break;
    }
    case 'ohome':OH.err='';go('ohome');break;case 'goback':goBack();break;case 'ojoin_home':OH.game='u';OH.err='';go('ohome');setTimeout(function(){var el=document.getElementById('ocd');if(el){el.focus();el.scrollIntoView({behavior:'smooth',block:'center'});}},150);break;
case 'oscanqr':go('scanner');break;
case 'profile':go('profile');break;case 'wheel':go('wheel');break;case 'shop':go('shop');break;

  try{ var s = localStorage.getItem('bazar-stats'); if(s) st = JSON.parse(s); }catch(e){}
  if(!st.borders) st.borders = [];
  var price = +d.price;
  
  if(st.tokens >= price && st.borders.indexOf(d.id) < 0){
    st.tokens -= price;
    st.borders.push(d.id);
    try{ localStorage.setItem('bazar-stats', JSON.stringify(st)); }catch(e){}
    sfxWin();
    toast('Achat réussi !');
    setTimeout(function(){ go('shop'); }, 100); // On rafraîchit l'écran de la boutique
  } else {
    toast('Tu n\'as pas assez de jetons !');
  }
  break;
}

  var prizes = [10, 50, 20, 100, 30, 5];
  var winIndex = Math.floor(Math.random() * prizes.length);
  var won = prizes[winIndex];
  
  // ✨ CORRECTION DE L'ANGLE : +30 pour centrer sur la part

function dAct(a,d){var c=OL.cfg||{},s=OL.s;
  switch(a){
    case 'drounds':c.rounds=+d.n;olPushCfg();render();break;
    case 'dper':c.per=+d.n;olPushCfg();render();break;
    case 'dtdraw':c.tdraw=+d.n;olPushCfg();render();break;
    case 'dtfake':c.tfake=+d.n;olPushCfg();render();break;
    case 'dtvote':c.tvote=+d.n;olPushCfg();render();break;
    case 'dcat':{var i=c.cats.indexOf(d.c);if(i>=0)c.cats.splice(i,1);else c.cats.push(d.c);olPushCfg();render();break}
    case 'dtog':c[d.k]=!c[d.k];olPushCfg();render();break;
    case 'dopt':{var v=d.v;if(v==='true')v=true;else if(v==='false')v=false;OPT[d.k]=v;optSave();render();break}
    case 'dcol':if(OL.dr&&!OL.dr.sent){OL.dr.color=+d.i;render()}break;
    case 'dsz':if(OL.dr&&!OL.dr.sent){OL.dr.size=+d.i;render()}break;
    case 'dclear':{var D=OL.dr;if(!D||D.sent||D.clears>=1)break;
      if(!D.confirm){D.confirm=true;render();setTimeout(function(){if(OL.dr===D&&D.confirm){D.confirm=false;olRender()}},3000)}
      else{D.strokes=[];D.pts=0;D.full=false;D.clears++;D.confirm=false;render();vib(30)}break}
    case 'ddone':dSubmit();break;
    case 'dskip':sendAct('skip');break;case 'dskipread':sendAct('dskipread');break;
    case 'dcont':sendAct('cont');break;
    case 'dhint':{var bank=shuffle(DL),pick=bank[0];OL.dfake.w=pick;OL.dfake.msg='';render()}break;
    case 'dfake':dSendFake();break;
    case 'dpick':if(OL.dv&&!OL.dv.sent){OL.dv.pick=d.id;vib(10);render()}break;
    case 'dheart':if(OL.dv&&!OL.dv.sent){OL.dv.heart=OL.dv.heart===d.id?null:d.id;vib(10);render()}break;
    case 'dvote':dSendVote();break;

async function olJoinDisplay(){
  var code = OH.code.trim();
  if(!/^\d{4}$/.test(code)){ OH.err='Entre le code à 4 chiffres.'; return homeRender(); }
  
  OH.busy=true; OH.err=''; homeRender();
  
  try {
    await olInit();
    if(!DB) throw 'Le mode en ligne n\'est pas disponible ici.';
    
    var sn = await Rr(code).get();
    if(!sn.exists) throw 'Partie introuvable. Vérifie le code.';
    
    var room = sn.data();
    if(room.status === 'closed') throw 'Cette partie est terminée.';
    
    // ON ENLÈVE LA SÉCURITÉ QUI BLOQUAIT POUR UNDERCOVER
    // if(room.game !== 'd') throw 'L\'écran commun est réservé à BAZAR Dessins.';
    
    var cf = jp(room.cfg, {});
    // ON AUTORISE L'ÉCRAN POUR TOUS LES JEUX
    // if(cf.display === false) throw 'L\'hôte n\'autorise pas l\'écran commun.';
    
    OH.busy = false;
    await olOpen(code, { display: true });

    // On affiche l'erreur à l'écran pour comprendre pourquoi ça bloque

    homeRender();
  }
}

  s.connect(f);f.connect(g);g.connect(B.dry);if(echo){var e=c.createGain();e.gain.value=echo;g.connect(e);e.connect(B.send)}

/* NOUVELLE MELODIE GENERATIVE */
var currentMelody = [];
function generateMelody() {
  var notes = [];
  var scale = [0, 2, 4, 5, 7, 9, 11, 12]; // Gamme majeure
  var root = [72, 74, 76, 79][Math.floor(Math.random()*4)];
  for(var i=0; i<8; i++) {
    if(Math.random() > 0.3) notes.push(root + scale[Math.floor(Math.random()*scale.length)]);
    else notes.push(null);
  }
  return notes;
}

function muStep(B,step,t){
  var bar=Math.floor(step/16)%4,p=step%16,ch=MCH[bar],q=60/MBPM/4;
  var sw=(p%4===2)?q*.25:0,T=t+sw;
  
  /* Grosse caisse (Kick) bien profonde */
  if(p===0||p===8||(p===10&&bar%2===1)) muKick(B,T,0.4);
  
  /* Clap sur 2 et 4 */
  if(p===4||p===12) muNoise(B,T,.15,.1,'bandpass',1800,.2);
  
  /* Charley très rapide (style Trap) */
  if(p%2===0) muNoise(B,T,.03,.02,'highpass',9000,0);
  if(p%4===1 && Math.random()>0.5) muNoise(B,T,.02,.015,'highpass',9000,0);
  
  /* Basse 808 profonde et groovy */
  if(p===0) muTone(B,'sine',mtof(ch.r-24),T,.8,.25,.01,0); // -24 = très grave
  if(p===7||p===10) muTone(B,'sine',mtof(ch.r-24),T,.5,.2,.01,0);
  
  /* Accords de piano électrique (Lo-fi) */
  if(p===0||p===11){ ch.k.forEach(function(m,i){ muTone(B,'triangle',mtof(m-12),T+i*.01,1.5,.06,.02,.3) }) }
  
  /* Mélodie douce (on la baisse d'une octave avec -12 pour éviter l'aigu) */
  if(step % 64 === 0) { currentMelody = generateMelody(); }
  if(p%4 === 0) {
    var noteIndex = (p/4) + (bar*2);
    if(currentMelody[noteIndex]) {
       // On utilise 'sine' (plus doux) et on baisse d'une octave (-12)
       // Mélodie une octave plus bas (-24 au lieu de -12) et volume baissé (0.03)
muTone(B,'triangle',mtof(currentMelody[noteIndex]-24),T,1.5,.03,.02,.5);
    }
  }
}
function muTick(){var c=MU.ctx;if(!c||!MU.on)return;
  var q=60/MBPM/4;
  while(MU.next<c.currentTime+.3){muStep(MU.bus,MU.step,MU.next);MU.step=(MU.step+1)%64;MU.next+=q}}

(function initNebula(){
  var cvs = document.createElement('canvas');
  cvs.id = 'bg-nebula';
  cvs.style.position = 'fixed'; cvs.style.top = '0'; cvs.style.left = '0';
  cvs.style.width = '100vw'; cvs.style.height = '100vh';
  cvs.style.zIndex = '-1'; cvs.style.pointerEvents = 'none';
  document.body.insertBefore(cvs, document.body.firstChild);
  
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  var blobs = [], particles = [];
  var mouse = {x: -1000, y: -1000};

  window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', function(e){ if(e.touches.length) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });
  window.addEventListener('mouseleave', function(){ mouse.x = -1000; mouse.y = -1000; });

  function resize(){
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    ctx.scale(DPR, DPR);
    
    blobs = [];
    for(var i=0; i<4; i++) {
      blobs.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 300 + 200, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, phase: Math.random() * Math.PI * 2 });
    }

    particles = [];
    for(var j=0; j<60; j++) {
      particles.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.5, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, alpha: Math.random() });
    }
  }

  function loop(time){
    ctx.clearRect(0, 0, W, H);
    var theme = document.documentElement.getAttribute('data-theme') || 'dark';
    var color1, color2, partColor;
    var speedMult = 1;

    // 🎨 RÉACTION AUX THEMES
    if(theme === 'cyberpunk') { 
      color1 = 'rgba(255, 0, 127, 0.2)'; color2 = 'rgba(0, 240, 255, 0.2)'; partColor = '#00F0FF';
      speedMult = 3; // Les particules vont très vite (style data/hacker)
    }
    else if(theme === 'sunset') { 
      color1 = 'rgba(255, 75, 75, 0.2)'; color2 = 'rgba(255, 179, 71, 0.2)'; partColor = '#FFB347';
      speedMult = 0.4; // Mouvement lent et chaleureux
    }
    else if(theme === 'forest') { 
      color1 = 'rgba(52, 211, 153, 0.15)'; color2 = 'rgba(251, 191, 36, 0.15)'; partColor = '#FDE68A';
      speedMult = 0.8;
    }
    else if(theme === 'streetwear') { 
      color1 = 'rgba(255, 42, 42, 0.15)'; // Rouge
      color2 = 'rgba(255, 222, 0, 0.1)'; // Jaune
      partColor = '#FFDE00';
      speedMult = 2.5; // Mouvement rapide style BD
    }
    else { 
      color1 = 'rgba(121, 87, 255, 0.15)'; color2 = 'rgba(184, 255, 69, 0.15)'; partColor = '#B8FF45';
      speedMult = 1; 
    }

    blobs.forEach(function(b, i) {
      b.x += b.vx * speedMult; b.y += b.vy * speedMult;
      if(b.x < -b.r) b.x = W + b.r; if(b.x > W + b.r) b.x = -b.r;
      if(b.y < -b.r) b.y = H + b.r; if(b.y > H + b.r) b.y = -b.r;
      
      var scale = 1 + Math.sin(time * 0.001 * speedMult + b.phase) * 0.2;
      var grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * scale);
      grad.addColorStop(0, i % 2 === 0 ? color1 : color2);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * scale, 0, Math.PI * 2); ctx.fill();
    });

    particles.forEach(function(p) {
      p.x += p.vx * speedMult; p.y += p.vy * speedMult;
      if(p.x < 0) p.x = W; if(p.x > W) p.x = 0;
      if(p.y < 0) p.y = H; if(p.y > H) p.y = 0;

      var dx = p.x - mouse.x, dy = p.y - mouse.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var rx = p.x, ry = p.y;
      if(dist < 150) {
        var force = (150 - dist) / 150;
        rx += (dx / dist) * force * 50;
        ry += (dy / dist) * force * 50;
      }

      p.alpha += (Math.random() - 0.5) * 0.1;
      if(p.alpha < 0.2) p.alpha = 0.2; if(p.alpha > 1) p.alpha = 1;

      ctx.beginPath(); ctx.arc(rx, ry, p.r, 0, Math.PI * 2);
      ctx.fillStyle = partColor; // La particule prend la couleur du thème !
      ctx.globalAlpha = p.alpha; 
      ctx.fill();
      ctx.globalAlpha = 1; // Reset
    });

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();

      if(!sn.exists||Date.now()-(sn.data().ts||0)>6*36e5) code=c;
    }
    if(!code){toast('Impossible de créer le salon. Réessaie.');return}
    BZ.room=code;
    BZ.pid='p'+Math.random().toString(36).slice(2,10)+'~'+(window.claude&&window.claude.userId?window.claude.userId():'');
    BZ.host=true;
    BZ.me=name;
    // 1. Crée le salon à la RACINE (comme Dessins, Undercover…)
    await Rr(code).set({
      code:code,
      host:BZ.pid,
      game:'bz',
      status:'lobby',
      cfg:'{}',
      s:'',
      scores:'{}',
      wins:'[0,0]',
      ts:Date.now(),
      v:Date.now()
    });
    // 2. Ajoute l'hôte dans la collection players (comme les autres jeux)
    await Pd(code,BZ.pid).set({
      name:name,
      ci:0,
      team:0,
      spy:false,
      ts:Date.now(),
      act:'',
      avatar:null
    });
    // 3. Écrit l'état du jeu dans /bz/state
    var state={
      game:'bazar-chaos',
      phase:'lobby',
      room:code,
      names:[],
      players:[{pid:BZ.pid,name:name}],
      host:BZ.pid,
      idx:0,
      steps:[],
      phraseChoices:{},
      votes:{},
      sabotage:-1,
      rev:1,
      created:Date.now(),
      result:null
    };
    await bzRoomDoc().set(state);
    BZ.remote=state;
    BZ.phase='lobby';
    bzWatch();
    render();
  }catch(e){
    toast('Impossible de créer le salon : '+(e.message||e));
  }
}

async function bzJoinOnline(){
  try{
    await bzDB();
    var room=((document.getElementById('bz-room-code')||{}).value||'').trim().replace(/\D/g,'');
    var name=((document.getElementById('bz-online-name')||{}).value||'').trim().slice(0,16);
    if(room.length!==4){toast('Le code doit faire 4 chiffres.');return}
    if(!name){toast('Choisis un prénom.');return}
    // 1. Vérifie que le salon existe à la RACINE (comme les autres jeux)
    var sn=await Rr(room).get();
    if(!sn.exists){toast('Partie introuvable. Vérifie le code.');return}
    var roomData=sn.data();
    if(roomData.status==='closed'){toast('Cette partie est fermée.');return}
    if(roomData.status==='play'){toast('La partie a déjà commencé.');return}
    if(roomData.game!=='bz'){toast('Ce salon n\'est pas un BAZAR CHAOS.');return}
    // 2. Vérifie que le joueur n'est pas déjà dans le salon
    var myPid='p'+Math.random().toString(36).slice(2,10)+'~'+(window.claude&&window.claude.userId?window.claude.userId():'');
    var existing=await Pd(room,myPid).get();
    if(!existing.exists){
      var q=await Rp(room).get();
      if(q.docs.length>=12){toast('Salon complet (12 max).');return}
      await Pd(room,myPid).set({
        name:name,
        ci:0,
        team:0,
        spy:false,
        ts:Date.now(),
        act:'',
        avatar:null
      });
    }
    // 3. Récupère l'état BAZAR CHAOS
    var bzSnap=await bzRoomDoc().get();
    if(!bzSnap.exists){toast('Erreur : état BAZAR CHAOS introuvable. Redemande le code à l\'hôte.');return}
    BZ.room=room;
    BZ.pid=myPid;
    BZ.me=name;
    BZ.host=false;
    // 4. Ajoute le joueur dans la liste des joueurs BAZAR CHAOS
    var state=bzSnap.data();
    if(!state.players.some(function(p){return p.pid===myPid})){
      state.players.push({pid:myPid,name:name});
      state.rev=(state.rev||0)+1;
      await bzRoomDoc().set(state);
    }
    BZ.remote=state;
    BZ.phase=state.phase||'lobby';
    bzWatch();
    render();
  }catch(e){
    toast('Connexion impossible : '+(e.message||e));
  }
}

async function bzStartOnline(){
  try{
    var phrase=((document.getElementById('bz-phrase-start')||{}).value||'').trim();
    await bzPatch(function(s){
      if(s.host!==BZ.pid)return;
      if(!s.players||s.players.length<3)return;
      s.phase='phrasevote';
      s.names=s.players.map(function(p){return p.name});
      s.phraseChoices={};
      s.sabotage=Math.floor(Math.random()*s.players.length);
      s.steps=[];
      s.phrase=phrase;
      s.idx=0;
      s.votes={};
      s.result=null;
    },30);
  }catch(e){
    toast('Lancement impossible : '+(e.message||e));
  }
}

function bzAct(a,d){
 if(a==='bzstart'){bzStart();return true} if(a==='bzhome'){if(BZ.unsub){try{BZ.unsub()}catch(e){}}go('home');return true}
 if(a==='bzlocalmode'){BZ.mode='local';BZ.phase='setup';render();return true} if(a==='bzonlinemode'){BZ.mode='online';BZ.phase='setup';render();return true}
 if(a==='bzplayers'){bzSetPlayers();return true} if(a==='bzprompt'){var e=document.getElementById('bz-phrase-start');if(e)e.value=BZ_PROMPTS[+d.i]||bzPickPrompt();return true}
 if(a==='bzsetphrase'){var e=document.getElementById('bz-myphrase');if(e)e.value=d.text||'';return true}
 if(a==='bzcreateonline'){bzCreateOnline();return true} if(a==='bzjoinonline'){bzJoinOnline();return true} if(a==='bzstartonline'){bzStartOnline();return true} if(a==='bzsubmitphrase'){bzSubmitPhrase();return true} if(a==='bzchoosephrase'){bzChoosePhrase();return true}
 if(a==='bzcopy'){GenUICopyFallback(BZ.room);return true} if(a==='bzleaveonline'){if(BZ.unsub){try{BZ.unsub()}catch(e){}}BZ.unsub=null;BZ.mode='choose';BZ.phase='setup';render();return true}
 if(a==='bzcolor'){BZ.color=d.color||'#171525';var c=document.getElementById('bz-canvas');if(c)c.getContext('2d').strokeStyle=BZ.color;return true} if(a==='bzclear'){var c=document.getElementById('bz-canvas');if(c){var x=c.getContext('2d');x.fillStyle='#fffdf5';x.fillRect(0,0,c.width,c.height)}return true}
 if(a==='bzsubmitdraw'){bzSubmitDraw();return true} if(a==='bzsubmitcaption'){bzSubmitCaption();return true} if(a==='bzsubmitvote'){bzSubmitVote(d.id);return true} if(a==='bzfinishonline'){bzFinishOnline();return true} if(a==='bzreplayonline'){bzReplayOnline();return true}
 if(a==='bznext'){if(BZ.local){if(BZ.phase==='phrase')BZ.phase='draw';else if(BZ.phase==='reveal')BZ.phase='vote';render();if(BZ.phase==='draw')bzInitCanvas();bzBurst();return true}return true}
 if(a==='bzdraw'){var c=document.getElementById('bz-canvas');if(c&&BZ.local){BZ.current.steps.push({type:'draw',by:BZ.names[BZ.idx],image:c.toDataURL('image/jpeg',.5)});BZ.idx=(BZ.idx+1)%BZ.n;BZ.phase='caption';render();bzBurst()}return true}
 if(a==='bzcaption'){var e=document.getElementById('bz-caption'),v=e&&e.value.trim();if(!v){toast('Écris une interprétation !');return true}if(BZ.local){BZ.current.steps.push({type:'caption',by:BZ.names[BZ.idx],text:v});BZ.idx=(BZ.idx+1)%BZ.n;BZ.phase=BZ.current.steps.length>=BZ.n*2?'reveal':'draw';render();if(BZ.phase==='draw')bzInitCanvas();bzBurst()}return true}
 if(a==='bzgotovote'){bzPatch(s=>{if(s.host===BZ.pid)s.phase='vote'},25);return true} if(a==='bzvote'&&BZ.local){BZ.votes[BZ.names[BZ.idx]]=+d.id;BZ.idx=(BZ.idx+1)%BZ.n;render();return true} if(a==='bzfinish'&&BZ.local){BZ.phase='finish';render();bzBurst(48);return true}
 return false}
function GenUICopyFallback(t){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Code copié !')).catch(()=>toast('Code du salon : '+t));else toast('Code du salon : '+t)}catch(e){toast('Code du salon : '+t)}}
window.bzAct = bzAct;
window.bzStart = bzStart;
window.bzRender = bzRender;
</script></body>
</html>
