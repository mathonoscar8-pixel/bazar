
<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152A"><meta name="description" content="BAZAR Party : jeux de soirée sur téléphone, Undercover, Agents Secrets, Petit Bac et Dessins."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23B8FF45'/%3E%3Crect x='25' y='18' width='24' height='32' rx='4.5' fill='%2310152A' transform='rotate(8 37 34)'/%3E%3Ccircle cx='37' cy='35' r='5' fill='%23B8FF45'/%3E%3C/svg%3E"><style>html,body{margin:0}
/* ===== STYLE DE LA MASCOTTE BAZ ===== */
.baz-container {
  display: flex;
  align-items: center;
  gap: 15px;
  background: linear-gradient(135deg, rgba(121,87,255,0.15), rgba(184,255,69,0.05));
  border: 1px solid rgba(184,255,69,0.2);
  border-radius: 20px;
  padding: 15px;
  margin: 20px 0;
  position: relative;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}
.baz-avatar {
  width: 60px; height: 60px; min-width: 60px;
  display: grid; place-items: center;
  z-index: 2;
}
.baz-speech {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.baz-name {
  font: 800 12px var(--display);
  color: var(--lime);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  animation: bazPulse 2s infinite alternate;
}
.baz-text {
  font: 500 14px var(--body);
  color: var(--fg);
  line-height: 1.4;
}
@keyframes bazFloat {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-6px) rotate(3deg); }
}
@keyframes bazPulse {
  0% { opacity: 0.7; text-shadow: 0 0 0 rgba(184,255,69,0); }
  100% { opacity: 1; text-shadow: 0 0 10px rgba(184,255,69,0.5); }
}
/* Spinner de chargement */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(16, 21, 42, 0.3);
  border-radius: 50%;
  border-top-color: var(--lime-ink);
  animation: spin 1s ease-in-out infinite;
  vertical-align: middle;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.btn:disabled .spinner {
  border-top-color: var(--muted);
  border-color: rgba(255,255,255,0.1);
  border-top-color: var(--muted);
}
/* ===== HARMONISATION VISUELLE ===== */
/* On force toutes les cartes à avoir les mêmes marges et ombres */
.card{box-shadow:0 8px 30px rgba(0,0,0,0.15);border-radius:20px;padding:20px;}
/* Effet Premium sur les cartes de jeux */
.game {
  background: rgba(27, 33, 64, 0.4) !important;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.05) !important;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
  position: relative;
  overflow: hidden;
}
.game::before {
  content: "";
  position: absolute;
  top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transform: skewX(-20deg);
  transition: left 0.5s ease;
}
.game:hover::before {
  left: 150%;
}
.game:hover {
  background: rgba(37, 44, 82, 0.6) !important;
  border-color: rgba(184, 255, 69, 0.3) !important;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 15px rgba(184,255,69,0.1) !important;
}
/* On force tous les boutons à avoir la même hauteur et le même arrondi */
.btn{min-height:58px;border-radius:16px;font-size:17px;box-shadow:0 4px 15px rgba(0,0,0,0.1);}
/* Les petits boutons (chips) ont une taille fixe */
.chip{min-height:42px;padding:0 16px;border-radius:12px;font-size:14px;}
/* On uniformise les listes de joueurs */
.prow{padding:8px 12px;border-radius:14px;background:var(--surface-2);margin-bottom:6px;}
/* Le bouton principal (vert) brille un peu plus */
.btn-primary{box-shadow:0 6px 20px rgba(184,255,69,0.25);}
/* Les règles et les textes longs sont plus lisibles */
.lead{font-size:17px;line-height:1.6;}
/* On s'assure que les popups (sheets) sont bien lisibles */
.sheet{box-shadow:0 -10px 40px rgba(0,0,0,0.4);border-top:2px solid var(--line);}
/* On harmonise les inputs (champs de texte) */
.field{border-radius:14px;font-size:16px;}
/* ===== Mode Paysage spécial pour Dessins ===== */
@media (orientation:landscape) and (max-height:600px) {
  /* On transforme l'écran de jeu en 2 colonnes */
  .wrap:has(#dcv) {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
    max-width: 96vw;
    align-items: start;
  }
  /* La zone de dessin prend toute la place à gauche */
  .wrap:has(#dcv) .dcv {
    max-width: 100%;
    margin: 0;
    grid-row: 1 / span 4;
  }
  /* Les outils passent à droite */
  .wrap:has(#dcv) .dtools {
    flex-direction: column;
    grid-column: 2;
    grid-row: 2;
    background: var(--surface);
    padding: 10px;
    border-radius: var(--r);
  }
  .wrap:has(#dcv) .dcols {
    flex-direction: column;
    gap: 6px;
  }
  .wrap:has(#dcv) .dszs {
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  /* Le chrono et le texte en haut restent bien visibles */
  .wrap:has(#dcv) .now { grid-column: 1; }
  .wrap:has(#dcv) .timer { grid-column: 1; }
}
/* ===== PACK DESIGN : EFFET WAOUH ===== */

/* 1. Cartes en verre dépoli (Glassmorphism) avec lueur */
.card {
  background: rgba(27, 33, 64, 0.65) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(184, 255, 69, 0.03);
}

/* 2. Le bouton principal (vert) qui brille au repos */
.btn-primary {
  background: linear-gradient(135deg, var(--lime), #D5F89B) !important;
  box-shadow: 0 0 20px rgba(184, 255, 69, 0.4), 0 8px 20px rgba(0,0,0,0.3) !important;
  border: 1px solid rgba(255,255,255,0.3) !important;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}
.btn-primary:hover {
  box-shadow: 0 0 30px rgba(184, 255, 69, 0.6), 0 8px 25px rgba(0,0,0,0.4) !important;
  transform: translateY(-2px);
}

/* 3. Le bouton violet (Salon en ligne) qui brille */
.btn-violet {
  background: linear-gradient(135deg, var(--violet), #AB9BFF) !important;
  box-shadow: 0 0 20px rgba(121, 87, 255, 0.4), 0 8px 20px rgba(0,0,0,0.3) !important;
  border: 1px solid rgba(255,255,255,0.2) !important;
}

/* 4. Les boutons de jeux sur l'accueil */
.game {
  background: rgba(27, 33, 64, 0.8) !important;
  backdrop-filter: blur(8px);
  transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
  border: 1px solid transparent;
}
.game:hover {
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
}

/* 5. Le logo BAZAR avec un dégradé de fou */
.wm1 {
  background: linear-gradient(180deg, #FFFFFF 0%, #AAB0CC 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 10px rgba(255,255,255,0.1);
  filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
}
.wm2 {
  background: linear-gradient(to right, var(--lime), #D5F89B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(184,255,69,0.3);
}

/* 6. Les avatars (petits et grands) avec une bordure lumineuse */
.av {
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}
.av:hover { transform: scale(1.1); }

/* 7. Les inputs (champs de texte) plus doux */
.field {
  background: rgba(233, 235, 247, 0.95) !important;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
  transition: box-shadow 0.2s;
}
.field:focus {
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 0 0 3px rgba(184, 255, 69, 0.3);
}

/* 8. Le fond du site (dégradé plus profond) */
body {
  background: radial-gradient(circle at 50% 0%, #1a2140 0%, #0B0F1E 70%) !important;
  background-attachment: fixed !important;
}
/* ===== PACK DYNAMIQUE & PREMIUM ===== */

/* 1. Effet de vague/lueur en arrière-plan */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at 50% -20%, rgba(121, 87, 255, 0.15), transparent 60%);
  z-index: -1;
  animation: pulseBg 8s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes pulseBg {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.2); opacity: 1; }
}

/* 2. Effet de pression sur TOUS les boutons (plus dynamique) */
button:active, .btn:active, .game:active {
  transform: scale(0.96) !important;
  transition: transform 0.05s !important;
}

/* 3. Le timer qui stresse (clignote en rouge et grossit) */
@keyframes stress {
  0% { transform: scale(1); color: var(--danger); }
  50% { transform: scale(1.1); color: #FF5555; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
  100% { transform: scale(1); color: var(--danger); }
}
.tl.low {
  animation: stress 0.5s infinite !important;
  font-weight: 900 !important;
}

/* 4. Animation des scores (quand on gagne des points) */
@keyframes scorePop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); color: var(--lime); text-shadow: 0 0 15px var(--lime); }
  100% { transform: scale(1); }
}
.pts, .num {
  transition: all 0.3s ease;
}
.pts:not(:empty) {
  animation: scorePop 0.4s ease-out;
}

/* 5. Les cartes de jeux qui flottent légèrement au survol */
.game {
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s !important;
}
.game:hover {
  transform: translateY(-4px) scale(1.02) !important;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5) !important;
  z-index: 10;
  position: relative;
}

/* 6. Les boutons de choix (votes) qui ont un effet lumineux quand ils sont sélectionnés */
.pick[aria-pressed="true"] {
  box-shadow: 0 0 20px rgba(121, 87, 255, 0.4), inset 0 0 10px rgba(121, 87, 255, 0.2) !important;
  border-color: var(--violet-soft) !important;
  transform: scale(1.02);
}

/* 7. Apparition fluide des éléments (fade-in avec glissement) */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.wrap > * {
  animation: slideUp 0.4s ease-out both;
}
/* On décale un peu chaque élément pour un effet cascade */
.wrap > *:nth-child(2) { animation-delay: 0.05s; }
.wrap > *:nth-child(3) { animation-delay: 0.1s; }
.wrap > *:nth-child(4) { animation-delay: 0.15s; }
.wrap > *:nth-child(5) { animation-delay: 0.2s; }
/* ===== PACK IMMERSION TOTALE ===== */

/* 1. Le Flip 3D pour les cartes (Undercover & Mot Interdit) */
.hold .back {
  transform: rotateY(180deg);
}
.hold.show .back {
  transform: rotateY(360deg);
  transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
}
.hold {
  perspective: 1000px;
}

/* 2. L'animation des points qui s'envolent */
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
}
.float-score {
  position: fixed;
  font: 900 28px var(--display);
  color: var(--lime);
  text-shadow: 0 0 10px var(--lime);
  pointer-events: none;
  z-index: 9999;
  animation: floatUp 1.5s ease-out forwards;
}

/* 3. La couronne du gagnant */
@keyframes crownDrop {
  0% { transform: translateY(-50px) scale(0); opacity: 0; }
  60% { transform: translateY(10px) scale(1.2); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.winner-crown {
  display: inline-block;
  animation: crownDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  margin-right: 8px;
  font-size: 32px;
}

/* 4. Effet machine à écrire (curseur) */
@keyframes blink { 50% { opacity: 0; } }
.type-cursor { animation: blink 1s step-start infinite; }
/* ===== FOND ANIMÉ PREMIUM (Mesh Gradient + Particules) ===== */

/* 1. Le Mesh Gradient (Les taches de couleurs floues) */
#bg-mesh {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -2;
  overflow: hidden;
  background: var(--bg);
  pointer-events: none;
}
#bg-mesh::before, #bg-mesh::after {
  content: "";
  position: absolute;
  width: 60vw; height: 60vw;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  animation: floatMesh 20s infinite alternate ease-in-out;
}
#bg-mesh::before {
  background: var(--violet);
  top: -10%; left: -10%;
}
#bg-mesh::after {
  background: var(--lime);
  bottom: -20%; right: -10%;
  animation-delay: -10s;
  animation-duration: 25s;
}
@keyframes floatMesh {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(10vw, 10vh) scale(1.2); }
  100% { transform: translate(-5vw, 15vh) scale(0.9); }
}

/* 2. Les Particules flottantes (Les étoiles) */
#bg-particles {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  animation: floatUpParticle linear infinite;
}
@keyframes floatUpParticle {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* En mode clair, on baisse l'opacité du fond pour ne pas agresser les yeux */
[data-theme="light"] #bg-mesh::before,
[data-theme="light"] #bg-mesh::after { opacity: 0.15; }
[data-theme="light"] .particle { background: var(--violet); }
/* ===== CONSTELLATION & ÉTOILES ===== */
#bg-particles {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.star-particle {
  position: absolute;
  background: var(--fg);
  border-radius: 50%;
  opacity: 0.8;
  box-shadow: 0 0 6px var(--fg);
  transition: transform 0.1s;
}
.star-4 {
  position: absolute;
  color: var(--lime);
  opacity: 0.9;
  filter: drop-shadow(0 0 8px var(--lime));
}
[data-theme="light"] .star-particle { background: var(--violet); box-shadow: 0 0 6px var(--violet); }
[data-theme="light"] .star-4 { color: var(--violet); filter: drop-shadow(0 0 8px var(--violet)); }
/* ===== PACK EFFETS SPÉCIAUX ===== */

/* 1. Logo BAZAR vivant */
.brand svg {
  animation: floatLogo 4s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 15px rgba(184,255,69,0.3));
}
@keyframes floatLogo {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-5px) scale(1.05); }
}

/* 2. Apparition des cartes en cascade */
.stagger-item {
  animation: slideUpStagger 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  opacity: 0;
}
@keyframes slideUpStagger {
  from { opacity: 0; transform: translateY(60px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 3. Effet de clic (Ripple) */
.click-ripple {
  position: fixed;
  border-radius: 50%;
  background: rgba(184, 255, 69, 0.4);
  transform: scale(0);
  animation: rippleAnim 0.6s ease-out forwards;
  pointer-events: none;
  z-index: 9999;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}
/* ===== PACK IMMERSION TOTALE ===== */

/* 1. Le Flip 3D pour les cartes */
.hold .back { transform: rotateY(180deg); }
.hold.show .back { transform: rotateY(360deg); transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); }
.hold { perspective: 1000px; }

/* 2. L'animation des points qui s'envolent */
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
}
.float-score {
  position: fixed;
  font: 900 28px var(--display);
  color: var(--lime);
  text-shadow: 0 0 10px var(--lime);
  pointer-events: none;
  z-index: 9999;
  animation: floatUp 1.5s ease-out forwards;
}

/* 3. La couronne du gagnant */
@keyframes crownDrop {
  0% { transform: translateY(-50px) scale(0); opacity: 0; }
  60% { transform: translateY(10px) scale(1.2); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.winner-crown {
  display: inline-block;
  animation: crownDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  margin-right: 8px;
  font-size: 32px;
}

/* 4. Effet machine à écrire (curseur) */
@keyframes blink { 50% { opacity: 0; } }
.type-cursor { animation: blink 1s step-start infinite; }
/* ===== ÉCRAN D'INTRO CINÉMATIQUE ===== */
#splash-screen {
  position: fixed;
  inset: 0;
  background: #0B0F1E;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.8s cubic-bezier(0.8, 0, 0.2, 1);
}
#splash-screen.hidden {
  transform: translateY(-100%);
}
.splash-logo {
  animation: splashPop 2s ease-in-out infinite alternate, splashGlow 2s infinite;
}
@keyframes splashPop {
  0% { transform: scale(0.9); }
  100% { transform: scale(1.1); }
}
@keyframes splashGlow {
  0%, 100% { filter: drop-shadow(0 0 20px rgba(184,255,69,0.2)); }
  50% { filter: drop-shadow(0 0 60px rgba(184,255,69,0.6)); }
}
.splash-text {
  margin-top: 20px;
  font: 800 24px var(--display);
  color: var(--lime);
  letter-spacing: 0.2em;
  opacity: 0;
  animation: fadeInText 1s 0.5s forwards;
}
@keyframes fadeInText {
  to { opacity: 1; }
}
/* ===== RETOUCHE IDENTITÉ VISUELLE ===== */

/* Cartes plus arrondies et modernes */
.card, .game, .btn {
  border-radius: 24px !important;
}

/* Titres plus gros et plus impactants */
h1 {
  font-weight: 800 !important;
  letter-spacing: -0.03em !important;
}
h2 {
  font-weight: 700 !important;
}

/* Le bouton vert principal avec une lueur plus forte */
.btn-primary {
  background: linear-gradient(135deg, var(--lime) 0%, #D5F89B 100%) !important;
  box-shadow: 0 8px 25px rgba(184, 255, 69, 0.4) !important;
  color: var(--lime-ink) !important;
  font-weight: 800 !important;
  letter-spacing: 0.02em;
}

/* Les boutons secondaires (comme "Voir tous les jeux") en violet doux */
.btn-secondary {
  border-color: var(--violet-soft) !important;
  color: var(--violet-soft) !important;
  font-weight: 700 !important;
}
/* ===== EFFET DISTRIBUTION DE CARTES (UNDERCOVER) ===== */
@keyframes dealCard3D {
  0% { 
    transform: translateY(200px) rotateX(-90deg) scale(0.5); 
    opacity: 0; 
  }
  60% { 
    transform: translateY(-15px) rotateX(10deg) scale(1.05); 
    opacity: 1; 
  }
  100% { 
    transform: translateY(0) rotateX(0deg) scale(1); 
    opacity: 1; 
  }
}

.hold.dealing {
  animation: dealCard3D 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  transform-style: preserve-3d;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 2px var(--lime);
}
/* ===== BARRE DE NAVIGATION BASSE ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; width: 100%;
  background: rgba(11, 15, 30, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px 24px 0 0;
  display: flex;
  justify-content: space-around;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
}
.bottom-nav button {
  background: none; border: none;
  color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font: 600 11px var(--display);
  cursor: pointer;
  flex: 1;
  transition: color 0.2s;
  position: relative;
}
.bottom-nav button svg {
  width: 24px; height: 24px;
  fill: currentColor;
  transition: transform 0.2s;
}
.bottom-nav button.active {
  color: var(--lime);
}
.bottom-nav button.active svg {
  transform: translateY(-2px) scale(1.15);
}
.bottom-nav button.active::before {
  content: "";
  position: absolute;

<script>
/* BAZAR Party : pont entre le jeu et la base Netlify (fonction /api/kv). */
(function(){
  if(window.claude)return;
  var API='/api/kv',POLL=700;
  function par(p){return p.split('/').slice(0,-1).join('/')}
  async function call(body){
  var r;
  // On crée un "minuteur" de 5 secondes
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort(); }, 10000);
  
  try {
    r = await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal: controller.signal // On lie la requête au minuteur
    });
    clearTimeout(timeoutId); // Si ça répond vite, on annule le minuteur
  } catch(e) {
    clearTimeout(timeoutId);
    // Si l'erreur est un abandon (timeout), on renvoie un code clair
    if(e.name === 'AbortError') {
      throw {code:'timeout', message:'Le serveur met trop de temps à répondre.'};
    }
    throw {code:'unavailable', message:'réseau'};
  }
  
  var j=null;
  try{ j=await r.json(); }catch(e){}
  
  if(!r.ok) {
    throw {code:(j&&j.code)||'unavailable', message:(j&&j.error)||('HTTP '+r.status)};
  }
  return j;
}
  function mkDoc(p,r){return {id:p.split('/').pop(),exists:!!r.exists,data:function(){return r.exists?r.data:undefined}}}
  function mkColl(l){return {docs:(l||[]).map(function(x){return {id:x.id,exists:true,data:function(){return x.data}}})}}
  /* Toutes les écoutes d'un téléphone sont regroupées en une seule requête toutes les 1,5 s. */
  var subs=[],timer=null,busy=false,again=false,fails=0;
  function kick(ms){clearTimeout(timer);timer=setTimeout(tick,ms==null?POLL+Math.floor(Math.random()*300):ms)}
  async function tick(){
    if(!subs.length)return;
    if(document.hidden){kick();return}
    if(busy){again=true;return}
    busy=true;var list=subs.slice();
    try{var res=await call({op:'watch',items:list.map(function(s){return {k:s.kind,p:s.p}})});fails=0;
      list.forEach(function(s,i){if(s.dead)return;var r=res[i],j,snap;
        if(s.kind==='doc'){j=JSON.stringify(r);snap=mkDoc(s.p,r)}
        else{j=JSON.stringify((r||[]).map(function(x){return [x.id,x.data]}).sort());snap=mkColl(r)}
        if(j!==s.last){s.last=j;try{s.cb(snap)}catch(e){console.error(e)}}})}
    catch(e){fails++;if(fails===6)list.forEach(function(s){if(!s.dead&&s.er)s.er(e)})}
    busy=false;
    if(again){again=false;kick(0)}else kick()}
  function sub(kind,p,cb,er){var s={kind:kind,p:p,cb:cb,er:er,last:null,dead:false};subs.push(s);kick(0);
    return function(){s.dead=true;var i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)kick(0)});
  async function write(body){var r=await call(body);kick(60);return r}
  function doc(p){return {id:p.split('/').pop(),path:p,
    get:async function(){return mkDoc(p,await call({op:'get',path:p}))},
    set:function(d){return write({op:'set',path:p,data:d})},
    update:function(d){return write({op:'update',path:p,data:d})},
    delete:function(){return write({op:'delete',path:p})},
    onSnapshot:function(cb,er){return sub('doc',p,cb,er)}}}
  function coll(c){return {path:c,
    get:async function(){return mkColl(await call({op:'list',path:c}))},
    doc:function(id){return doc(c+'/'+id)},
    onSnapshot:function(cb,er){return sub('coll',c,cb,er)}}}
  var uid=null;
  try{uid=localStorage.getItem('bazar-uid')}catch(e){}
  if(!uid){uid='u'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('bazar-uid',uid)}catch(e){}}
  var DBN={doc:doc,collection:coll},USR={id:async function(){return uid},can:async function(){return true},isOwner:async function(){return false},canEdit:async function(){return false}};
  window.claude={use:function(n){return Promise.resolve(n==='db'?DBN:(n==='user'?USR:null))}};
})();
</script>

function refreshSetup(){
  var st=S.settings,n=nP(),inf=st.uc+st.mw,c=n-inf,is=issue();
  var s=document.getElementById('sumroles');if(s)s.textContent=c+' Civil'+(c>1?'s':'')+' · '+st.uc+' Undercover'+(st.mw?' · '+st.mw+' Mr White':'');
  var i=document.getElementById('issue');if(i)i.textContent=is;
  var b=document.getElementById('start');if(b)b.disabled=!!is||!rolesOk();
  S.players.forEach(function(p){var el=document.getElementById('pn-'+p.id);if(el){var a=el.previousElementSibling;if(a&&a.tagName==='SPAN')a.outerHTML=av(p)}});
  var z=document.getElementById('savedlists');
  if(z){var sl=savedLists(),ks=Object.keys(sl);
    z.innerHTML=ks.length?ks.map(function(k){return '<button class="chip" data-act="loadlist" data-k="'+esc(k)+'" style="padding-right:34px;position:relative">'+esc(k)+' ('+sl[k].length+')<span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);opacity:.6;font-size:14px" data-act="dellist" data-k="'+esc(k)+'">×</span></button>'}).join(''):'<span class="muted small">Aucune liste enregistrée pour l\'instant.</span>'}

function customWords(){var seen={},out=[];String(S.my.custom||'').split(/[\n,;]+/).forEach(function(w){w=w.trim();if(w.length<2||w.length>18)return;var k=key(w);if(seen[k])return;seen[k]=1;out.push(w)});return out}

  return ''}
function pickWords(sz){var cw=customWords(),pool=cw.length>=sz?cw:BANK;
  var fresh=pool.filter(function(w){return S.mused.indexOf(key(w))<0});

function sym(t,c){var p=['<circle cx="12" cy="12" r="7"/>','<path d="M12 3l8 9-8 9-8-9z"/>','<path d="M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>','<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>'][t];
  return '<svg class="'+(c||'sy')+'" viewBox="0 0 24 24" fill="'+(t<2?'currentColor':'none')+'" aria-hidden="true">'+p+'</svg>'}
function legend(){var n=TN(),m=S.M;return '<div class="legend"><span class="lg t0">'+sym(0,'inl')+esc(n[0])+' · '+m.remain[0]+'</span><span class="lg t1">'+sym(1,'inl')+esc(n[1])+' · '+m.remain[1]+'</span><span class="lg">'+sym(2,'inl')+'Innocents</span><span class="lg">'+sym(3,'inl')+'Assassin</span></div>'}
function tchip(t){var m=S.M;return '<span class="tchip t'+t+(m.turn===t&&m.phase!=='end'?' on':'')+'">'+sym(t,'inl')+'<b>'+m.remain[t]+'</b><span class="tn">'+esc(TN()[t])+'</span></span>'}
function mbar(){return '<div class="bar mbar">'+tchip(0)+tchip(1)+'<button class="icon-btn" data-act="menu" aria-label="Menu de la partie">'+I.dots+'</button></div>'}
function boardHtml(mode){var m=S.M,k=mode>0;
  return '<div class="board" lang="fr" role="grid">'+m.cards.map(function(c,i){
    var L=c.w.length,cls='mc'+(L>9?' l1':(L>7?' l2':''));
    if(c.rev||k)cls+=' r'+c.t;
    if(mode===1&&c.rev)cls+=' dim';
    if(!k&&i===m.last)cls+=' new';
    if(!k&&i===m.sel)cls+=' s';
    var on=!k&&!c.rev&&m.phase==='guess';
    return '<button class="'+cls+'" data-i="'+i+'"'+(on?' data-act="msel"':' tabindex="-1" aria-disabled="true"')+' aria-label="'+esc(c.w)+(c.rev?' (révélée)':'')+'">'+esc(c.w)+((c.rev||k)?sym(c.t):'')+'</button>'}).join('')+'</div>'}

function pubU(g){var s={g:'u',gid:g.gid,ph:g.ph,round:g.round,alive:g.alive,order:order(g),speak:g.speak,seen:Object.keys(g.seen),players:g.base,cat:null};
  if(g.vote){s.cand=g.vote.cand;s.revote=g.vote.revote;s.vk=g.vote.k;s.voted=Object.keys(g.vote.picks)}else s.voted=[];
  if(g.ph==='result'||g.ph==='mw'||g.ph==='end'){s.tally=g.tally;s.elim=g.elim;
    if(g.elim){var r=g.roles[g.elim];if(OL.cfg.reveal||r==='mw'){s.er=r}}}
  if(g.mw){s.mw={text:g.mw.text,ok:g.mw.ok};if(g.mw.ok!==null)s.civ=g.civ}
  if(g.ph==='end'){s.winner=g.winner;s.civ=g.civ;s.uc=g.uc;s.roles=g.roles;s.gains=g.gains;s.mwWin=g.mwWin}
  return s}
function huAct(uid,a,g){var ph=g.ph,host=uid===PID;
  switch(a.t){
    case 'seen':if(ph!=='reveal'||g.base.indexOf(uid)<0)return;g.seen[uid]=1;
      if(g.base.every(function(id){return g.seen[id]||!OL.players[id]}))huClues(g);break;
    case 'force':if(!host||ph!=='reveal')return;huClues(g);break;
    case 'next':{if(ph!=='clues')return;var o=order(g);if(!host&&o[g.speak]!==uid)return;
      g.speak++;if(g.speak>=o.length)huVote(g,g.alive.slice(),false);break}
    case 'vote':{if(ph!=='vote')return;var v=g.vote;
      if(g.alive.indexOf(uid)<0||a.k!==v.k||v.cand.indexOf(a.v)<0||a.v===uid)return;
      v.picks[uid]=a.v;
      if(g.alive.every(function(id){return v.picks[id]||!OL.players[id]}))huTally(g);break}
    case 'close':if(!host||ph!=='vote')return;huTally(g);break;
    case 'cont':if(!host||ph!=='result')return;huAfter(g);break;
    case 'mw':{if(ph!=='mw'||!g.mw||g.mw.ok!==null||uid!==g.elim)return;
      var tx=String(a.x||'').trim().slice(0,40);if(!tx)return;g.mw.text=tx;g.mw.ok=key(tx)===key(g.civ);break}
    case 'mwnext':if(!host||ph!=='mw'||!g.mw||g.mw.ok===null)return;
      if(g.mw.ok)huFinish(g,'mw',g.elim);else huResolve(g);break;
    default:return}}
function huClues(g){g.ph='clues';g.speak=0}
function huVote(g,cand,revote){g.ph='vote';g.vote={cand:cand,revote:revote,picks:{},k:g.round+'-'+(revote?2:1)+'-'+(Date.now()%100000)}}
function huTally(g){var v=g.vote,counts={};v.cand.forEach(function(id){counts[id]=0});
  Object.keys(v.picks).forEach(function(k){counts[v.picks[k]]++});
  var rows=v.cand.map(function(id){return {id:id,n:counts[id]}}).sort(function(a,b){return b.n-a.n}),top=rows[0].n,
    tied=rows.filter(function(r){return r.n===top}).map(function(r){return r.id});
  if(tied.length===1){g.tally=rows;g.elim=tied[0];g.ph='result'}
  else if(!v.revote)huVote(g,tied,true);
  else{g.tally=rows;g.elim=null;g.ph='result'}}
function huAfter(g){var id=g.elim;if(!id){huRound(g);return}
  g.alive=g.alive.filter(function(x){return x!==id});
  if(g.roles[id]==='mw'){g.mw={text:'',ok:null};g.ph='mw'}else huResolve(g)}
function huResolve(g){var inf=g.alive.filter(function(i){return g.roles[i]!=='civil'}).length,civ=g.alive.length-inf;
  if(inf===0)huFinish(g,'civil');else if(civ<=inf)huFinish(g,'inf');else huRound(g)}
function huRound(g){g.round++;g.base=shuffle(g.alive);g.speak=0;g.elim=null;g.tally=null;g.vote=null;g.mw=null;g.ph='clues'}
function huFinish(g,w,who){
  g.winner=w;g.mwWin=who||null;g.gains={};
  g.base.forEach(function(id){
    var r=g.roles[id],won=(w==='civil'&&r==='civil')||(w==='inf'&&r!=='civil')||(w==='mw'&&id===who);
    g.gains[id]=won?PTS[r]:0;
    OL.scores[id]=(OL.scores[id]||0)+g.gains[id];
    // On met à jour les stats du joueur en cours (s'il est dans cette partie)
    if(id === PID) {
      updateMyStats(won, 5, 2); // +5 jetons pour une partie, +2 min de jeu
    }
  });
  g.ph='end';
}

function mkGameM(){var c=OL.cfg,sz=c.size,words=pickWords(sz),first=Math.random()<.5?0:1,cn=counts(sz),types=[],i,teams={},spies=[null,null];
  OL.plist.forEach(function(p){var q=p.team===1?1:0;teams[p.id]=q;if(p.spy)spies[q]=p.id});
  for(i=0;i<cn.a;i++)types.push(first);
  for(i=0;i<cn.b;i++)types.push(1-first);
  for(i=0;i<cn.n;i++)types.push(2);
  types.push(3);types=shuffle(types);
  var rem=[0,0];rem[first]=cn.a;rem[1-first]=cn.b;
  var g={g:'m',gid:String(Date.now()),ph:'clue',cards:words.map(function(w,ix){return {w:w,t:types[ix],rev:false}}),first:first,turn:first,clue:null,left:0,made:0,remain:rem,winner:null,why:'',note:'L\'équipe '+c.names[first]+' commence : '+cn.a+' cartes à trouver.',last:-1,lt:0,lg:'',teams:teams,spies:spies};
  g.secs=OL.plist.map(function(p){var sp=(p.id===spies[0]||p.id===spies[1]);return [p.id,{k:g.gid,types:sp?types:null}]});return g}
function pubM(g){return {g:'m',gid:g.gid,ph:g.ph,turn:g.turn,clue:g.clue,left:g.left,made:g.made,remain:g.remain,note:g.note,last:g.last,lt:g.lt,lg:g.lg,teams:g.teams,spies:g.spies,winner:g.winner,why:g.why,
  cards:g.cards.map(function(c){return c.rev?{w:c.w,rev:1,t:c.t}:{w:c.w}}),keyTypes:g.ph==='end'?g.cards.map(function(c){return c.t}):null}}
function hmAct(uid,a,g){var ph=g.ph,host=uid===PID,tm=g.teams[uid],cur=g.turn,nm=OL.cfg.names;
  switch(a.t){
    case 'clue':{if(ph!=='clue'||uid!==g.spies[cur])return;
      var w=String(a.w||'').trim().slice(0,24),n=Math.max(1,Math.min(10,Math.floor(+a.n)||1));
      if(!w||/\s/.test(w)||w.length<2||g.cards.some(function(c){return !c.rev&&key(c.w)===key(w)}))return;
      g.clue={w:w,n:n};g.left=n>=10?99:n+1;g.made=0;g.ph='guess';g.note='';break}
    case 'reveal':{if(ph!=='guess'||tm!==cur||uid===g.spies[cur])return;
      var i=Math.floor(+a.i),c=g.cards[i];if(!c||c.rev)return;hmVal(g,i);break}
    case 'fin':if(ph!=='guess'||tm!==cur||uid===g.spies[cur]||g.made<1)return;
      hmEnd(g,'L\'équipe '+nm[cur]+' passe la main.');break;
    case 'skip':if(!host||(ph!=='clue'&&ph!=='guess'))return;
      hmEnd(g,'L\'hôte a passé le tour de l\'équipe '+nm[cur]+'.');break;
    default:return}}
function hmVal(g,i){var c=g.cards[i],me=g.turn,nm=OL.cfg.names,t=c.t;
  c.rev=true;g.made++;g.last=i;g.lt=Date.now();
  if(t===3){g.lg='k';return hmWin(g,1-me,'L\'équipe '+nm[me]+' a touché l\'assassin.')}
  if(t<2)g.remain[t]--;
  g.lg=t===me?'g':(t===2?'n':'x');
  if(g.remain[0]===0)return hmWin(g,0,'Tous ses agents ont été retrouvés.');
  if(g.remain[1]===0)return hmWin(g,1,'Tous ses agents ont été retrouvés.');
  if(t===me){g.left--;if(g.left<=0)hmEnd(g,'Plus d\'essais : fin du tour de l\'équipe '+nm[me]+'.')}
  else hmEnd(g,t===2?'Carte innocente : fin du tour de l\'équipe '+nm[me]+'.':'Carte de l\'équipe '+nm[t]+' ! Fin du tour de l\'équipe '+nm[me]+'.')}
function hmEnd(g,note){g.turn=1-g.turn;g.ph='clue';g.clue=null;g.made=0;g.left=0;g.note=note}
function hmWin(g,t,why){g.winner=t;g.why=why;g.ph='end';OL.wins[t]=(OL.wins[t]||0)+1}

function vOnline(){
  if(!OL.on || !OL.room) return vOLoad('Connexion au salon…');
  if(OL.cfg == null) return vOLoad('Chargement du salon…');
  
  // --- MODE TV / GRAND ÉCRAN ---
  if (OL.display) {
    if (OL.status === 'lobby' || !OL.s) return vOLoad(''); 
    
    // Si c'est Dessins, on utilise l'écran TV des dessins
    if (OL.game === 'd') return vOGameD();
    if (OL.game === 'b') return vOGameB();
    if (PVG[OL.game]) return vOGamePV();
    
    // Si c'est Undercover, on utilise le nouvel écran TV
    if (OL.game === 'u') return vOTVUndercover();
    
    return '<div class="wrap wide" style="text-align:center;padding-top:20vh;"><h1>La partie a commencé !</h1><p class="lead">Suivez les instructions sur vos téléphones.</p></div>';
  }
  
  // --- MODE JOUEUR (Téléphone) ---
  if(OL.status === 'lobby' || !OL.s){
    if(OL.status === 'play' && !OL.s) return vOLoad('Chargement de la partie…');
    
    var lobbyHtml = '';
    if(OL.game === 'm') lobbyHtml = vOLobbyM();
    else if(OL.game === 'l') lobbyHtml = vOLobbyL();
    else if(OL.game === 'd') lobbyHtml = vOLobbyD();
    else if(OL.game === 'b') lobbyHtml = vOLobbyB();
    else if(PVG[OL.game]) lobbyHtml = vOLobbyPV();
    else if(OL.game === 't') lobbyHtml = vOLobbyT();
    else lobbyHtml = vOLobbyU();
    
    var tip = BAZ_TIPS[OL.game] || "En attente des joueurs...";
    
    return lobbyHtml.replace('<section class="card"><h2>Équipes</h2>', bazBubble(tip)+'<section class="card"><h2>Équipes</h2>')
                    .replace('<section class="card"><h2>Comment jouer ?</h2>', bazBubble(tip)+'<section class="card"><h2>Comment jouer ?</h2>')
                    .replace('<section class="card"><h2>Réglages</h2>', bazBubble(tip)+'<section class="card"><h2>Réglages</h2>')
                    .replace('<section class="card"><h2>Les jeux du tournoi</h2>', bazBubble(tip)+'<section class="card"><h2>Les jeux du tournoi</h2>');
  }
  
  // --- JEU EN COURS (Téléphone) ---
  if (OL.game === 'm') return vOGameM();
  if (OL.game === 'l') return vOGameL();
  if (OL.game === 'd') return vOGameD();
  if (OL.game === 'b') return vOGameB();
  if (OL.game === 'p') return vOGameP();
  if (PVG[OL.game]) return vOGamePV();
  return vOGameU();
}

function toast(msg){

function generateShareImage(gameType){
  var canvas=document.createElement('canvas');
  canvas.width=1080; canvas.height=1920;
  var ctx=canvas.getContext('2d');
  
  var grad=ctx.createLinearGradient(0,0,0,1920);
  grad.addColorStop(0,'#0B0F1E'); grad.addColorStop(1,'#161C35');
  ctx.fillStyle=grad; ctx.fillRect(0,0,1080,1920);
  
  ctx.fillStyle='rgba(184,255,69,0.4)';
  for(var i=0;i<80;i++){
    var x=Math.random()*1080, y=Math.random()*1920, r=Math.random()*3+1;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  
  // Logo BAZAR
  ctx.fillStyle='#B8FF45';
  ctx.font='900 90px Outfit, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('BAZAR', 540, 180);
  ctx.fillStyle='#FFFFFF';
  ctx.font='700 40px Outfit, sans-serif';
  ctx.fillText('PARTY', 540, 230);
  
  var title = gameType==='u' ? 'Résultat Undercover' : 'Le classement de la soirée';
  ctx.fillStyle='#AAB0CC';
  ctx.font='40px Inter, sans-serif';
  ctx.fillText(title, 540, 320);
  
  var playersList = [];
  if(S.screen==='online' && OL.players){
    for(var id in OL.players){
      var p = OL.players[id];
      playersList.push({name:p.name, score:OL.scores[id]||0, avatar:p.avatar});
    }
  } else {
    playersList = S.players.map(function(p){return {name:p.name, score:p.score, avatar:p.avatar}});
  }
  
  var sorted = playersList.sort(function(a,b){return b.score-a.score});
  var displayPlayers = sorted.slice(0,6);
  
  displayPlayers.forEach(function(p, idx){
    var y = 480 + (idx * 180);
    ctx.fillStyle = idx===0 ? 'rgba(184,255,69,0.2)' : 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.arc(150, y-20, 60, 0, Math.PI*2); ctx.fill();
    
    var baseEmoji = (p.avatar && AV_BASES[p.avatar.base]) ? AV_BASES[p.avatar.base] : '👤';
    ctx.font = '60px Arial'; ctx.textAlign = 'center';
    ctx.fillText(baseEmoji, 150, y);
    
    ctx.fillStyle = idx===0 ? '#B8FF45' : '#FFFFFF';
    ctx.font = 'bold 55px Outfit, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(p.name, 250, y);
    
    ctx.textAlign = 'right';
    ctx.font = 'bold 55px Outfit, sans-serif';
    ctx.fillText(p.score + ' pts', 980, y);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(250, y+60); ctx.lineTo(980, y+60); ctx.stroke();
  });
  
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.font = 'bold 45px Inter, sans-serif';
  ctx.fillText('Rejoins la partie !', 540, 1650);
  ctx.fillStyle = '#B8FF45';
  ctx.font = 'bold 35px Inter, sans-serif';
  ctx.fillText('bazar-party-mobile.vercel.app', 540, 1720);
  
  canvas.toBlob(function(blob){
    var file = new File([blob], 'bazar-party-score.png', {type: 'image/png'});
    if(navigator.canShare && navigator.canShare({files: [file]})){
      navigator.share({files: [file], title: 'Mon score BAZAR Party', text: 'J\'ai gagné à BAZAR Party !'}).catch(function(){});
    } else {
      var link = document.createElement('a');
      link.download = 'bazar-party-score.png';
      link.href = URL.createObjectURL(blob);
      link.click();
      toast('Image téléchargée !');
    }
  }, 'image/png');
}

  }

  g.first = first || null; 
  var items = {}, k;
  
  g.ids.forEach(function(uid){
    var a = g.ans[uid] || [], seen = {};
    items[uid] = g.prompts.map(function(t,i){
      var w = String(a[i]||'').trim().slice(0,40), st='ok';
      if(!w) st='empty';
      else if(!lok(w,g.letter)) st='bad';
      else { var kk=key(w); if(seen[kk]) st='dupself'; else seen[kk]=1; }
      return {w:w, st:st};
    });
  });

  g.prompts.forEach(function(t,i){
    var m={};
    g.ids.forEach(function(uid){
      var it=items[uid][i];
      if(it.st==='ok'){var kk=key(it.w);(m[kk]=m[kk]||[]).push(it)}
    });
    for(k in m) if(m[k].length>1) m[k].forEach(function(it){it.d=1});
  });

  g.items=items;

}
function hlTally(g){g.ids.forEach(function(uid){var tot=0;
    g.items[uid].forEach(function(it,i){var p=0;
      if(it.st==='ok'){var sum=0,n=0;Object.keys(g.votes).forEach(function(v){if(v===uid)return;var x=g.votes[v][uid+'|'+i];if(x!=null){sum+=x;n++}});
        var avg=n?sum/n:1;p=avg<.5?0:(avg<1.5?1:2);if(it.d)p=Math.min(p,1)}
      it.p=p;tot+=p});
    g.rtot=g.rtot||{};g.rtot[uid]=tot;g.tot[uid]=(g.tot[uid]||0)+tot});
  g.ph='result'}
function hlAct(uid,a,g){var host=uid===PID;
  switch(a.t){
    case 'ans':{if(g.ph!=='play'||g.ids.indexOf(uid)<0||Date.now()<g.startAt-500)return false;
      var arr=(Array.isArray(a.a)?a.a:[]).slice(0,g.np).map(function(x){return String(x||'').slice(0,40)});g.ans[uid]=arr;
      var n=arr.filter(function(x){return x.trim()}).length;if(g.prog[uid]===n)return false;g.prog[uid]=n;break}
    case 'done':{if(g.ph!=='play'||g.ids.indexOf(uid)<0||Date.now()<g.startAt)return false;
      var ar=(Array.isArray(a.a)?a.a:[]).slice(0,g.np).map(function(x){return String(x||'').trim().slice(0,40)}),seen={},ok=ar.length===g.np;
      ar.forEach(function(w){if(!lok(w,g.letter)||seen[key(w)])ok=false;seen[key(w)]=1});
      if(!ok)return false;
      g.ans[uid]=ar;g.prog[uid]=g.np;if(!g.first)g.first=uid;g.endsAt=Math.min(g.endsAt,Date.now()+5000);break}
    case 'force':if(!host||g.ph!=='play')return false;g.endsAt=Math.min(g.endsAt,Date.now()+800);break;
    case 'votes':{if(g.ph!=='vote'||g.ids.indexOf(uid)<0||g.votes[uid])return false;
      var v={},src=a.v||{};
      g.ids.forEach(function(o){if(o===uid)return;g.items[o].forEach(function(it,i){if(it.st!=='ok')return;var x=Math.floor(+src[o+'|'+i]);if(!(x>=0&&x<=2))x=1;if(it.d)x=Math.min(x,1);v[o+'|'+i]=x})});
      g.votes[uid]=v;
      if(g.ids.every(function(id){return g.votes[id]||!OL.players[id]}))hlTally(g);break}
    case 'close':if(!host||g.ph!=='vote')return false;hlTally(g);break;
    case 'cont':{if(!host||g.ph!=='result')return false;if(g.round>=g.rounds)g.ph='end';else hlRound(g);break}
    default:return false}}

    if(D.full){toast('Toile pleine');return}

    OL.drawing=true;var p=pos(e);D.cur={c:D.color,w:D.size,p:[p[0],p[1]]};D.strokes.push(D.cur);D.pts++;seg(p,[p[0]+.1,p[1]])});

var MU={on:true,ctx:null,bus:null,step:0,next:0,tm:0,started:false};
try{if(localStorage.getItem('bazar-music')==='off')MU.on=false}catch(e){}
var MBPM=105,MCH=[
  {r:57,k:[60,64,67,71]},  /* Am7 */
  {r:53,k:[57,60,64,67]},  /* Fmaj7 */
  {r:48,k:[55,60,64,67]},  /* Cmaj7 */
  {r:55,k:[59,62,66,69]}   /* G */
],MSC=[72,74,76,79,81,84,79,76];
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function muBuild(ctx){
  var out=ctx.createGain();out.gain.value=0;
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;lp.Q.value=.5;
  var comp=ctx.createDynamicsCompressor();comp.threshold.value=-15;comp.ratio.value=4;comp.attack.value=.01;comp.release.value=.2;
  lp.connect(comp);comp.connect(out);out.connect(ctx.destination);
  var dry=ctx.createGain();dry.gain.value=1;dry.connect(lp);
  var dl=ctx.createDelay(1.5);dl.delayTime.value=60/MBPM*.75;
  var fb=ctx.createGain();fb.gain.value=.35;var df=ctx.createBiquadFilter();df.type='lowpass';df.frequency.value=2000;
  var send=ctx.createGain();send.gain.value=.4;
  send.connect(dl);dl.connect(df);df.connect(fb);fb.connect(dl);df.connect(lp);
  var n=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=n.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return {out:out,dry:dry,send:send,noise:n,ctx:ctx}}
function muTone(B,type,f,t,len,vol,att,echo,detune){
  var c=B.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;if(detune)o.detune.value=detune;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  o.connect(g);g.connect(B.dry);if(echo){var s=c.createGain();s.gain.value=echo;g.connect(s);s.connect(B.send)}
  o.start(t);o.stop(t+len+.05)}
function muKick(B,t,v){var c=B.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.34);o.connect(g);g.connect(B.dry);o.start(t);o.stop(t+.4)}
function muNoise(B,t,len,v,type,freq,echo){var c=B.ctx,s=c.createBufferSource();s.buffer=B.noise;
  var f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=type==='bandpass'?.9:.5;
  var g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  s.connect(f);f.connect(g);g.connect(B.dry);if(echo){var e=c.createGain();e.gain.value=echo;g.connect(e);e.connect(B.send)}
  s.start(t,Math.random()*.5);s.stop(t+len+.05)}

/* NOUVELLE MELODIE GENERATIVE */
var currentMelody = [];
function generateMelody() {
  var notes = [];
  var scale = [0, 2, 4, 5, 7, 9, 11, 12]; // Gamme majeure
  var root = [72, 74, 76, 79][Math.floor(Math.random()*4)];
  for(var i=0; i<8; i++) {
    if(Math.random() > 0.3) notes.push(root + scale[Math.floor(Math.random()*scale.length)]);
    else notes.push(null);
  }
  return notes;
}

function muStep(B,step,t){
  var bar=Math.floor(step/16)%4,p=step%16,ch=MCH[bar],q=60/MBPM/4;
  var sw=(p%4===2)?q*.25:0,T=t+sw;
  
  /* Grosse caisse (Kick) bien profonde */
  if(p===0||p===8||(p===10&&bar%2===1)) muKick(B,T,0.4);
  
  /* Clap sur 2 et 4 */
  if(p===4||p===12) muNoise(B,T,.15,.1,'bandpass',1800,.2);
  
  /* Charley très rapide (style Trap) */
  if(p%2===0) muNoise(B,T,.03,.02,'highpass',9000,0);
  if(p%4===1 && Math.random()>0.5) muNoise(B,T,.02,.015,'highpass',9000,0);
  
  /* Basse 808 profonde et groovy */
  if(p===0) muTone(B,'sine',mtof(ch.r-24),T,.8,.25,.01,0); // -24 = très grave
  if(p===7||p===10) muTone(B,'sine',mtof(ch.r-24),T,.5,.2,.01,0);
  
  /* Accords de piano électrique (Lo-fi) */
  if(p===0||p===11){ ch.k.forEach(function(m,i){ muTone(B,'triangle',mtof(m-12),T+i*.01,1.5,.06,.02,.3) }) }
  
  /* Mélodie douce (on la baisse d'une octave avec -12 pour éviter l'aigu) */
  if(step % 64 === 0) { currentMelody = generateMelody(); }
  if(p%4 === 0) {
    var noteIndex = (p/4) + (bar*2);
    if(currentMelody[noteIndex]) {
       // On utilise 'sine' (plus doux) et on baisse d'une octave (-12)
       // Mélodie une octave plus bas (-24 au lieu de -12) et volume baissé (0.03)
muTone(B,'triangle',mtof(currentMelody[noteIndex]-24),T,1.5,.03,.02,.5);
    }
  }
}
function muTick(){var c=MU.ctx;if(!c||!MU.on)return;
  var q=60/MBPM/4;
  while(MU.next<c.currentTime+.3){muStep(MU.bus,MU.step,MU.next);MU.step=(MU.step+1)%64;MU.next+=q}}

/* === BULLDOZER : CONSTELLATION INTERACTIVE === */
/* === BULLDOZER : NEBULA FLOW (Fond organique) === */
/* === BULLDOZER : NEBULA FLOW ULTIME === */
(function initNebula(){
  var cvs = document.createElement('canvas');
  cvs.id = 'bg-nebula';
  cvs.style.position = 'fixed'; cvs.style.top = '0'; cvs.style.left = '0';
  cvs.style.width = '100vw'; cvs.style.height = '100vh';
  cvs.style.zIndex = '-1'; cvs.style.pointerEvents = 'none';
  document.body.insertBefore(cvs, document.body.firstChild);
  
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  var blobs = [], particles = [], doodles = [];
  var mouse = {x: -1000, y: -1000};

  window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', function(e){ if(e.touches.length) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });
  window.addEventListener('mouseleave', function(){ mouse.x = -1000; mouse.y = -1000; });

  function resize(){
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    ctx.scale(DPR, DPR);
    
    blobs = [];
    for(var i=0; i<6; i++) {
      blobs.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 300 + 200, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, phase: Math.random() * Math.PI * 2 });
    }

    particles = []; doodles = [];
    for(var j=0; j<60; j++) {
      particles.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.5, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, alpha: Math.random() });
    }
  }

  function loop(time){
    ctx.clearRect(0, 0, W, H);
    var theme = document.documentElement.getAttribute('data-theme') || 'dark';
    var color1, color2, partColor, pal = null;
    var speedMult = 1;

    // 🎨 RÉACTION AUX THEMES
    if(theme === 'cyberpunk') { 
      color1 = 'rgba(255, 0, 127, 0.2)'; color2 = 'rgba(0, 240, 255, 0.2)'; partColor = '#00F0FF';
      speedMult = 3; // Les particules vont très vite (style data/hacker)
    }
    else if(theme === 'sunset') { 
      color1 = 'rgba(255, 75, 75, 0.2)'; color2 = 'rgba(255, 179, 71, 0.2)'; partColor = '#FFB347';
      speedMult = 0.4; // Mouvement lent et chaleureux
    }
    else if(theme === 'forest') { 
      color1 = 'rgba(52, 211, 153, 0.15)'; color2 = 'rgba(251, 191, 36, 0.15)'; partColor = '#FDE68A';
      speedMult = 0.8;
    }
    else if(theme === 'streetwear' || theme === 'dark') { 
      color1 = 'rgba(255, 42, 42, 0.15)'; // Rouge
      color2 = 'rgba(255, 222, 0, 0.1)'; // Jaune
      partColor = '#FFDE00';
      pal = ['rgba(255,42,42,.20)','rgba(255,222,0,.16)','rgba(47,125,246,.18)','rgba(255,110,180,.16)','rgba(18,181,166,.14)','rgba(255,138,31,.16)'];
      speedMult = 1.6; // Mouvement rapide style BD
    }
    else { 
      color1 = 'rgba(121, 87, 255, 0.15)'; color2 = 'rgba(184, 255, 69, 0.15)'; partColor = '#B8FF45';
      speedMult = 1; 
    }

    blobs.forEach(function(b, i) {
      b.x += b.vx * speedMult; b.y += b.vy * speedMult;
      if(b.x < -b.r) b.x = W + b.r; if(b.x > W + b.r) b.x = -b.r;
      if(b.y < -b.r) b.y = H + b.r; if(b.y > H + b.r) b.y = -b.r;
      
      var scale = 1 + Math.sin(time * 0.001 * speedMult + b.phase) * 0.2;
      var grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * scale);
      grad.addColorStop(0, pal ? pal[i % pal.length] : (i % 2 === 0 ? color1 : color2));
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * scale, 0, Math.PI * 2); ctx.fill();
    });

    particles.forEach(function(p) {
      p.x += p.vx * speedMult; p.y += p.vy * speedMult;
      if(p.x < 0) p.x = W; if(p.x > W) p.x = 0;
      if(p.y < 0) p.y = H; if(p.y > H) p.y = 0;

      var dx = p.x - mouse.x, dy = p.y - mouse.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var rx = p.x, ry = p.y;
      if(dist < 150) {
        var force = (150 - dist) / 150;
        rx += (dx / dist) * force * 50;
        ry += (dy / dist) * force * 50;
      }

      p.alpha += (Math.random() - 0.5) * 0.1;
      if(p.alpha < 0.2) p.alpha = 0.2; if(p.alpha > 1) p.alpha = 1;

      ctx.beginPath(); ctx.arc(rx, ry, p.r, 0, Math.PI * 2);
      ctx.fillStyle = partColor; // La particule prend la couleur du thème !
      ctx.globalAlpha = p.alpha; 
      ctx.fill();

function bzBind(cv){var B=bzS(),D=B.D;if(!D||D.sent||cv._bound===D)return;cv._bound=D;var snap=null;

    var p=pos(e),t=D.tool;

    if(t===4){D.strokes.push({t:4,c:D.color,w:0,p:[p[0],p[1]]});D.pts+=24;repaint();vib(10);bzToolsPaint();return}
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
    OL.drawing=true;

    D.strokes.push(D.cur);D.pts+=(t>=5?14:1);

    if(t>=5){var p=pos(e);D.cur.p[2]=p[0];D.cur.p[3]=p[1];var ctx=cv.getContext('2d');ctx.putImageData(snap,0,0);bzShape(ctx,k,D.cur);return}
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
    for(var i=0;i<evs.length;i++){var p2=pos(evs[i]),q=D.cur.p,lx=q[q.length-2],ly=q[q.length-1];
      if(Math.abs(p2[0]-lx)+Math.abs(p2[1]-ly)<2)continue;
      if(D.pts>=BZ_MAXP){toast('Toile pleine');break}
      q.push(p2[0],p2[1]);D.pts++;var n=q.length/2;

  for(k in g.votes)if(t[g.votes[k]]!=null)t[g.votes[k]]++;
  g.players.forEach(function(id){if(t[id]>mx)mx=t[id]});
  g.win=mx?g.players.filter(function(id){return t[id]===mx}):[];
  g.players.forEach(function(id){pvAdd(g,id,t[id])});
  g.tally=t;g.mx=mx;g.by=g.votes;pvPhase(g,'result',0)}
/* Débat */
function ddVote(g){var jury=pvLive(g).filter(function(id){return id!==g.p1&&id!==g.p2});
  if(!jury.length){ddTally(g);return}
  g.votes={};pvPhase(g,'vote',pvT('dv'))}
function ddTally(g){var n1=0,n2=0,k;
  for(k in g.votes){if(g.votes[k]===g.p1)n1++;else if(g.votes[k]===g.p2)n2++}
  var w=n1>n2?g.p1:(n2>n1?g.p2:null);
  pvAdd(g,g.p1,n1+(w===g.p1?2:0));pvAdd(g,g.p2,n2+(w===g.p2?2:0));
  g.tally={a:n1,b:n2};g.win=w?[w]:[];g.by=g.votes;pvPhase(g,'result',0)}
/* Qui a écrit ça */
function cGuess(g){var order=shuffle(g.players.filter(function(id){return g.answers[id]!=null}));
  g.order=order;g.ci=0;g.guesses={};
  if(order.length<2){cResult(g);return}
  pvPhase(g,'guess',pvT('cg'))}
function cReveal(g){var au=g.order[g.ci],right=[],wrong=[],k;
  for(k in g.guesses){if(g.guesses[k]===au)right.push(k);else wrong.push(k)}
  right.forEach(function(id){pvAdd(g,id,2)});pvAdd(g,au,wrong.length);
  g.rev={a:au,t:g.answers[au],right:right,wrong:wrong,ci:g.ci};
  pvPhase(g,'reveal',7)}
function cNext(g){g.ci++;g.guesses={};
  if(g.ci>=g.order.length){cResult(g);return}
  pvPhase(g,'guess',pvT('cg'))}
function cResult(g){g.recap=(g.order||[]).map(function(id){return {id:id,t:g.answers[id]}});pvPhase(g,'result',0)}
/* Bluff Quiz */
function fVote(g){var list=[],map={};
  g.players.forEach(function(id){var t=g.answers[id];if(t==null)return;var k=pvNorm(t);
    if(map[k]==null){map[k]=list.length;list.push({t:t,ids:[id],real:0})}else list[map[k]].ids.push(id)});
  list.push({t:g.real,ids:[],real:1});
  g.opts=shuffle(list);g.vb={};pvPhase(g,'vote',pvT('fv'))}
function fTally(g){var k;
  for(k in g.vb){var o=g.opts[g.vb[k]];if(!o)continue;
    if(o.real)pvAdd(g,k,2);else o.ids.forEach(function(id){pvAdd(g,id,1)})}
  pvPhase(g,'result',0)}

function hpvAct(uid,a,g){
  var host=uid===PID,T=a.t,isP=g.players.indexOf(uid)>=0;
  if(T==='cont'){if(!host)return false;return pvNext(g)}
  if(T==='skip'){if(g.ph==='end'||g.ph==='result')return false;
    var ok=host||(g.g==='dd'&&g.ph==='play'&&(uid===g.p1||uid===g.p2));
    if(!ok||a.k!==g.vk)return false;return pvForce(g)}
  if(T==='tick'){if(!host||a.k!==g.vk||!g.endsAt||Date.now()<g.endsAt-120)return false;return pvForce(g)}
  if(!isP||a.k!==g.vk)return false;
  var k=g.g;
  if(k==='s'&&T==='vote'){
    if(g.ph!=='play'||g.voted.indexOf(uid)>=0||a.v===uid||g.players.indexOf(a.v)<0)return false;
    g.votes[uid]=a.v;g.voted.push(uid);if(pvAll(g,g.players))sTally(g);return}
  if(k==='dd'&&T==='vote'){
    if(g.ph!=='vote'||uid===g.p1||uid===g.p2||g.voted.indexOf(uid)>=0||(a.v!==g.p1&&a.v!==g.p2))return false;
    g.votes[uid]=a.v;g.voted.push(uid);
    if(pvAll(g,pvLive(g).filter(function(id){return id!==g.p1&&id!==g.p2})))ddTally(g);return}
  if((k==='c'||k==='f')&&T==='write'){
    if(g.ph!=='write'||g.voted.indexOf(uid)>=0)return false;
    var t=String(a.tx||'').replace(/\s+/g,' ').trim().slice(0,80);if(!t)return false;
    if(k==='f'&&pvNorm(t)===pvNorm(g.real)){if(g.rej.indexOf(uid)<0)g.rej.push(uid);return}
    g.rej=g.rej.filter(function(x){return x!==uid});
    g.answers[uid]=t;g.voted.push(uid);if(pvAll(g,g.players)){if(k==='c')cGuess(g);else fVote(g)}return}
  if(k==='c'&&T==='guess'){
    var au=g.order&&g.order[g.ci];
    if(g.ph!=='guess'||uid===au||g.voted.indexOf(uid)>=0||a.v===uid||g.players.indexOf(a.v)<0)return false;
    g.guesses[uid]=a.v;g.voted.push(uid);
    if(pvAll(g,g.players.filter(function(id){return id!==au})))cReveal(g);return}
  if(k==='f'&&T==='vote'){
    var o=g.opts&&g.opts[a.i];
    if(g.ph!=='vote'||!o||o.ids.indexOf(uid)>=0||g.voted.indexOf(uid)>=0)return false;
    g.vb[uid]=+a.i;g.voted.push(uid);if(pvAll(g,g.players))fTally(g);return}
  return false}

function pvPub(g){
  var s={g:g.g,gid:g.gid,ph:g.ph,players:g.players,round:g.round,rounds:g.rounds,vk:g.vk,voted:g.voted,dur:g.dur,left:g.endsAt?Math.max(0,g.endsAt-Date.now()):0,pts:g.pts,rg:g.rg,q:g.q};
  if(g.g==='s'){if(g.ph==='result'){s.tally=g.tally;s.win=g.win;s.by=g.by;s.mx=g.mx}}
  else if(g.g==='dd'){s.p1=g.p1;s.p2=g.p2;if(g.ph==='result'){s.tally=g.tally;s.win=g.win;s.by=g.by}}
  else if(g.g==='c'){
    if(g.ph==='guess'){s.ans=g.answers[g.order[g.ci]];s.ci=g.ci;s.n=g.order.length;s.ah=pvH(g.order[g.ci]+g.vk)}
    if(g.ph==='reveal'){s.rev=g.rev;s.n=g.order.length}
    if(g.ph==='result')s.recap=g.recap}
  else{
    if(g.ph==='write')s.rej=g.rej;
    if(g.ph==='vote')s.opts=g.opts.map(function(o){return {t:o.t,h:o.ids.map(function(id){return pvH(id+g.vk)})}});
    if(g.ph==='result'){s.opts=g.opts;s.vb=g.vb;s.real=g.real}}
  return s}

/* minuteur côté hôte : avance la phase quand le chrono est écoulé */
function pvSched(){clearTimeout(OL.pvt);var g=OL.G;if(!OL.host||!g||!PVG[g.g]||!g.endsAt)return;
  var vk=g.vk;OL.pvt=setTimeout(function(){var g2=OL.G;if(!g2||g2.vk!==vk)return;sendAct('tick',{k:vk})},Math.max(60,g.endsAt-Date.now()+140))}

/* ---------- client ---------- */
function pvOnState(p,s){
  s.endL=Date.now()+(s.left||0);
  if(!p||p.gid!==s.gid)return;
  if(p.vk!==s.vk&&s.ph!=='end'){
    var cue=null;
    if(s.ph==='result')cue=null;
    else if(s.g==='dd'&&s.ph==='vote')cue='PLACE AU VOTE';
    else if(s.g==='c'&&s.ph==='guess'&&p.ph==='write')cue='QUI A ÉCRIT ÇA ?';
    else if(s.g==='f'&&s.ph==='vote')cue='TROUVE LA VRAIE !';
    if(cue&&!OL.display&&!RM&&typeof playCinemaText==='function')playCinemaText(cue,1500);
    else if(typeof sfxPop==='function')sfxPop();
  }
  if(s.ph==='end'&&p.ph!=='end')OL.fxEnd=true}

function pvSecLeft(s){return Math.max(0,Math.ceil(((s.endL||0)-Date.now())/1000))}
function pvTimer(s){if(!s.dur||!s.endL)return '';
  return '<div class="pvtm" data-end="'+s.endL+'" data-dur="'+(s.dur*1000)+'" role="timer"><i></i><b>'+pvSecLeft(s)+'</b></div>'}
function pvBar(s){return obar(PV_ICON[s.g]+' '+PV_NAME[s.g]+' · '+s.round+'/'+s.rounds)}
function pvIn(s){return s.players.indexOf(PID)>=0}
function pvDone(s){return s.voted.indexOf(PID)>=0||OL.my.vote===s.vk}
function pvWho(s,list){list=list||s.players;
  return '<div class="pvwho">'+list.map(function(id){var d=s.voted.indexOf(id)>=0||(id===PID&&OL.my.vote===s.vk);
    return '<span class="pvav'+(d?' ok':'')+'">'+pav(id,true)+'<em>'+esc(pn(id))+'</em><u>✓</u></span>'}).join('')+'</div>'}
function pvDockHost(s,extra){return OL.host&&s.ph!=='result'&&s.ph!=='end'?'<button class="btn btn-secondary" data-act="pvskip">Passer ⏭ (hôte)</button>':''}
function pvWait(s,title,sub,list){
  return pvBar(s)+'<div class="wrap pvwrap"><div class="pvbig">'+esc(s.q||'')+'</div>'+pvTimer(s)+
  '<div class="pvwaitc"><div class="pvpen">✏️</div><h2>'+title+'</h2><p class="muted">'+(sub||'')+'</p></div>'+pvWho(s,list)+
  '<p class="pvquip">'+esc(PV_QUIPS[(s.round*3+s.players.length)%PV_QUIPS.length])+'</p></div>'+
  (pvDockHost(s)?'<div class="dock">'+pvDockHost(s)+'</div>':'')}
function pvRank(s){return s.players.slice().sort(function(a,b){return (s.pts[b]||0)-(s.pts[a]||0)})}
function pvScore(s){var r=pvRank(s);
  return '<section class="card pvscore"><h3>Classement</h3>'+r.map(function(id,i){var g=(s.rg&&s.rg[id])||0;
    return '<div class="pvrow pvrise" style="animation-delay:'+(i*70+300)+'ms"><span class="pvk">'+(i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1))))+'</span>'+pav(id,true)+'<span class="nm">'+esc(pn(id))+'</span>'+(g?'<span class="pvg">+'+g+'</span>':'')+'<b class="pvpts">'+(s.pts[id]||0)+'</b></div>'}).join('')+'</section>'}
function pvNextDock(s){
  var last=s.round>=s.rounds;
  return '<div class="dock">'+(OL.host?'<button class="btn btn-primary" data-act="pvnext">'+(last?'🏆 Voir le podium':'Manche suivante ▶')+'</button>':'<p class="note">En attente de l\'hôte…</p>')+'</div>'}
function pvPickGrid(ids,sel){
  return '<div class="grid pvgrid">'+ids.map(function(id,i){return '<button class="pick pvpop" style="animation-delay:'+(i*50)+'ms" data-act="pvpick" data-id="'+esc(id)+'" aria-pressed="'+(sel===id)+'">'+pav(id)+esc(pn(id))+'</button>'}).join('')+'</div>'}
function pvSendDock(s,label,ok){
  return '<div class="dock"><button class="btn btn-primary" data-act="pvsend"'+(ok?'':' disabled')+'>'+label+'</button>'+pvDockHost(s)+'</div>'}

function vOGamePV(){var s=OL.s;if(!s||!PVG[s.g])return vOLoad('Chargement de la partie…');
  if(s.ph==='end')return pvEnd(s);
  return {s:pvVS,dd:pvVD,c:pvVC,f:pvVF}[s.g](s)}

/* --- Le Plus Susceptible --- */
function pvVS(s){var inn=pvIn(s);
  var qh='<div class="pvq">Qui est le plus susceptible de<span>'+esc(s.q)+'</span>?</div>';
  if(s.ph==='play'){
    if(!inn||pvDone(s))return pvBar(s)+'<div class="wrap pvwrap">'+qh+pvTimer(s)+'<div class="pvwaitc"><div class="pvpen">🗳️</div><h2>'+(inn?'Vote envoyé !':'Les joueurs votent')+'</h2><p class="muted">En attente des autres…</p></div>'+pvWho(s)+'</div>'+(pvDockHost(s)?'<div class="dock">'+pvDockHost(s)+'</div>':'');
    var c=s.players.filter(function(id){return id!==PID});
    return pvBar(s)+'<div class="wrap pvwrap">'+qh+pvTimer(s)+pvPickGrid(c,OL.pick)+'</div>'+
      pvSendDock(s,OL.pick?'Voter pour '+esc(pn(OL.pick)):'Choisis un joueur',!!OL.pick)}
  var wn=s.win||[],names=wn.map(pn).join(' & ');
  var rows=s.players.map(function(id){return [id,s.tally[id]||0]}).sort(function(a,b){return b[1]-a[1]});
  var mx=s.mx||1;
  var by=s.by||{};
  var bylist=s.players.filter(function(id){return by[id]}).map(function(id,i){return '<div class="pvvote pvrise" style="animation-delay:'+(900+i*120)+'ms">'+pav(id,true)+'<span>➜</span>'+pav(by[id],true)+'<em>'+esc(pn(id))+' → '+esc(pn(by[id]))+'</em></div>'}).join('');
  return pvBar(s)+'<div class="wrap pvwrap">'+qh+
  '<div class="pvwin pvfx" data-fx="'+(wn.indexOf(PID)>=0?'win':'meh')+'" data-key="'+esc(s.vk)+'"><div class="pvcrown">👑</div><span class="eyebrow">'+(wn.length?(wn.length>1?'Égalité !':'Le plus susceptible'):'Personne n\'a voté')+'</span><h1>'+(wn.length?esc(names):'…')+'</h1>'+(wn.length&&wn.indexOf(PID)>=0?'<p class="lead">C\'est toi. On s\'en doutait. 😏</p>':'')+'</div>'+
  '<section class="card"><h3>Résultat des votes</h3><div class="tally">'+rows.map(function(r,i){return r[1]?'<div class="trow pvrise" style="animation-delay:'+(i*120+200)+'ms"><span class="nm">'+esc(pn(r[0]))+'</span><span class="ct">'+r[1]+' vote'+(r[1]>1?'s':'')+'</span><span class="tb"><i style="width:'+(r[1]/mx*100)+'%"></i></span></div>':''}).join('')+'</div></section>'+
  (bylist?'<section class="card"><h3>Qui a voté pour qui ?</h3><div class="pvvotes">'+bylist+'</div></section>':'')+
  pvScore(s)+'</div>'+pvNextDock(s)}

/* --- Débat Impossible --- */
function pvVD(s){var inn=pvIn(s),isP1=PID===s.p1,isP2=PID===s.p2,jury=inn&&!isP1&&!isP2;
  var vs='<div class="pvvs"><div class="pvside pro">'+pav(s.p1)+'<b>'+esc(pn(s.p1))+'</b><i>POUR</i></div><div class="pvx">VS</div><div class="pvside con">'+pav(s.p2)+'<b>'+esc(pn(s.p2))+'</b><i>CONTRE</i></div></div>';
  var topic='<div class="pvq pvtopic"><span>Le sujet</span>« '+esc(s.q)+' »</div>';
  if(s.ph==='play'){
    if(isP1||isP2){var pro=isP1;
      return pvBar(s)+'<div class="wrap pvwrap">'+topic+pvTimer(s)+'<div class="pvstamp '+(pro?'pro':'con')+'" data-key="'+esc(s.vk)+'">'+(pro?'POUR':'CONTRE')+'</div><p class="lead" style="text-align:center">Tu défends le <b>'+(pro?'POUR':'CONTRE')+'</b>. Parle à voix haute, sois de mauvaise foi, fais rire le jury !</p>'+vs+'</div><div class="dock"><button class="btn btn-primary" data-act="pvskip">J\'ai fini, au vote ▶</button></div>'}
    return pvBar(s)+'<div class="wrap pvwrap">'+topic+pvTimer(s)+vs+'<p class="pvquip">'+(jury?'Tu es dans le jury : écoute bien, puis vote !':'Écoutez le débat…')+'</p></div>'+(pvDockHost(s)?'<div class="dock">'+pvDockHost(s)+'</div>':'')}
  if(s.ph==='vote'){
    if(!jury||pvDone(s)){var jl=s.players.filter(function(id){return id!==s.p1&&id!==s.p2});
      return pvBar(s)+'<div class="wrap pvwrap">'+topic+pvTimer(s)+'<div class="pvwaitc"><div class="pvpen">⚖️</div><h2>'+(jury?'Vote envoyé !':'Le jury délibère…')+'</h2></div>'+pvWho(s,jl)+'</div>'+(pvDockHost(s)?'<div class="dock">'+pvDockHost(s)+'</div>':'')}
    return pvBar(s)+'<div class="wrap pvwrap">'+topic+pvTimer(s)+'<p class="lead" style="text-align:center">Qui a été le plus convaincant ?</p>'+
      '<div class="grid pvgrid"><button class="pick pvpop" data-act="pvpick" data-id="'+esc(s.p1)+'" aria-pressed="'+(OL.pick===s.p1)+'">'+pav(s.p1)+esc(pn(s.p1))+'<br><span class="small muted">défendait le POUR</span></button><button class="pick pvpop" style="animation-delay:80ms" data-act="pvpick" data-id="'+esc(s.p2)+'" aria-pressed="'+(OL.pick===s.p2)+'">'+pav(s.p2)+esc(pn(s.p2))+'<br><span class="small muted">défendait le CONTRE</span></button></div></div>'+
      pvSendDock(s,OL.pick?'Valider mon vote':'Choisis un débatteur',!!OL.pick)}
  var w=s.win&&s.win[0],a=s.tally.a,b=s.tally.b,mx=Math.max(a,b,1);
  return pvBar(s)+'<div class="wrap pvwrap">'+topic+

  '<section class="card"><div class="tally"><div class="trow"><span class="nm">'+esc(pn(s.p1))+' (POUR)</span><span class="ct">'+a+' vote'+(a>1?'s':'')+'</span><span class="tb"><i style="width:'+(a/mx*100)+'%"></i></span></div><div class="trow"><span class="nm">'+esc(pn(s.p2))+' (CONTRE)</span><span class="ct">'+b+' vote'+(b>1?'s':'')+'</span><span class="tb"><i style="width:'+(b/mx*100)+'%"></i></span></div></div></section>'+
  pvScore(s)+'</div>'+pvNextDock(s)}

/* --- champ d'écriture commun (Qui a écrit ça ? / Bluff Quiz) --- */
function pvWriteView(s,head,hint,ph,btn,err){

/* --- Qui a écrit ça ? --- */
function pvVC(s){var inn=pvIn(s);
  if(s.ph==='write'){
    if(!inn||pvDone(s))return pvWait(s,inn?'Réponse envoyée !':'Les joueurs écrivent…','Chut, personne ne doit savoir qui a écrit quoi.');
    return pvWriteView(s,'Réponds en secret','Ta réponse restera anonyme… jusqu\'à ce qu\'on devine qui l\'a écrite.','Ta réponse anonyme…','Envoyer ma réponse')}
  if(s.ph==='guess'){var mine=inn&&pvH(PID+s.vk)===s.ah,note='<div class="pvnote pvpop"><span class="pvclip">📎</span><p>« '+esc(s.ans)+' »</p><small>Réponse '+(s.ci+1)+' / '+s.n+'</small></div>';
    if(mine)return pvBar(s)+'<div class="wrap pvwrap">'+note+pvTimer(s)+'<div class="pvwaitc"><div class="pvpen">😇</div><h2>C\'est TA réponse !</h2><p class="muted">Garde ton air innocent. Chaque joueur piégé te rapporte 1 point.</p></div></div>'+(pvDockHost(s)?'<div class="dock">'+pvDockHost(s)+'</div>':'');
    if(!inn||pvDone(s)){var others=s.players.filter(function(id){return pvH(id+s.vk)!==s.ah});
      return pvBar(s)+'<div class="wrap pvwrap">'+note+pvTimer(s)+'<div class="pvwaitc"><div class="pvpen">🔍</div><h2>'+(inn?'Accusation envoyée !':'Les joueurs enquêtent…')+'</h2></div>'+pvWho(s,others)+'</div>'+(pvDockHost(s)?'<div class="dock">'+pvDockHost(s)+'</div>':'')}
    var c=s.players.filter(function(id){return id!==PID});
    return pvBar(s)+'<div class="wrap pvwrap">'+note+pvTimer(s)+'<p class="lead" style="text-align:center">Qui a écrit ça ?</p>'+pvPickGrid(c,OL.pick)+'</div>'+pvSendDock(s,OL.pick?'Accuser '+esc(pn(OL.pick)):'Choisis un suspect',!!OL.pick)}
  if(s.ph==='reveal'){var r=s.rev,me=PID,res='';
    if(r.right.indexOf(me)>=0)res='<p class="pvres ok">🎯 Bien joué ! +2 points</p>';
    else if(r.wrong.indexOf(me)>=0)res='<p class="pvres ko">❌ Raté…</p>';
    else if(r.a===me)res='<p class="pvres ok">😈 '+r.wrong.length+' joueur'+(r.wrong.length>1?'s':'')+' piégé'+(r.wrong.length>1?'s':'')+' : +'+r.wrong.length+'</p>';
    return pvBar(s)+'<div class="wrap pvwrap"><div class="pvnote"><span class="pvclip">📎</span><p>« '+esc(r.t)+' »</p><small>Réponse '+(r.ci+1)+' / '+s.n+'</small></div>'+
    '<div class="pvwin pvfx" data-fx="'+(r.right.indexOf(me)>=0||r.a===me&&r.wrong.length?'win':(r.wrong.indexOf(me)>=0?'sad':'meh'))+'" data-key="'+esc(s.vk)+'"><span class="eyebrow">C\'était…</span><div class="pvwho1">'+pav(r.a)+'</div><h1>'+esc(pn(r.a))+'</h1></div>'+res+
    '<div class="pvguessers">'+r.right.map(function(id){return '<span class="pvchip ok">'+esc(pn(id))+' 🎯</span>'}).join('')+r.wrong.map(function(id){return '<span class="pvchip ko">'+esc(pn(id))+' ❌</span>'}).join('')+'</div>'+pvTimer(s)+'</div>'+
    '<div class="dock">'+(OL.host?'<button class="btn btn-primary" data-act="pvskip">Suite ▶</button>':'<p class="note">La suite arrive…</p>')+'</div>'}
  return pvBar(s)+'<div class="wrap pvwrap"><div class="pvq pvtopic"><span>La question était</span>'+esc(s.q)+'</div>'+
  '<section class="card"><h3>Toutes les réponses</h3>'+(s.recap&&s.recap.length?s.recap.map(function(x,i){return '<div class="pvans pvrise" style="animation-delay:'+(i*110)+'ms"><p>« '+esc(x.t)+' »</p><div>'+pav(x.id,true)+'<em>'+esc(pn(x.id))+'</em></div></div>'}).join(''):'<p class="muted">Pas assez de réponses cette manche.</p>')+'</section>'+pvScore(s)+'</div>'+pvNextDock(s)}

/* --- Bluff Quiz --- */
function pvVF(s){var inn=pvIn(s);
  if(s.ph==='write'){var rej=inn&&s.rej&&s.rej.indexOf(PID)>=0&&s.voted.indexOf(PID)<0;
    if(!inn||(pvDone(s)&&!rej))return pvWait(s,inn?'Bluff envoyé !':'Les joueurs bluffent…','Chacun invente une fausse réponse crédible.');
    return pvWriteView(s,'Quiz bluff','Invente une FAUSSE réponse qui ressemble à la vraie. Plus elle est crédible, plus tu piégeras de monde !','Ta fausse réponse…','Envoyer mon bluff',rej?'😬 Trop proche de la vraie réponse (ou identique) ! Invente-en une autre.':'')}
  if(s.ph==='vote'){
    var qh='<div class="pvq pvtopic"><span>Quelle est la VRAIE réponse ?</span>'+esc(s.q)+'</div>';
    if(!inn||pvDone(s))return pvBar(s)+'<div class="wrap pvwrap">'+qh+pvTimer(s)+'<div class="pvwaitc"><div class="pvpen">🤞</div><h2>'+(inn?'Vote envoyé !':'Les joueurs hésitent…')+'</h2></div>'+pvWho(s)+'</div>'+(pvDockHost(s)?'<div class="dock">'+pvDockHost(s)+'</div>':'');
    var my=pvH(PID+s.vk);
    return pvBar(s)+'<div class="wrap pvwrap">'+qh+pvTimer(s)+'<div class="pvopts">'+s.opts.map(function(o,i){var own=o.h.indexOf(my)>=0;
      return '<button class="pick pvopt pvpop" style="animation-delay:'+(i*70)+'ms" data-act="pvpick" data-i="'+i+'" aria-pressed="'+(OL.pick===i)+'"'+(own?' disabled':'')+'>'+esc(o.t)+(own?' <small class="muted">(la tienne)</small>':'')+'</button>'}).join('')+'</div></div>'+
      pvSendDock(s,OL.pick!=null?'Voter pour cette réponse':'Choisis une réponse',OL.pick!=null)}
  var vb=s.vb||{},cnt={};for(var k in vb)(cnt[vb[k]]=cnt[vb[k]]||[]).push(k);
  var myPick=vb[PID],fell=myPick!=null&&s.opts[myPick]&&!s.opts[myPick].real,found=myPick!=null&&s.opts[myPick]&&s.opts[myPick].real;
  return pvBar(s)+'<div class="wrap pvwrap"><div class="pvq pvtopic"><span>La question était</span>'+esc(s.q)+'</div>'+
  '<div class="pvwin pvfx" data-fx="'+(found?'win':(fell?'sad':'meh'))+'" data-key="'+esc(s.vk)+'"><span class="eyebrow">La vraie réponse</span><h1>'+esc(s.real)+'</h1>'+(found?'<p class="lead">🎯 Tu l\'avais trouvée ! +2</p>':(fell?'<p class="lead">😵 Tu es tombé dans le piège…</p>':''))+'</div>'+
  '<div class="pvopts">'+s.opts.map(function(o,i){var vs=(cnt[i]||[]);
    return '<div class="pvres2 pvrise'+(o.real?' real':'')+'" style="animation-delay:'+(i*130+250)+'ms"><div class="pvt">'+esc(o.t)+(o.real?' <span class="pvstampmini">VRAI</span>':'')+'</div><div class="pvmeta">'+(o.real?'<span class="muted small">La vérité vraie</span>':'<span class="muted small">🎭 bluff de '+(o.ids.map(function(id){return esc(pn(id))}).join(' & '))+'</span>')+'</div>'+(vs.length?'<div class="pvvoters">'+vs.map(function(id){return pav(id,true)}).join('')+'<span class="small muted">'+vs.length+' vote'+(vs.length>1?'s':'')+'</span></div>':'')+'</div>'}).join('')+'</div>'+
  pvScore(s)+'</div>'+pvNextDock(s)}

/* --- Fin : podium --- */
function pvEnd(s){var r=pvRank(s),top=r.slice(0,3),rest=r.slice(3),ord=[1,0,2].filter(function(i){return top[i]});
  var h=['pvh2','pvh1','pvh3'];
  return pvBar(s)+'<div class="wrap pvwrap"><div class="pvend pvfx" data-fx="'+(r[0]===PID?'win':'meh')+'" data-key="'+esc(s.gid)+'-end"><span class="eyebrow">Partie terminée</span><h1>🏆 Le podium</h1></div>'+
  '<div class="pvpodium">'+ord.map(function(i){var id=top[i];return '<div class="pvstep '+h[i]+'" style="animation-delay:'+((2-i)*350+200)+'ms"><div class="pvcr">'+(i===0?'👑':'')+'</div>'+pav(id)+'<b>'+esc(pn(id))+'</b><em>'+(s.pts[id]||0)+' pts</em><div class="pvbase"><span>'+(i+1)+'</span></div></div>'}).join('')+'</div>'+
  (rest.length?'<section class="card">'+rest.map(function(id,i){return '<div class="pvrow"><span class="pvk">'+(i+4)+'</span>'+pav(id,true)+'<span class="nm">'+esc(pn(id))+'</span><b class="pvpts">'+(s.pts[id]||0)+'</b></div>'}).join('')+'</section>':'')+
  '<p class="muted small" style="text-align:center">Bravo à tous ! 🎉</p></div>'+
  '<div class="dock">'+(OL.host?'<button class="btn btn-primary" data-act="oagain">'+(OL.cfg&&OL.cfg.games&&OL.cfg.games.length>1?'Jeu suivant ▶':'🔁 Rejouer')+'</button>':'<p class="note">L\'hôte peut relancer une partie.</p>')+'</div>'}

/* --- Salle d'attente commune --- */
function vOLobbyPV(){var g=OL.game,c=OL.cfg||{},h=OL.host,n=OL.plist.length,iss=n<3?'Il faut au moins 3 joueurs.':'';
  var rounds=+c.rounds||5,pace=c.pace||'normal';
  function seg(k,items,cur){return '<div class="seg">'+items.map(function(it){return '<button data-act="pvcfg" data-k="'+k+'" data-v="'+it[0]+'" aria-pressed="'+(String(cur)===String(it[0]))+'">'+it[1]+'</button>'}).join('')+'</div>'}
  var paceTxt={chill:'Relax',normal:'Normal',fast:'Rapide'};
  var set=h?'<section class="card"><h2>Réglages</h2>'+
    '<div class="lbl"><b>Nombre de manches</b></div>'+seg('rounds',[[3,'3'],[5,'5'],[8,'8'],[12,'12']],rounds)+
    '<div class="lbl" style="margin-top:12px"><b>Temps pour réfléchir / écrire / débattre</b></div>'+seg('pace',[['chill','🐢 Relax'],['normal','⏱️ Normal'],['fast','⚡ Rapide']],pace)+
    '<p class="muted small" style="margin-top:8px">'+(g==='dd'?'Débat : '+PV_T.dt[pace==='chill'?0:(pace==='fast'?2:1)]+' s par joueur.':(g==='c'?'Écriture : '+PV_T.cw[pace==='chill'?0:(pace==='fast'?2:1)]+' s.':(g==='f'?'Écriture du bluff : '+PV_T.fw[pace==='chill'?0:(pace==='fast'?2:1)]+' s.':'Vote : '+PV_T.sv[pace==='chill'?0:(pace==='fast'?2:1)]+' s.')))+'</p></section>'
    :'<section class="card"><h2>Réglages</h2><p>'+rounds+' manches · rythme '+paceTxt[pace]+'</p><p class="muted small">C\'est l\'hôte qui choisit les réglages.</p></section>';
  return obar(PV_ICON[g]+' '+PV_NAME[g])+'<div class="wrap">'+olShare()+olPlayers()+set+
  '<section class="card"><h2>Comment jouer ?</h2><p class="muted small">'+PV_RULES[g]+'</p></section></div>'+olDock(iss)}

/* --- actions client --- */
function pvAct(a,d){var s=OL.s;
  switch(a){
    case 'pvcfg':{if(!OL.host)break;var c=OL.cfg||(OL.cfg={});c[d.k]=d.k==='rounds'?+d.v:d.v;olPushCfg();render();break}
    case 'pvpick':OL.pick=d.i!=null&&d.i!==''&&d.id==null?+d.i:d.id;render();break;
    case 'pvsend':{if(!s||OL.pick==null||OL.my.vote===s.vk)break;OL.my.vote=s.vk;
      if(s.g==='f')sendAct('vote',{i:OL.pick,k:s.vk});
      else if(s.g==='c')sendAct('guess',{v:OL.pick,k:s.vk});
      else sendAct('vote',{v:OL.pick,k:s.vk});
      vib(30);olRender();break}
    case 'pvnext':sendAct('cont');break;
    case 'pvskip':if(s)sendAct('skip',{k:s.vk});break;
    default:return false}}
app.addEventListener('submit',function(e){
  if(e.target.id!=='pvform')return;e.preventDefault();
  var s=OL.s,inp=document.getElementById('pvin'),v=inp?inp.value.trim():'';
  if(!s||!v||e.target.dataset.vk!==s.vk)return;
  OL.my.vote=s.vk;sendAct('write',{tx:v,k:s.vk});vib(30);
  if(inp)inp.blur();olRender()});

/* chrono visuel (sans re-rendre) + sécurité si le champ de saisie bloque le rendu */
setInterval(function(){
  var s=OL.s;if(!OL.on||S.screen!=='online'||!s||!PVG[s.g])return;
  var f=document.getElementById('pvform');
  if(f&&f.dataset.vk!==s.vk){var ae=document.activeElement;if(ae&&ae.blur)ae.blur();OL.deferred=false;olRender()}
  var ts=document.querySelectorAll('.pvtm');
  for(var i=0;i<ts.length;i++){var t=ts[i],end=+t.dataset.end,dur=+t.dataset.dur||1,left=Math.max(0,end-Date.now()),b=t.querySelector('b'),bar=t.querySelector('i');
    if(b)b.textContent=Math.ceil(left/1000);
    if(bar)bar.style.transform='scaleX('+Math.max(0,Math.min(1,left/dur))+')';
    t.classList.toggle('low',left<=6000&&left>0);
    var sec=Math.ceil(left/1000);
    if(left>0&&left<=5000&&t.dataset.last!==String(sec)){t.dataset.last=String(sec);if(typeof sfxTick==='function')try{sfxTick()}catch(x){}}}
},250);

/* effets après rendu */
function pvPost(){var s=OL.s;if(!OL.on||S.screen!=='online'||!s||!PVG[s.g])return;
  var el=app.querySelector('.pvfx');
  if(el){var key=el.dataset.key;if(OL.pvfx!==key){OL.pvfx=key;var fx=el.dataset.fx;
    setTimeout(function(){var e2=app.querySelector('.pvfx');if(!e2)return;
      if(fx==='win'){celebrate(e2,true)}
      else if(fx==='sad'){if(typeof sad==='function')sad(e2)}
      else{if(typeof tapSparkle==='function')tapSparkle(e2);if(typeof sfxPop==='function')sfxPop()}
    },350)}}
  var st=app.querySelector('.pvstamp');
  if(st&&OL.pvst!==st.dataset.key){OL.pvst=st.dataset.key;if(typeof sfxWhoosh==='function')sfxWhoosh();vib(60)}
  var tm=app.querySelector('.pvtm');
  if(tm){var left=Math.max(0,(+tm.dataset.end)-Date.now()),dur=+tm.dataset.dur||1,bar=tm.querySelector('i');
    if(bar)bar.style.transform='scaleX('+Math.max(0,Math.min(1,left/dur))+')'}}

SUSCEPT.push.apply(SUSCEPT,PV_SUS_MORE);DEBATS.push.apply(DEBATS,PV_DEB_MORE);

/* Son de fin de partie (appelé par l'index d'origine mais jamais défini : sans lui, la fanfare de fin plantait) */
function sfxFanfare(win){var n=win?[523.25,659.25,783.99,1046.5]:[392,330,262,196];n.forEach(function(f,i){setTimeout(function(){sfxTone(f,f,.22,'triangle',.07)},i*140)})}

})();
</script>
